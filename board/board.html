<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lodgy — Build Board</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #5c6470;
  --border: #dfe2e6; --accent: #3b6fd6; --shadow: 0 1px 2px rgba(0,0,0,.08);
  --todo: #8a94a6; --inprogress: #d68b3b; --testing: #a15fd6;
  --done: #3ba15f; --delivered: #2f855a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --panel: #1e2126; --text: #eceef1; --muted: #9aa3af;
    --border: #2b2f36; --accent: #6d9bef; --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--bg); color: var(--text);
}
header {
  padding: 20px 24px 8px; display: flex; flex-direction: column; gap: 14px;
}
h1 { margin: 0; font-size: 1.4rem; }
.subtitle { color: var(--muted); font-size: .85rem; margin-top: 2px; }

.stats {
  display: flex; flex-wrap: wrap; gap: 12px;
}
.stat-tile {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 16px; min-width: 110px; box-shadow: var(--shadow);
}
.stat-tile .num { font-size: 1.4rem; font-weight: 600; }
.stat-tile .label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

.progress-bar {
  height: 10px; border-radius: 6px; overflow: hidden; display: flex;
  border: 1px solid var(--border); background: var(--panel);
}
.progress-bar > div { height: 100%; }

.controls {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.controls input, .controls select {
  padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); font-size: .85rem;
}

.board {
  display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr));
  gap: 14px; padding: 12px 24px 32px; overflow-x: auto;
}
.column { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.column-header {
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 600; font-size: .85rem; padding: 6px 4px;
  border-bottom: 3px solid var(--col-color, var(--border));
}
.column-header .count {
  background: var(--col-color, var(--muted)); color: white; border-radius: 999px;
  padding: 1px 8px; font-size: .72rem;
}
.cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }

.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; box-shadow: var(--shadow); cursor: pointer;
}
.card:hover { border-color: var(--accent); }
.card .id { font-size: .7rem; color: var(--muted); }
.card .title { font-size: .88rem; margin: 3px 0 6px; }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.badge {
  font-size: .68rem; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--muted);
}
.badge.priority-High { color: #c0392b; border-color: #c0392b55; }
.badge.priority-Medium { color: #b8860b; border-color: #b8860b55; }
.badge.priority-Low { color: var(--muted); }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
  align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto;
}
.overlay.open { display: flex; }
.modal {
  background: var(--panel); border-radius: 12px; padding: 22px 24px; max-width: 640px;
  width: 100%; box-shadow: var(--shadow); border: 1px solid var(--border);
}
.modal h2 { margin: 0 0 4px; font-size: 1.1rem; }
.modal .modal-id { color: var(--muted); font-size: .8rem; }
.modal .section { margin-top: 16px; }
.modal .section h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
.modal ul { margin: 0; padding-left: 20px; font-size: .88rem; }
.modal .close-btn {
  float: right; background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--muted);
}
.history-item {
  border-left: 2px solid var(--border); padding: 4px 0 4px 12px; margin-bottom: 8px; font-size: .82rem;
}
.history-item .h-meta { color: var(--muted); font-size: .72rem; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Lodgy — Build Board</h1>
    <div class="subtitle">Generated by scripts/generate_board.py — source of truth is board/tickets/*.json</div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="progress-bar" id="progressBar"></div>

  <div class="controls">
    <input id="search" type="search" placeholder="Search tickets…">
    <select id="epicFilter"></select>
  </div>
</header>

<main class="board" id="board"></main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

shared add/edit form, SavedStateHandle-driven hostelId nav arg decides mode). Wired into LodgyNavHost: Property tab now shows HostelListScreen instead of the placeholder, with a hostel_form?hostelId={id} route pushed on top for add/edit (bottom nav bar hides itself on that route, matching the wireframe). `gradlew assembleDebug` -> BUILD SUCCESSFUL. AC1 (create/edit/list) and AC2 (switcher changes active context, persisted) both implemented; not yet exercised on-device - this session's emulator has been extremely slow to cold-boot (Windows host, WHPX acceleration confirmed available but still ~15+ min for one boot), so on-device verification is queued for when it comes up rather than blocking every ticket on it. Tester: please actually run this on-device once possible, not just read the code - multi-step nav flows like this are exactly where a code read misses real bugs."}]}, {"id": "LODGY-7", "epic": "Property Setup", "title": "Floor CRUD within a hostel", "description": "Add/edit/reorder/delete floors under a hostel.", "acceptanceCriteria": ["Floors can be added, edited, and deleted under a hostel", "Floors display in the given sort order"], "status": "Testing", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T06:05:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T05:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. Also revising LODGY-6's HostelListScreen: tapping a hostel row now drills into its floor list (and sets it active) instead of only selecting it silently - the wireframe's Prop1->Prop3 flow implies drill-down, and without it there was no path to a hostel's floors at all. LODGY-6 is still in Testing, not Done, so amending it here rather than treating it ", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T06:15:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. The 'blocked if active tenants' AC needs Bed data even though bed-generation UI is LODGY-9's job - the Bed entity/DAO already exist from LODGY-2, so adding a minimal BedRepository now (just a hasOccupiedBed check) to satisfy this ticket's AC; LODGY-9 will extend it with actual bed creation/generation. Going with 'blocked' (not just warned) for the active-tenant case - letting a warden delete a room out from under a live tenant seemed like the riskier reading of an explicit either/or in the AC."}, {"timestamp": "2026-09-03T06:35:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built data/repository/RoomRepository.kt + BedRepository.kt (hasOccupiedBed check), ui/property/RoomListViewModel.kt + RoomListScreen.kt (room cards with type chip, edit/delete icons, delete routes through requestDelete which checks hasOccupiedBed first and shows a blocking AlertDialog instead of deleting if any bed on the room is OCCUPIED), ui/property/RoomFormViewModel.kt + RoomFormScreen.kt (room number, SINGLE/DOUBLE/TRIPLE filter chips, price-per-bed as a numeric field kept as String state and parsed on save, amenities free text). Wired room_list/{floorId} and room_form/{floorId}?roomId={id} into LodgyNavHost; FloorListScreen's onOpenRooms now actually navigates instead of being a no-op. `gradlew assembleDebug` -> BUILD SUCCESSFUL. AC1 (type/price/amenities captured+editable) and AC2 (blocked with occupied bed) both implemented in code; AC2 specifically can't be exercised end-to-end on-device until LODGY-9 lets a bed actually be marked OCCUPIED (right now hasOccupiedBed always returns false since no beds exist yet) - the check itself is real and will engage correctly once beds do, but flagging that Tester can't fully verify AC2's blocking behavior until LODGY-9/13 land. On-device pass still queued behind the slow emulator boot."}]}, {"id": "LODGY-9", "epic": "Property Setup", "title": "Bed generation & status tracking", "description": "Auto-generate the right number of beds for a room based on its type, and track each bed's VACANT/OCCUPIED status independently.", "acceptanceCriteria": ["Creating a DOUBLE room creates exactly 2 beds, TRIPLE creates 3", "Bed status flips correctly on tenant onboarding/checkout"], "status": "Testing", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T09:00:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T06:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - bed auto-generation wired into room creation only (not on later type edits; changing a room's type after beds/tenants exist is a reconciliation problem this ticket's AC doesn't cover, flagging rather than guessing). AC2's flip mechanism (BedRepository.setOccupied/setVacant) is this ticket's job per its own wording, but the actual callers are LODGY-13 (onboarding) and LODGY-14 (checkout) - building the mechanism now, wiring the calls when those land."}, {"timestamp": "2026-09-03T07:00:00+00:00", "actor": "Developer", "action": "comment", "note": "AC1 done and build-verified: RoomFormViewModel.save() now calls bedRepository.generateForRoom(room.id, bedCountFor(type)) right after creating a room (1/2/3 beds for SINGLE/DOUBLE/TRIPLE), and a new BedGridScreen (matching the wireframe) shows each room's beds with VACANT/OCCUPIED status, wired from RoomListScreen's onOpenBeds. AC2's mechanism (BedRepository.setOccupied/setVacant) exists but has no caller yet - deliberately leaving this ticket in In Progress rather than Testing, since 'the flip works on onboarding/checkout' can't honestly be claimed ready for test until LODGY-13/14 actually call it. Will move to Testing once those land and the flip can be exercised end to end. `gradlew assembleDebug` -> BUILD SUCCESSFUL in the meantime."}, {"timestamp": "2026-09-03T08:30:00+00:00", "actor": "Developer", "action": "comment", "note": "Onboarding half of AC2 is now real: LODGY-13's AgreementFormViewModel calls bedRepository.setOccupied on save. Checkout half still pending LODGY-14. Staying In Progress until that lands too, then this moves to Testing as a whole."}, {"timestamp": "2026-09-03T09:00:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Checkout half of AC2 now real too: LODGY-14's CheckoutViewModel calls bedRepository.setVacant on confirm. Both AC1 (bed auto-generation) and AC2 (flip on onboarding via LODGY-13, flip on checkout via LODGY-14) are fully implemented and build-verified. Moving to Testing - recommend testing this alongside LODGY-13/14 on-device since the whole onboard->checkout->re-onboard cycle is what actually exercises this ticket's AC end to end."}]}, {"id": "LODGY-10", "epic": "Property Setup", "title": "Bulk room setup wizard", "description": "Quick-add flow to create N rooms of a given type/price on a floor in one pass, instead of one at a time.", "acceptanceCriteria": ["Warden can specify a count and type and get N rooms created at once", "Each generated room gets correctly numbered and its beds created"], "status": "Todo", "priority": "Low", "assigneeRole": null, "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-02T12:55:59.648423+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}]}, {"id": "LODGY-11", "epic": "Tenant Onboarding", "title": "Tenant profile capture", "description": "Capture tenant name, phone, photo, ID proof photo, emergency contact name/phone.", "acceptanceCriteria": ["Photo and ID proof photo are captured via camera or gallery and stored locally", "All fields are editable after creation"], "status": "Testing", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T07:45:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T07:15:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. Tenant has no bed/room reference at the schema level (that link lives on TenancyAgreement, LODGY-12/13's job), so profile capture is genuinely standalone - building it that way. Also building the Tenant directory list (Tenants tab) and a basic profile view screen, since neither exists anywhere else in the backlog and there's no path to a tenant's profile without them; LODGY-31 will add the quick-contact buttons onto the profile view this creates."}, {"timestamp": "2026-09-03T07:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built media/PhotoStorage.kt (creates a FileProvider camera-output Uri in cacheDir, persists any picked/captured image into filesDir/photos/<uuid>.jpg on IO dispatcher - satisfies DESIGN.md's app-private-storage requirement), ui/tenant/PhotoPickerField.kt (reusable: 'Take Photo' launches the system camera via ActivityResultContracts.TakePicture into a FileProvider Uri, 'Choose Photo' launches the Android Photo Picker via PickVisualMedia - neither needs a runtime permission), data/repository/TenantRepository.kt, and the full Tenant flow: TenantDirectoryScreen (search + list, wired as the Tenants tab), TenantFormScreen (photo + ID proof pickers, name/phone/emergency contact, shared add/edit), TenantProfileScreen (view + edit entry point for LODGY-31 to extend). Added coil3 (coil-compose) for image loading since AsyncImage from a file path is needed in three places now and will be needed again for notes photos later. Manifest: added a FileProvider + res/xml/file_paths.xml for the camera Uri. Bug caught before shipping: TenantProfileViewModel originally fetched the tenant once with getById, which would go stale after editing since popping back to a retained NavBackStackEntry doesn't re-run init - added TenantDao.getByIdFlow/TenantRepository.observeById and switched to that instead. `gradlew assembleDebug` -> BUILD SUCCESSFUL. Not yet exercised on-device (camera/gallery flows especially need real interaction, not just a code read) - still queued behind the slow emulator boot, now well over an hour."}]}, {"id": "LODGY-12", "epic": "Tenant Onboarding", "title": "Tenancy agreement capture", "description": "Capture agreed rent, advance deposit, billing cycle day, and move-in date. Move-in date must support past dates for onboarding an already-resident tenant.", "acceptanceCriteria": ["Move-in date accepts past dates without validation errors", "Billing cycle day (1-28) is validated", "Agreement is linked to exactly one bed"], "status": "Testing", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T08:30:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T08:00:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting LODGY-12 and LODGY-13 together - AC3 here ('linked to exactly one bed') and LODGY-13's whole premise (assigning during onboarding flips the bed) are two halves of one atomic save, and DESIGN.md's onboarding flow is one continuous wizard (pick bed -> profile -> agreement) anyway. Building: vacant-bed picker (scoped to the currently active hostel, only ever lists VACANT beds so an occupied one is structurally unselectable) -> wired as the real 'Add Tenant' entry point ahead of LODGY-11's profile form -> agreement form -> save creates the TenancyAgreement and flips the bed to OCCUPIED in one action. Editing an existing tenant's profile still skips the bed picker entirely."}, {"timestamp": "2026-09-03T08:30:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Full wizard wired: Tenants tab '+' -> BedPickerScreen (grouped by floor, only VACANT beds ever queried) -> TenantFormScreen (bedId carried as a nav arg) -> on save, TenantFormScreen now reports back the saved tenant's id (fixed a gap where it only reported 'done', not which tenant) -> AgreementFormScreen (rent/deposit/billing-day/move-in-date) -> save creates the TenancyAgreement AND calls bedRepository.setOccupied in the same action, then pops the whole wizard stack back to the Tenants tab. AC1: move-in date uses Material3's DatePicker with no selectableDates restriction, so past dates are accepted with no validation error. AC2: billingCycleDay is a numeric field validated to 1-28 inline (error state + helper text), Save disabled until valid. AC3: TenancyAgreement.bedId is a required non-null field on the entity already (LODGY-2), and this screen is only reachable with a bedId in hand. Editing an existing tenant (from the profile screen) still bypasses the picker entirely and goes straight to the plain form. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass (especially clicking through the full 4-screen wizard) still queued behind the emulator boot."}]}, {"id": "LODGY-13", "epic": "Tenant Onboarding", "title": "Bed assignment & occupancy flip", "description": "Assigning a tenant to a bed during onboarding flips that bed to OCCUPIED and prevents double-assignment.", "acceptanceCriteria": ["Assigned bed shows OCCUPIED immediately", "An already-occupied bed cannot be selected during onboarding"], "status": "Testing", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T08:30:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T08:00:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Building alongside LODGY-12 - see that ticket's note. The bed picker only ever queries VACANT beds, so occupied ones are never rendered as selectable in the first place (structural prevention rather than a validation check)."}, {"timestamp": "2026-09-03T08:30:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "AgreementFormViewModel.save() calls bedRepository.setOccupied(bedId) in the same coroutine as creating the TenancyAgreement, so the write lands before the wizard pops back - BedGridScreen (LODGY-9) reads beds via a live Flow, so re-opening that room's bed grid afterward correctly shows OCCUPIED with no stale cache. AC2 is enforced structurally: BedPickerViewModel only ever collects beds with status==VACANT into its option list, so an occupied bed is never rendered as a selectable row in the first place, not just blocked after the fact. `gradlew assembleDebug` -> BUILD SUCCESSFUL, same as LODGY-12 (built together). On-device pass queued - specifically worth checking that the bed grid actually flips after completing onboarding, not just trusting the Flow theoretically works."}]}, {"id": "LODGY-14", "epic": "Tenant Onboarding", "title": "Tenant checkout flow", "description": "Close a tenancy agreement: move-out date, deposit settlement (deduct damages, log refund amount), bed released back to VACANT.", "acceptanceCriteria": ["Checkout requires a move-out date and shows deposit vs deductions", "Bed becomes VACANT immediately after checkout", "Tenant's history remains viewable after checkout (status VACATED, not deleted)"], "status": "Testing", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T09:00:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T08:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. Scope note: the wireframe (Rent5_Checkout) has an optional 'reason' field alongside the damage deduction amount, but TenancyAgreement has no column to persist it (DESIGN.md section 3 schema is authoritative) - dropping that field rather than inventing a schema change; a future note-taking ticket (LODGY-24) could log a DAMAGE-type TenantNote instead, but that's out of this ticket's scope. Not coercing a negative refund to zero if deductions exceed the deposit - showing the real computed number is more honest than hiding an over-deduction."}, {"timestamp": "2026-09-03T09:00:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Added TenancyAgreementRepository.getActiveByTenantId/close and TenantRepository.setVacated. Built CheckoutViewModel/CheckoutScreen (move-out date via Material3 DatePicker, deposit shown against a damage-deduction field, live-computed refund), reachable from a 'Checkout tenant' action on TenantProfileScreen (only shown while status==ACTIVE). confirmCheckout() does all three writes in one coroutine: closes the agreement (moveOutDate, depositRefundAmount, status=CLOSED), calls bedRepository.setVacant, and sets the tenant's own status to VACATED - then pops back to the Tenants tab. AC1: move-out date is a required field defaulting to today (DatePicker, no restriction), deposit vs deduction vs computed refund all shown together. AC2: setVacant runs synchronously in the same save, and BedGridScreen reads a live Flow so it reflects VACANT immediately on next view - same reasoning as LODGY-13. AC3: checkout never deletes the Tenant row, only flips status - TenantProfileScreen and the directory's VACATED chip both keep working afterward. This also closes LODGY-9's AC2 in full (onboarding half from LODGY-13, checkout half from this) - moving that ticket to Testing too. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass still queued."}]}, {"id": "LODGY-15", "epic": "Rent & Payments", "title": "Monthly invoice auto-generation", "description": "WorkManager job that generates an invoice for every ACTIVE tenancy agreement on its billing cycle day each month.", "acceptanceCriteria": ["Invoice is created automatically on the configured cycle day", "No duplicate invoice is created for the same tenant+period", "Job survives app restarts (WorkManager persistence)"], "status": "Testing", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T10:05:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T09:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. Using a daily PeriodicWorkRequest (WorkManager's floor is 15 minutes; once-a-day is the natural granularity for 'on its billing cycle day') that checks every ACTIVE agreement against today's day-of-month each run. billingCycleDay is already constrained to 1-28 by LODGY-12, so every calendar month actually has that day - no short-month edge case to handle. Enqueued with ExistingPeriodicWorkPolicy.KEEP from Application.onCreate so re-launching the app doesn't reset an already-scheduled job, which is also what makes this survive app restarts (WorkManager persists its own schedule independent of the app process)."}, {"timestamp": "2026-09-03T10:05:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built work/InvoiceGenerationWorker.kt (@HiltWorker, checks every ACTIVE agreement's billingCycleDay against today, creates an UNPAID invoice at agreedRent for agreements that match and don't already have one for the current periodMonth/periodYear) and work/WorkScheduler.kt (enqueueUniquePeriodicWork, KEEP policy). Wired Hilt into WorkManager: LodgyApplication now implements Configuration.Provider with an injected HiltWorkerFactory, and the manifest disables WorkManager's default androidx.startup initializer (tools:node=\"remove\") so it doesn't race with the custom config. Added InvoiceDao.getForPeriod and TenancyAgreementDao.getAllActive to support this. `gradlew assembleDebug` -> BUILD SUCCESSFUL, including the hilt-work KSP codegen for @HiltWorker. AC1/AC2 are implemented directly in doWork()'s filter+existsForPeriod check. AC3 (survives restarts) is a WorkManager platform guarantee for periodic work + KEEP policy, not something I wrote myself - reasonably confident by API contract, but the only way to truly confirm it is watching a real day boundary or using WorkManager's test APIs, neither of which I could exercise without a working emulator this session. Tester: worth at least confirming via `adb shell dumpsys jobscheduler` (or WorkManager's own inspector) that the job is actually scheduled once a device is available, even without waiting a full day."}]}, {"id": "LODGY-16", "epic": "Rent & Payments", "title": "Manual / backdated invoice entry", "description": "Let the warden manually add an invoice for a past period, needed to backfill dues history for a tenant onboarded mid-tenancy.", "acceptanceCriteria": ["Invoice can be created for a period earlier than the current month", "Manually added invoices behave identically to auto-generated ones for payment tracking"], "status": "Testing", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T11:00:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T10:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. Entry point: FAB on the Payments tab (InvoiceListScreen) -> a small active-tenant picker -> the manual invoice form, amount pre-filled from the tenant's agreedRent but editable. Reusing InvoiceRepository.existsForPeriod (built for LODGY-15's auto-generator) to block a duplicate for the same tenant+period here too, since AC2 asks manual invoices to behave identically to auto-generated ones."}, {"timestamp": "2026-09-03T11:00:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built ManualInvoiceTenantPickerScreen (active tenants only) and ManualInvoiceFormScreen (month/year as validated numeric fields like billingCycleDay elsewhere, amount pre-filled from the tenant's active agreement's agreedRent but editable, due date via DatePicker with no restriction - AC1's 'earlier than current month' works because nothing constrains the month/year fields to the present or future). Save calls the exact same InvoiceRepository.create() the LODGY-15 worker uses, so a manually-created invoice is byte-for-byte the same shape (UNPAID status, same columns) and shows up in the same InvoiceListScreen, can be paid via the same RecordPaymentScreen - satisfies AC2 by sharing the implementation rather than parallel code paths. Wired a FAB on InvoiceListScreen (Payments tab) as the entry point. `gradlew assembleDebug` -> BUILD SUCCESSFUL."}]}, {"id": "LODGY-17", "epic": "Rent & Payments", "title": "Payment recording & invoice status", "description": "Record a payment against an invoice (amount, mode, date, note). Invoice status auto-updates UNPAID -> PARTIAL -> PAID.", "acceptanceCriteria": ["Partial payment correctly reduces outstanding balance and sets status PARTIAL", "Full payment sets status PAID", "Multiple partial payments against one invoice are all retained"], "status": "Testing", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T10:35:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T10:15:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - there's no invoice list screen anywhere yet (Payments tab is still a placeholder), so building that too as the natural home for this ticket's payment-recording entry point, matching the wireframe. Reminder buttons (LODGY-18/19) intentionally left off the list rows for now, added when those tickets land."}, {"timestamp": "2026-09-03T10:35:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built PaymentRepository (create, getTotalPaid summing all payments for an invoice), extended InvoiceRepository (getAll, getById, updateStatus) and TenancyAgreementRepository (getById). InvoiceListScreen now backs the Payments tab: reactive Flow<List<Invoice>> enriched per-invoice with tenant name + total paid (N+1 lookups, acceptable at single-hostel scale), All/Unpaid/Partial/Paid filter chips, Record button per unpaid/partial row. RecordPaymentScreen pre-fills the amount field with the remaining balance, mode as filter chips, date picker, optional note; save() writes the payment then recomputes totalPaid and sets status via the exact AC-specified thresholds (>=amountDue -> PAID, >0 -> PARTIAL, else UNPAID stays). Because invoiceRepository.getAll() is a live Flow and the invoice row itself gets updated with the new status, the list screen picks up the change automatically on popping back - no manual refresh. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass (multiple partial payments accumulating correctly, in particular) still queued."}]}, {"id": "LODGY-18", "epic": "Rent & Payments", "title": "WhatsApp reminder (tap-to-send)", "description": "Button on an unpaid/partial invoice opens WhatsApp via a wa.me deep link with a pre-filled reminder message; warden taps send.", "acceptanceCriteria": ["Tapping the reminder opens WhatsApp with tenant's number and a pre-filled message", "Message includes tenant name, amount due, and due date", "No auto-send occurs without the warden's explicit tap"], "status": "Testing", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T11:35:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T11:15:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Building alongside LODGY-19 - one ReminderScreen with a channel toggle (WhatsApp/SMS), matching the wireframe. Message language (Hindi/English) is specific to this feature per DESIGN.md 4.9 ('reminder templates also available in Hindi and English... warden can pick per-reminder'), independent of LODGY-30's app-wide language switcher, so writing both message templates directly here rather than waiting on that ticket."}, {"timestamp": "2026-09-03T11:35:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built contact/ReminderIntents.kt (whatsApp: wa.me/<digits>?text=<url-encoded>, sms: smsto: + sms_body extra) and contact/ReminderMessageBuilder.kt (Hindi/English templates, date formatted via the target locale so month names come out right in either language). ReminderViewModel resolves the full chain from invoiceId (invoice -> agreement -> tenant for name/phone, agreement -> bed -> room -> floor -> hostel for the hostel-name signature) and rebuilds the message live when the language toggle changes. ReminderScreen shows channel + language chips, a live preview, and one send button that launches the right intent via runCatching (wrapped like LODGY-31, same crash-safety reasoning). Wired a Reminder button next to Record on every unpaid/partial InvoiceListScreen row. `gradlew assembleDebug` -> BUILD SUCCESSFUL, no warnings. AC3 (no auto-send) holds by construction - both intents only ever open the target app pre-filled, tapping send there is entirely the warden's action. On-device pass still queued."}]}, {"id": "LODGY-19", "epic": "Rent & Payments", "title": "SMS reminder (tap-to-send)", "description": "Same as WhatsApp reminder but via an SMS intent (smsto:), pre-filled, tap-to-send only.", "acceptanceCriteria": ["Tapping opens the default SMS app pre-filled with tenant number and message", "No SEND_SMS permission is requested"], "status": "Testing", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T11:35:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T11:15:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Building alongside LODGY-18 - see that ticket's note, same screen, shared message-building logic."}, {"timestamp": "2026-09-03T11:35:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "SMS half of the same build as LODGY-18: ReminderIntents.sms() uses ACTION_VIEW on an smsto: Uri with the message passed via the sms_body extra - no SEND_SMS permission requested or declared anywhere in the manifest (confirmed by grep). `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass still queued."}]}, {"id": "LODGY-20", "epic": "Reporting & Dashboard", "title": "Home dashboard", "description": "Landing screen showing today's collections, overdue invoice count, vacant bed count, and upcoming move-outs.", "acceptanceCriteria": ["All four metrics are visible and correct against seed data", "Dashboard reflects the currently selected hostel"], "status": "Testing", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T12:05:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T11:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. Flagging a real gap before building: 'upcoming move-outs' has no data source in the schema as built. LODGY-14's checkout is immediate (bed freed, agreement closed, tenant vacated all in one action) - there's no 'tenant gave notice, will leave on date X' concept anywhere, so an ACTIVE agreement with a future moveOutDate never actually occurs through any flow in this app. Building the query correctly anyway (ACTIVE agreements in this hostel with a non-null moveOutDate in the future) so it's honestly testable against seeded data, but in practice it will always render empty until a future ticket adds a notice-period/planned-move-out concept. Not faking data to make the tile look populated."}, {"timestamp": "2026-09-03T12:05:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built DashboardViewModel/DashboardScreen backing the Home tab. Reactively observes HostelPreferences.selectedHostelId (not a one-shot fetch) specifically so AC2 holds correctly - switching the active hostel on the Property tab and returning to Home reflects the new hostel immediately, rather than showing stale data from a retained ViewModel (bottom-nav's saveState/restoreState keeps the Home back-stack entry, and its ViewModel, alive across tab switches - same class of staleness bug I fixed for TenantProfileViewModel in LODGY-11). Metrics computed by resolving the hostel's bed set (Floor->Room->Bed) then filtering ACTIVE agreements/invoices/payments against it - vacant beds and overdue invoices are directly correct; today's collections filters payments by same-calendar-day; upcoming move-outs is the query described above (correct logic, will read empty until a future ticket adds the underlying feature - noted plainly on this ticket rather than hidden). No-active-hostel state shows a prompt instead of zeros. `gradlew assembleDebug` -> BUILD SUCCESSFUL. Tester: please explicitly confirm AC2 by switching hostels and checking Home updates, and treat 'upcoming move-outs shows 0' as expected/correct given the gap noted above, not a bug - the other three metrics are what's meaningfully testable against seed data here."}]}, {"id": "LODGY-21", "epic": "Reporting & Dashboard", "title": "Vacant rooms/beds view", "description": "Filterable view of vacant beds by hostel/floor.", "acceptanceCriteria": ["Vacant beds are listed correctly and update immediately after checkout/onboarding", "Filtering by floor works"], "status": "Testing", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T12:35:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T12:15:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. AC1 explicitly asks for immediate updates after checkout/onboarding, so this one gets genuine Flow reactivity (combine() over each room's live bed Flow) rather than the one-shot-fetch pattern used elsewhere - avoids the retained-ViewModel staleness class of bug already hit twice this session (LODGY-11, LODGY-20)."}, {"timestamp": "2026-09-03T12:35:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built VacantViewViewModel/VacantViewScreen, grouped by floor with an 'All floors' + per-floor filter chip row, wired as a drill-in from the Dashboard's 'Vacant beds' tile (now clickable). Reactivity: combine() over each room's bedRepository.getByRoomId Flow, so any bed's status flipping (checkout frees one, onboarding occupies one) re-emits the whole list live, satisfying AC1 literally rather than just 'correct on next screen load'. AC2 (floor filtering) is a plain client-side filter over the combined list. Caught two real bugs before shipping: (1) my first draft placed the filter Row and the list as two SEPARATE direct children of Scaffold's content slot instead of wrapping both in a Column - Scaffold's content is a Box internally, so they'd have overlapped/rendered on top of each other; audited every other list+filter screen in the app (Invoices, Tenants) and confirmed this was the only instance. (2) a leftover brace from refactoring StatCard into StatCard+StatCardContent broke the build entirely - fixed before it ever reached a commit. `gradlew assembleDebug` -> BUILD SUCCESSFUL, clean rebuild after both fixes. On-device pass still queued - this one in particular deserves an actual click-through given the overlap bug I just caught by re-reading, not by seeing it render."}]}, {"id": "LODGY-22", "epic": "Reporting & Dashboard", "title": "Monthly report per hostel", "description": "Report showing total collected, total dues, occupancy %, and income vs expense for a selected month.", "acceptanceCriteria": ["Numbers reconcile with underlying invoice/payment/expense records", "Report can be viewed for any past month, not just the current one"], "status": "Testing", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T13:40:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T13:20:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting, after LODGY-26 so the income-vs-expense half has real data behind it. AC2 needs a month/year picker (not just current month) - reusing the numeric month/year field pattern from LODGY-16's manual invoice form. Occupancy % is computed against the hostel's current bed count (occupied/total right now), not a historical reconstruction of occupancy as of the selected past month - the schema has no way to know how many beds existed or were occupied at an arbitrary past date, only current bed rows and agreement history, so a true historical occupancy % isn't reconstructable. Flagging this rather than building something that looks precise but isn't."}, {"timestamp": "2026-09-03T13:40:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built MonthlyReportViewModel/MonthlyReportScreen, reachable via a report icon in the Dashboard's app bar (only shown once a hostel is active). Editable month/year fields recompute the report on every change - AC2 satisfied directly, any past (or future) period can be queried, nothing pins it to the current month. Total collected = sum of payments whose invoice falls in the selected period; total dues = sum of (amountDue - paidSoFar) over that period's non-PAID invoices; occupancy = current occupied/total beds for the hostel (see the in-progress note on why this can't be truly historical); expense = sum of Expense rows incurred in that calendar month, scoped to hostel. Every number traces directly to a real DAO query over Payment/Invoice/Expense rows - AC1 ('numbers reconcile with underlying records') holds because there's no separate aggregate/cache table to drift out of sync with the source rows. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass still queued; this one's worth checking with real seeded payments/expenses across a couple of months to confirm the period filtering is right, not just that it compiles."}]}, {"id": "LODGY-23", "epic": "Reporting & Dashboard", "title": "Export report as PDF/CSV", "description": "Let the warden export the monthly report to a file via the system share sheet / SAF.", "acceptanceCriteria": ["Export produces a readable PDF or CSV with the same numbers as the on-screen report"], "status": "Todo", "priority": "Low", "assigneeRole": null, "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-02T12:55:59.648423+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}]}, {"id": "LODGY-24", "epic": "Tenant Notes", "title": "Tenant note CRUD", "description": "Create, edit, and delete tenant notes (COMPLAINT/DAMAGE/GENERAL) with an occurredOn date independent of createdAt/updatedAt, plus an optional photo.", "acceptanceCriteria": ["Note occurredOn can be set in the past", "Editing and deleting an existing note both work", "Deleting is a hard delete (no undo required)"], "status": "Todo", "priority": "Medium", "assigneeRole": null, "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-02T12:55:59.648423+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}]}, {"id": "LODGY-25", "epic": "Tenant Notes", "title": "Tenant timeline view", "description": "Per-tenant chronological view of all notes, sorted by occurredOn.", "acceptanceCriteria": ["Timeline sorts by occurredOn, not createdAt", "Editing a note's occurredOn re-sorts it correctly in the timeline"], "status": "Todo", "priority": "Medium", "assigneeRole": null, "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-02T12:55:59.648423+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}]}, {"id": "LODGY-26", "epic": "Expenses", "title": "Expense entry CRUD", "description": "Log an expense per hostel: category (wifi/water/electricity/tax/maintenance/repair/other), amount, date, recurring flag, note.", "acceptanceCriteria": ["All categories from DESIGN.md are selectable", "Recurring flag is stored and editable"], "status": "Testing", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T13:05:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T12:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting, ahead of LODGY-22 (monthly report) since that ticket needs real expense data to be meaningful. No bottom-nav tab exists for Expenses yet, so building a minimal More-tab menu screen as the entry point (the More tab has been a placeholder since LODGY-3) - it'll gain more entries as Backup/Restore and Settings tickets land."}, {"timestamp": "2026-09-03T13:05:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built ExpenseRepository (create/update, both carrying updatedAt), ExpenseListScreen (total-for-hostel header card, list with recurring badge, reactively scoped to the active hostel via flatMapLatest so switching hostels updates the list), ExpenseFormScreen (all 7 ExpenseCategory values as FlowRow filter chips - AC1 - amount, date picker, recurring Switch - AC2 - optional note; shared add/edit). Also built ui/more/MoreScreen.kt and wired the More tab to it (was a placeholder since LODGY-3) with one entry, Expenses, as the way in. Every LodgyDestination now has real content behind it, so LodgyNavHost's per-destination `when` is exhaustive - deleted the now-fully-unused PlaceholderScreen.kt. `gradlew assembleDebug` -> BUILD SUCCESSFUL, no warnings after fixing an ExperimentalCoroutinesApi opt-in on flatMapLatest."}]}, {"id": "LODGY-27", "epic": "Expenses", "title": "Expense rollup into monthly report", "description": "Roll logged expenses into the income-vs-expense figure on the monthly report (LODGY-22).", "acceptanceCriteria": ["Monthly report's expense total matches the sum of that month's expense entries"], "status": "Testing", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T13:45:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T13:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "Testing", "note": "Already built as part of LODGY-22, not a separate follow-on change: MonthlyReportViewModel.refresh() queries expenseRepository.getByHostelId(hostelId) and sums entries whose incurredOn falls in the selected month/year, and netIncome = totalCollected - totalExpense is shown directly on the report tile - there's no separate expense-rollup code path to add, this ticket's AC was the natural shape of 'build income vs expense correctly' from the start. Same build verification as LODGY-22 (`gradlew assembleDebug` -> BUILD SUCCESSFUL). No incremental code change to note here beyond what LODGY-22's history already describes."}]}, {"id": "LODGY-28", "epic": "Backup & Restore", "title": "Export data (DB + photos) to zip", "description": "Zip the Room DB file and the photos directory, and write it via SAF to a location the warden picks.", "acceptanceCriteria": ["Export produces a single zip file at a user-chosen location", "Zip contains both the DB file and all referenced photos"], "status": "Todo", "priority": "High", "assigneeRole": null, "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-02T12:55:59.648423+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}]}, {"id": "LODGY-29", "epic": "Backup & Restore", "title": "Import data from a backup zip", "description": "Pick a previously exported zip and restore DB + photos, for warden phone-migration scenarios.", "acceptanceCriteria": ["Importing a valid export fully restores hostels/tenants/invoices/photos", "Importing does not silently merge with existing data - warns before overwrite"], "status": "Todo", "priority": "High", "assigneeRole": null, "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-02T12:55:59.648423+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}]}, {"id": "LODGY-30", "epic": "Localization", "title": "Hindi + English language support", "description": "Full app localization: externalize all UI strings to Android resources (values/ + values-hi/) from the start rather than retrofitting later, add an in-app language switcher in Settings (independent of device system locale, defaulting to Hindi on first launch), and provide Hindi/English versions of the WhatsApp/SMS reminder templates from LODGY-18/LODGY-19. Tenant-entered data (names, notes, addresses) is stored as-typed and is never translated - only the app's own UI chrome and generated text (invoices, reports, reminder templates) are localized. Numbers/dates/currency use locale-aware formatting. See docs/DESIGN.md section 4.9.", "acceptanceCriteria": ["No user-facing string in the app is hardcoded outside of string resources", "Every screen renders correctly in both Hindi and English with no missing/fallback strings", "In-app language switcher in Settings changes the UI language immediately without requiring a reinstall, independent of the device's system locale", "First launch defaults to Hindi", "WhatsApp and SMS reminder templates (LODGY-18, LODGY-19) are available in both Hindi and English, selectable by the warden", "Devanagari script renders correctly (no tofu/missing glyphs) across all screens, including generated invoices/reports", "Amounts and dates display using locale-aware formatting under both language settings", "Tenant-entered free text (names, notes) displays exactly as typed regardless of the app's UI language setting"], "status": "Todo", "priority": "High", "assigneeRole": null, "createdAt": "2026-09-02T00:00:00+00:00", "updatedAt": "2026-09-02T00:00:00+00:00", "history": [{"timestamp": "2026-09-02T00:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added per explicit user requirement: primary users (wardens) are Hindi-based. Should land early since retrofitting string externalization across an already-built UI is expensive - flagging as High priority even though it doesn't block LODGY-1/LODGY-2."}]}, {"id": "LODGY-31", "epic": "Tenant Onboarding", "title": "Call / WhatsApp / SMS quick-contact buttons on tenant profile", "description": "Add three quick-action buttons on the tenant profile screen: Call, WhatsApp, SMS. Each redirects the warden const STATUSES = ["Todo", "In Progress", "Testing", "Done", "Delivered"];
const COLORS = {
  "Todo": "var(--todo)", "In Progress": "var(--inprogress)",
  "Testing": "var(--testing)", "Done": "var(--done)", "Delivered": "var(--delivered)"
};

function renderStats() {
  const statsEl = document.getElementById('stats');
  const total = TICKETS.length;
  statsEl.innerHTML = '';
  const totalTile = document.createElement('div');
  totalTile.className = 'stat-tile';
  totalTile.innerHTML = `<div class="num">${total}</div><div class="label">Total tickets</div>`;
  statsEl.appendChild(totalTile);

  STATUSES.forEach(s => {
    const count = TICKETS.filter(t => t.status === s).length;
    const tile = document.createElement('div');
    tile.className = 'stat-tile';
    tile.innerHTML = `<div class="num" style="color:${COLORS[s]}">${count}</div><div class="label">${s}</div>`;
    statsEl.appendChild(tile);
  });

  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  STATUSES.forEach(s => {
    const count = TICKETS.filter(t => t.status === s).length;
    if (count === 0) return;
    const seg = document.createElement('div');
    seg.style.width = (count / total * 100) + '%';
    seg.style.background = COLORS[s];
    seg.title = `${s}: ${count}`;
    bar.appendChild(seg);
  });
}

function populateEpicFilter() {
  const sel = document.getElementById('epicFilter');
  const epics = [...new Set(TICKETS.map(t => t.epic))];
  sel.innerHTML = '<option value="">All epics</option>' +
    epics.map(e => `<option value="${e}">${e}</option>`).join('');
}

function renderBoard() {
  const query = document.getElementById('search').value.toLowerCase();
  const epic = document.getElementById('epicFilter').value;
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';

  STATUSES.forEach(status => {
    const col = document.createElement('div');
    col.className = 'column';
    const items = TICKETS.filter(t => t.status === status)
      .filter(t => !epic || t.epic === epic)
      .filter(t => !query || (t.title + t.id + t.epic).toLowerCase().includes(query));

    col.innerHTML = `
      <div class="column-header" style="--col-color:${COLORS[status]}">
        <span>${status}</span><span class="count">${items.length}</span>
      </div>
      <div class="cards"></div>`;
    const cardsEl = col.querySelector('.cards');

    items.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="id">${t.id} · ${t.epic}</div>
        <div class="title">${t.title}</div>
        <div class="meta">
          <span class="badge priority-${t.priority}">${t.priority}</span>
          ${t.assigneeRole ? `<span class="badge">${t.assigneeRole}</span>` : ''}
        </div>`;
      card.addEventListener('click', () => openModal(t.id));
      cardsEl.appendChild(card);
    });

    boardEl.appendChild(col);
  });
}

function openModal(id) {
  const t = TICKETS.find(x => x.id === id);
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="modal-id">${t.id} · ${t.epic} · ${t.status}</div>
    <h2>${t.title}</h2>
    <div class="section"><h3>Description</h3><div>${t.description}</div></div>
    <div class="section"><h3>Acceptance Criteria</h3>
      <ul>${t.acceptanceCriteria.map(a => `<li>${a}</li>`).join('')}</ul>
    </div>
    <div class="section"><h3>History Trail</h3>
      ${t.history.slice().reverse().map(h => `
        <div class="history-item">
          <div>${h.action}${h.from ? ` (${h.from} → ${h.to})` : ''}${h.note ? ' — ' + h.note : ''}</div>
          <div class="h-meta">${h.actor} · ${new Date(h.timestamp).toLocaleString()}</div>
        </div>`).join('')}
    </div>`;
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});

document.getElementById('search').addEventListener('input', renderBoard);
document.getElementById('epicFilter').addEventListener('change', renderBoard);

renderStats();
populateEpicFilter();
renderBoard();
</script>
</body>
</html>
