 "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T15:50:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T12:15:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. AC1 explicitly asks for immediate updates after checkout/onboarding, so this one gets genuine Flow reactivity (combine() over each room's live bed Flow) rather than the one-shot-fetch pattern used elsewhere - avoids the retained-ViewModel staleness class of bug already hit twice this session (LODGY-11, LODGY-20)."}, {"timestamp": "2026-09-03T12:35:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built VacantViewViewModel/VacantViewScreen, grouped by floor with an 'All floors' + per-floor filter chip row, wired as a drill-in from the Dashboard's 'Vacant beds' tile (now clickable). Reactivity: combine() over each room's bedRepository.getByRoomId Flow, so any bed's status flipping (checkout frees one, onboarding occupies one) re-emits the whole list live, satisfying AC1 literally rather than just 'correct on next screen load'. AC2 (floor filtering) is a plain client-side filter over the combined list. Caught two real bugs before shipping: (1) my first draft placed the filter Row and the list as two SEPARATE direct children of Scaffold's content slot instead of wrapping both in a Column - Scaffold's content is a Box internally, so they'd have overlapped/rendered on top of each other; audited every other list+filter screen in the app (Invoices, Tenants) and confirmed this was the only instance. (2) a leftover brace from refactoring StatCard into StatCard+StatCardContent broke the build entirely - fixed before it ever reached a commit. `gradlew assembleDebug` -> BUILD SUCCESSFUL, clean rebuild after both fixes. On-device pass still queued - this one in particular deserves an actual click-through given the overlap bug I just caught by re-reading, not by seeing it render."}, {"timestamp": "2026-09-03T15:50:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - no overlap, filter row and list render as separate rows correctly. Opened via the Home dashboard's \"Vacant beds\" tile: listed every vacant bed correctly grouped by floor, with Room 101/102's occupied beds correctly excluded. Filtered to \"Ground\" (a floor with no rooms): \"No vacant beds right now.\" - filter works (AC2). Checked out Ravi Kumar afterward and re-opened this screen: Room 101 - Bed A reappeared in the list without needing to force-refresh - live Flow reactivity confirmed (AC1)."}]}, {"id": "LODGY-22", "epic": "Reporting & Dashboard", "title": "Monthly report per hostel", "description": "Report showing total collected, total dues, occupancy %, and income vs expense for a selected month.", "acceptanceCriteria": ["Numbers reconcile with underlying invoice/payment/expense records", "Report can be viewed for any past month, not just the current one"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T17:05:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T13:20:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting, after LODGY-26 so the income-vs-expense half has real data behind it. AC2 needs a month/year picker (not just current month) - reusing the numeric month/year field pattern from LODGY-16's manual invoice form. Occupancy % is computed against the hostel's current bed count (occupied/total right now), not a historical reconstruction of occupancy as of the selected past month - the schema has no way to know how many beds existed or were occupied at an arbitrary past date, only current bed rows and agreement history, so a true historical occupancy % isn't reconstructable. Flagging this rather than building something that looks precise but isn't."}, {"timestamp": "2026-09-03T13:40:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built MonthlyReportViewModel/MonthlyReportScreen, reachable via a report icon in the Dashboard's app bar (only shown once a hostel is active). Editable month/year fields recompute the report on every change - AC2 satisfied directly, any past (or future) period can be queried, nothing pins it to the current month. Total collected = sum of payments whose invoice falls in the selected period; total dues = sum of (amountDue - paidSoFar) over that period's non-PAID invoices; occupancy = current occupied/total beds for the hostel (see the in-progress note on why this can't be truly historical); expense = sum of Expense rows incurred in that calendar month, scoped to hostel. Every number traces directly to a real DAO query over Payment/Invoice/Expense rows - AC1 ('numbers reconcile with underlying records') holds because there's no separate aggregate/cache table to drift out of sync with the source rows. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass still queued; this one's worth checking with real seeded payments/expenses across a couple of months to confirm the period filtering is right, not just that it compiles."}, {"timestamp": "2026-09-03T16:20:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "In Progress", "note": "FAIL - AC1 violated for any period involving a checked-out tenant. Repro: Ravi Kumar had a manually-created July 2026 invoice (Rs.5000) that was fully paid via three payments (all recorded today, correctly showing Rs.5000 collected/PAID at the time). Checked him out (LODGY-14). Opened Monthly Report for Sunrise PG Boys, set Month=7/Year=2026: Total collected shows Rs.0 and Total dues shows Rs.0 - the entire invoice and its payments have vanished from the report, even though they're still in the database and the report is being viewed for the exact period they occurred in. Root cause (MonthlyReportViewModel.kt:97): `agreementIds` is built from `tenancyAgreementRepository.getAllActive()`, which only returns agreements with status==ACTIVE. Once an agreement is CLOSED (any checkout), every invoice/payment tied to it is filtered out of `invoicesForPeriod` on line 102-103 and `totalCollected`/`totalDues` on lines 107-113 - permanently, for every month, not just the current one. This breaks AC1 ('numbers reconcile with underlying records') for any hostel that has ever had a tenant check out, which will be normal within a month or two of real use. Expected: a month's report should include every invoice/payment/expense that occurred in that period regardless of whether the tenant is still active today. Suggested fix: derive the relevant agreement set from ALL agreements whose bed is/was in this hostel (or better, filter invoices directly by tenancyAgreementId->bedId->hostelId without gating on agreement status at all), not from getAllActive(). Same root cause almost certainly affects LODGY-20's Dashboard (filed separately) - worth fixing both from one corrected query if that's a natural shared helper."}, {"timestamp": "2026-09-03T16:50:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Fixed. Same root cause as LODGY-20: added TenancyAgreementDao.getAll()/TenancyAgreementRepository.getAll() (all statuses, unlike getAllActive()) and switched MonthlyReportViewModel.kt:97 to use it - a closed agreement's invoices/payments now stay included in `agreementIds` for any period they actually occurred in, including periods after the checkout. Added a regression test (a checked-out tenant's invoice/payment still counted for the period they occurred in) - full suite green. `gradlew assembleDebug` -> BUILD SUCCESSFUL."}, {"timestamp": "2026-09-03T17:05:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - re-verified on-device with the exact repro from the FAIL note. After reinstalling the fixed build, opened Monthly Report for Sunrise PG Boys with Month=7/Year=2026 (Ravi Kumar already checked out): Total collected now correctly shows Rs.5000 and Total dues shows Rs.0, matching the underlying paid invoice instead of the prior Rs.0/Rs.0. Confirmed AC1 holds for a past period involving a checked-out tenant. Bug closed."}]}, {"id": "LODGY-23", "epic": "Reporting & Dashboard", "title": "Export report as PDF/CSV", "description": "Let the warden export the monthly report to a file via the system share sheet / SAF.", "acceptanceCriteria": ["Export produces a readable PDF or CSV with the same numbers as the on-screen report"], "status": "Done", "priority": "Low", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T17:50:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T16:20:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "Testing", "note": "DESIGN.md section 4.6 explicitly marks this 'Phase 2', and it's Low priority, but the AC only asks for 'a readable PDF or CSV' - CSV alone satisfies that in full, so built the smaller of the two rather than deferring: an export icon in MonthlyReportScreen's app bar (only shown once a hostel is active) opens the standard SAF CreateDocument('text/csv') picker; the CSV is built directly from MonthlyReportViewModel's existing uiState (hostel, month, year, totalCollected, totalDues, occupancy%, totalExpense, netIncome) - the exact same numbers already reconciled and shown on screen for LODGY-22, so there's no separate query path that could drift out of sync (AC holds by construction). Row labels reuse existing localized string resources (LODGY-30) so the CSV comes out in whichever language the app is currently set to; amounts are formatted with Locale.US/%.2f deliberately regardless of app language, since a locale-dependent decimal separator would silently corrupt the comma-delimited CSV. No PDF generation was built - not needed to satisfy the AC, and skipping it keeps this appropriately small for a Low-priority, explicitly-Phase-2 item; flagging in case Product Owner specifically wants a PDF later. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass still blocked (session-wide emulator limitation, most recently reconfirmed this round) - worth opening the exported CSV in a real spreadsheet app to confirm it parses cleanly."}, {"timestamp": "2026-09-03T17:50:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - AC confirmed on-device with a real number reconciliation. Opened Monthly Report for Sunrise PG Boys, Month=9/Year=2026 (Rs.0 collected, Rs.4000 dues, 14% occupancy, Rs.2950 expense, -Rs.2950 net), tapped the export icon: the standard SAF CreateDocument picker opened with a sensible pre-filled name (lodgy-report-9-2026.csv), saved to Downloads. Pulled the file via adb and its contents are: Hostel=Sunrise PG Boys, Month=9, Year=2026, Total collected=0.00, Total dues=4000.00, Occupancy=14%, Total Expense=2950.00, Income - expense=-2950.00 - every field matches the on-screen report exactly, satisfying the AC in full. File is well-formed (quoted key/value CSV rows, stable 2-decimal amount formatting) and opened/parsed without issue via a plain file read. No PDF was built, which is fine per the AC's 'PDF or CSV' wording and the developer's explicit Phase-2 scoping note."}]}, {"id": "LODGY-24", "epic": "Tenant Notes", "title": "Tenant note CRUD", "description": "Create, edit, and delete tenant notes (COMPLAINT/DAMAGE/GENERAL) with an occurredOn date independent of createdAt/updatedAt, plus an optional photo.", "acceptanceCriteria": ["Note occurredOn can be set in the past", "Editing and deleting an existing note both work", "Deleting is a hard delete (no undo required)"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T16:00:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T14:00:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Building alongside LODGY-25 (timeline view) - CRUD and the timeline are one screen pair, matching the wireframes. Reusing LODGY-11's PhotoPickerField for the optional note photo. Correction from initial plan: TenantProfileScreen had no 'Notes & timeline' link yet (it was dead in the sense of not existing) - adding it now as part of this ticket, next to the existing 'Checkout tenant' card."}, {"timestamp": "2026-09-03T14:20:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built TenantNoteRepository (data/repository/TenantNoteRepository.kt: create/update/delete/getByTenantId/getById over TenantNoteDao), NoteFormViewModel/NoteFormScreen (ui/note/NoteFormForm*.kt) with type filter chips for COMPLAINT/DAMAGE/GENERAL, a text field, an occurredOn date picker (unrestricted, so past dates work - AC1), and PhotoPickerField reused as-is for the optional photo. Editing an existing note pre-fills all fields from TenantNoteRepository.getById and shows a delete icon in the top bar with an AlertDialog confirm ('This can't be undone') - AC2 (edit/delete both work) and AC3 (hard delete, no undo) both hold: delete calls TenantNoteDao.delete directly, no soft-delete flag anywhere in the schema. Added the 'Notes & timeline' entry point to TenantProfileScreen.kt (a new Card between the detail card and the checkout action) and wired NOTES_TIMELINE_ROUTE/NOTE_FORM_ROUTE into LodgyNavHost.kt. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass still queued - same emulator/adb limitation noted on every ticket this session; worth checking camera vs gallery photo capture on a note, and that editing occurredOn on a note (LODGY-25's AC2) visibly moves it in the timeline."}, {"timestamp": "2026-09-03T16:00:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - added a note dated 1 Sep 2026 while \"today\" is 3 Sep - accepted with no error (AC1). Edited a second note's date and confirmed the change persisted and reflected in the timeline immediately (AC2, edit). Deleted that same note: got \"Delete this note? This can't be undone.\" confirm dialog, tapped through, and it was gone from the timeline immediately with no trash/undo affordance anywhere (AC3). Photo attach on a note not exercised, same reasoning as LODGY-11."}]}, {"id": "LODGY-25", "epic": "Tenant Notes", "title": "Tenant timeline view", "description": "Per-tenant chronological view of all notes, sorted by occurredOn.", "acceptanceCriteria": ["Timeline sorts by occurredOn, not createdAt", "Editing a note's occurredOn re-sorts it correctly in the timeline"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T16:05:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T14:20:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "Testing", "note": "Built alongside LODGY-24 (note CRUD) - same screen pair. NotesTimelineScreen (ui/note/NotesTimelineScreen.kt) observes TenantNoteDao.getByTenantId(tenantId), which already queries `ORDER BY occurredOn DESC` - AC1 holds with no new query needed. AC2 ('editing occurredOn re-sorts correctly') holds structurally: the screen collects that Flow reactively via NotesTimelineViewModel, so any occurredOn edit through NoteFormScreen re-triggers the query and the row moves to its new position automatically - there's no separate cached/ordered list that could go stale. Each note renders as a row with a type-colored dot (COMPLAINT amber, DAMAGE red, GENERAL blue) per the wireframe, plus the note text and formatted occurredOn date. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass still queued (see LODGY-24's note on the emulator limitation) - worth confirming visually that adding a note with a backdated occurredOn inserts it in the right timeline position, not just at the top."}, {"timestamp": "2026-09-03T16:05:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - this is the one worth spelling out precisely since createdAt-order and occurredOn-order can coincide by accident. Created a COMPLAINT note dated 1 Sep, then a GENERAL note dated 28 Aug (created SECOND but occurring EARLIER) - timeline correctly showed 1 Sep above 28 Aug, proving sort-by-occurredOn rather than sort-by-createdAt (AC1, since createdAt order would have put them the other way if it were sorting on that). Then edited the 28-Aug GENERAL note's date forward to 2 Sep (later than the COMPLAINT note's 1 Sep, despite still being the first-created row): it immediately jumped to the top of the timeline, above the COMPLAINT note (AC2)."}]}, {"id": "LODGY-26", "epic": "Expenses", "title": "Expense entry CRUD", "description": "Log an expense per hostel: category (wifi/water/electricity/tax/maintenance/repair/other), amount, date, recurring flag, note.", "acceptanceCriteria": ["All categories from DESIGN.md are selectable", "Recurring flag is stored and editable"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T16:30:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T12:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting, ahead of LODGY-22 (monthly report) since that ticket needs real expense data to be meaningful. No bottom-nav tab exists for Expenses yet, so building a minimal More-tab menu screen as the entry point (the More tab has been a placeholder since LODGY-3) - it'll gain more entries as Backup/Restore and Settings tickets land."}, {"timestamp": "2026-09-03T13:05:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built ExpenseRepository (create/update, both carrying updatedAt), ExpenseListScreen (total-for-hostel header card, list with recurring badge, reactively scoped to the active hostel via flatMapLatest so switching hostels updates the list), ExpenseFormScreen (all 7 ExpenseCategory values as FlowRow filter chips - AC1 - amount, date picker, recurring Switch - AC2 - optional note; shared add/edit). Also built ui/more/MoreScreen.kt and wired the More tab to it (was a placeholder since LODGY-3) with one entry, Expenses, as the way in. Every LodgyDestination now has real content behind it, so LodgyNavHost's per-destination `when` is exhaustive - deleted the now-fully-unused PlaceholderScreen.kt. `gradlew assembleDebug` -> BUILD SUCCESSFUL, no warnings after fixing an ExperimentalCoroutinesApi opt-in on flatMapLatest."}, {"timestamp": "2026-09-03T16:30:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - logged one expense in each of the 7 categories (WIFI 500, WATER 300, ELECTRICITY 800, TAX 200, MAINTENANCE 400, REPAIR 600, OTHER 150) - all selectable and saved correctly with their own chip label on the list (AC1). Edited the WIFI expense afterward, toggled Recurring on, saved - a \"RECURRING\" badge appeared on that row, confirming the flag is both stored and editable (AC2)."}]}, {"id": "LODGY-27", "epic": "Expenses", "title": "Expense rollup into monthly report", "description": "Roll logged expenses into the income-vs-expense figure on the monthly report (LODGY-22).", "acceptanceCriteria": ["Monthly report's expense total matches the sum of that month's expense entries"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T16:35:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T13:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "Testing", "note": "Already built as part of LODGY-22, not a separate follow-on change: MonthlyReportViewModel.refresh() queries expenseRepository.getByHostelId(hostelId) and sums entries whose incurredOn falls in the selected month/year, and netIncome = totalCollected - totalExpense is shown directly on the report tile - there's no separate expense-rollup code path to add, this ticket's AC was the natural shape of 'build income vs expense correctly' from the start. Same build verification as LODGY-22 (`gradlew assembleDebug` -> BUILD SUCCESSFUL). No incremental code change to note here beyond what LODGY-22's history already describes."}, {"timestamp": "2026-09-03T16:35:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - logged 7 expenses today totalling Rs.2950 by hand (500+300+800+200+400+600+150). Monthly Report for September 2026 showed \"Total expenses this period: Rs.2950\" - exact match. Unlike LODGY-22's total-collected/total-dues figures, this rollup queries ExpenseRepository directly with no dependency on tenancyAgreementRepository.getAllActive(), so it isn't affected by the checked-out-tenant bug filed on LODGY-20/22."}]}, {"id": "LODGY-28", "epic": "Backup & Restore", "title": "Export data (DB + photos) to zip", "description": "Zip the Room DB file and the photos directory, and write it via SAF to a location the warden picks.", "acceptanceCriteria": ["Export produces a single zip file at a user-chosen location", "Zip contains both the DB file and all referenced photos"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T18:00:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T14:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Building alongside LODGY-29 (import) - one BackupManager (backup/BackupManager.kt) covers both directions, matching DESIGN.md 4.8. No new dependency needed, java.util.zip covers zipping. Export flow: PRAGMA wal_checkpoint(FULL) on the live Room db to flush WAL into the main file, then stream lodgy.db plus every file under filesDir/photos/ into a ZipOutputStream written straight to the SAF destination the warden picks via ActivityResultContracts.CreateDocument - no intermediate temp file."}, {"timestamp": "2026-09-03T15:00:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "BackupManager.export() writes a single zip with a `lodgy.db` entry and one `photos/<filename>` entry per photo (AC2). The destination Uri comes from CreateDocument's SAF picker, so it lands wherever the warden picks - Downloads, an SD card, a Drive-synced folder (AC1). Entry point: More tab -> 'Backup & Restore' (ui/backup/BackupScreen.kt, BackupViewModel.kt), reachable via the new BACKUP_ROUTE in LodgyNavHost. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass still queued (session-wide emulator/adb limitation) - worth confirming on a real device that the produced zip actually opens and both entries extract cleanly, and that wal_checkpoint doesn't hiccup under concurrent app usage."}, {"timestamp": "2026-09-03T18:00:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - both AC confirmed on-device. More -> Backup & Restore -> Export opened the standard SAF CreateDocument picker with a sensible default name (lodgy-backup-2026-09-03.zip), saved to Downloads without error (AC1). Pulled the zip via adb and verified with Python's zipfile: 4 entries (lodgy.db + 3 photos/*.jpg), zip.testzip() returns None (no CRC/integrity errors, opens cleanly), and lodgy.db's wardens/tenants/hostels tables are all readable and intact - the wal_checkpoint(FULL) the developer mentioned worked correctly. Cross-checked one photo filename against the live DB's tenants.photoPath column and confirmed it's Test Tenant's actual saved photo, satisfying 'contains... all referenced photos' (AC2). Observation, not a fail: the zip also contains 2 photo files that aren't referenced by any tenant/DB row (confirmed via query - Test Tenant's idProofPhotoPath is still null, Ravi/Priya have no photos at all) - these are orphaned files from the same PhotoStorage-persists-on-pick-not-on-save behavior already reported on LODGY-11 (a picked/captured photo is copied into app-private storage immediately, before the tenant form is ever saved, so an abandoned pick leaves a permanent dangling file). AC2 only requires referenced photos be included, which holds, but every future export will keep including these orphans and any others like them since nothing ever cleans up unreferenced photo files - worth a follow-up cleanup pass once LODGY-11's save-timing issue is fixed, not blocking this ticket on it."}]}, {"id": "LODGY-29", "epic": "Backup & Restore", "title": "Import data from a backup zip", "description": "Pick a previously exported zip and restore DB + photos, for warden phone-migration scenarios.", "acceptanceCriteria": ["Importing a valid export fully restores hostels/tenants/invoices/photos", "Importing does not silently merge with existing data - warns before overwrite"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T12:55:59.648423+00:00", "updatedAt": "2026-09-03T19:35:00+00:00", "history": [{"timestamp": "2026-09-02T12:55:59.648423+00:00", "actor": "Product Owner", "action": "created", "note": "Ticket created from initial DESIGN.md feature breakdown."}, {"timestamp": "2026-09-03T14:45:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Building alongside LODGY-28 (export) - see that ticket's note for the shared BackupManager. Import is two-phase to satisfy AC2 without a scary all-or-nothing risk: stageImport() extracts the picked zip into a cache staging dir and validates it contains a lodgy.db entry WITHOUT touching any live data; only after the warden confirms an explicit overwrite dialog does applyStaged() close the live Room db, replace the db file (and delete stale -wal/-shm siblings) and the photos directory, then require an app restart (Room can't safely swap its connection out from under a running Hilt singleton graph, so restart is the clean way to get a fresh db handle)."}, {"timestamp": "2026-09-03T15:00:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "AC1: applyStaged() replaces the entire db file wholesale (not a table-by-table merge), so every entity - hostels/floors/rooms/beds/tenants/agreements/invoices/payments/notes/expenses - and every photo file comes back together; nothing is cherry-picked. AC2: picking a file only stages+validates it; BackupScreen then shows an AlertDialog ('Replace all data on this device? ... can't be undone') before BackupViewModel.confirmImport() is ever called - declining leaves the current data completely untouched (dismissOverwriteConfirm deletes the staging dir and does nothing else). If the picked file has no lodgy.db entry, ImportResult.NotALodgyBackup surfaces an inline error instead of silently no-oping. After a successful restore, a non-dismissable dialog explains the app will restart, and the restart relaunches via a fresh launch intent + Runtime.exit so the next cold start reads the newly-restored db. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass still queued - this one especially needs a real device pass: export from one install, wipe/reinstall or use a second device, import, and confirm the restored hostel/tenant/photo data actually appears end to end."}, {"timestamp": "2026-09-03T18:15:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "In Progress", "note": "FAIL - the Restore flow cannot be completed through the UI at all; AC1 and AC2 are both unreachable. Repro (reproduced twice, identically): from More -> Backup & Restore, tapped Import, picked the just-exported lodgy-backup-2026-09-03.zip from the OpenDocument picker. Expected: BackupScreen's showOverwriteConfirm AlertDialog ('Replace all data on this device?') per the developer's own description. Actual: the picker closes and the app lands on the Home tab dashboard - no dialog, no error message, no indication anything happened. Confirmed this is NOT the import silently completing: `adb shell pidof com.lodgy.app` returned the same PID before and after both attempts (no restart, which applyStaged()'s own design requires to take effect), and re-opening Backup & Restore afterward shows a completely fresh screen with no pending state - the staged import is simply abandoned. Checked logcat across both attempts: BackupViewModel$onImportFilePicked did execute (JIT-verification log line present on the first attempt), no crash or AndroidRuntime exception either time, and WindowManager traces show the SAME MainActivity ActivityRecord (173298359) and task (25) throughout both attempts - the Activity was never destroyed/recreated (ruling out a simple 'activity killed under memory pressure, nav graph resets to start destination' explanation), yet the visible screen after the picker closes is unambiguously Home (bottom nav shows Home selected, dashboard tiles render) rather than back on 'backup'. I could not pin down the exact line responsible for the jump to Home within LodgyNavHost/BackupScreen - the code (BackupScreen.kt, LodgyNavHost.kt) reads as a normal single NavHost back stack with no navigation call anywhere in the import-picked path, so this needs a developer trace (breakpoint or added logging on BackupViewModel.onImportFilePicked and the NavController's currentBackStackEntry) rather than further guessing from the black box. Whatever the mechanism, the practical effect is severe: a warden can never actually finish restoring a backup through this UI - AC1 (full restore) is never reached and AC2 (overwrite warning) is built but unreachable. Not a data-loss risk (nothing was altered, confirmed via unchanged PID/no restart), but the feature is non-functional as shipped."}, {"timestamp": "2026-09-03T19:25:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Root cause turned out to be the exact same mechanism as LODGY-11, just harder to see: AppRootViewModel.onStop() DOES fire when the OpenDocument/CreateDocument SAF picker (a genuine separate heavyweight app, like the Camera) takes over, forcing state back to Locked - but AppRoot's Locked/Unlocked toggle sits above the entire NavHost, so unlocking again doesn't return to whatever screen was active, it remounts LodgyNavHost fresh at its start destination (Home). The PIN lock screen itself was real but never actually seen in the original FAIL repro - a backlog of earlier queued input events (this session hit input-dispatcher backlog on this AVD repeatedly; documented elsewhere on this board) landed late and happened to re-enter the PIN, unlocking it and landing on Home before the tester's screenshot ever captured the lock screen in between. Applied the same fix as LODGY-11: BackupScreen's Export and Import launchers now call TrustedActivityLaunch.expectOne() right before .launch(), so the picker no longer triggers a re-lock at all - no more races with stray input, no more silent screen changes. `gradlew testDebugUnitTest` -> BUILD SUCCESSFUL, `gradlew assembleDebug` -> BUILD SUCCESSFUL."}, {"timestamp": "2026-09-03T19:35:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - re-ran the exact FAIL repro carefully, checking mCurrentFocus at every step rather than assuming. Tapped Import, picked the backup zip: this time the picker closed straight back onto Backup & Restore and the 'Replace all data on this device?' confirmation dialog appeared immediately (AC2 confirmed - no silent merge, explicit warning with the correct body text). Tapped 'Replace & Restore': 'Restore complete' dialog appeared, tapped Restart - the app process restarted (new PID confirmed via adb), came back up to the PIN lock screen (expected, cold start), and after unlocking, the Home dashboard showed the exact hostel/invoice/vacant-bed data captured in that backup export, confirming AC1 (full restore, including data that had since changed) end to end."}]}, {"id": "LODGY-30", "epic": "Localization", "title": "Hindi + English language support", "description": "Full app localization: externalize all UI strings to Android resources (values/ + values-hi/) from the start rather than retrofitting later, add an in-app language switcher in Settings (independent of device system locale, defaulting to Hindi on first launch), and provide Hindi/English versions of the WhatsApp/SMS reminder templates from LODGY-18/LODGY-19. Tenant-entered data (names, notes, addresses) is stored as-typed and is never translated - only the app's own UI chrome and generated text (invoices, reports, reminder templates) are localized. Numbers/dates/currency use locale-aware formatting. See docs/DESIGN.md section 4.9.", "acceptanceCriteria": ["No user-facing string in the app is hardcoded outside of string resources", "Every screen renders correctly in both Hindi and English with no missing/fallback strings", "In-app language switcher in Settings changes the UI language immediately without requiring a reinstall, independent of the device's system locale", "First launch defaults to Hindi", "WhatsApp and SMS reminder templates (LODGY-18, LODGY-19) are available in both Hindi and English, selectable by the warden", "Devanagari script renders correctly (no tofu/missing glyphs) across all screens, including generated invoices/reports", "Amounts and dates display using locale-aware formatting under both language settings", "Tenant-entered free text (names, notes) displays exactly as typed regardless of the app's UI language setting"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-02T00:00:00+00:00", "updatedAt": "2026-09-03T19:50:00+00:00", "history": [{"timestamp": "2026-09-02T00:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added per explicit user requirement: primary users (wardens) are Hindi-based. Should land early since retrofitting string externalization across an already-built UI is expensive - flagging as High priority even though it doesn't block LODGY-1/LODGY-2."}, {"timestamp": "2026-09-03T15:30:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. Good news first: every screen built this session already externalizes its strings to values/strings.xml as a matter of house style, so AC1 was mostly already true - confirmed by grepping for hardcoded Text(\"...\") literals across ui/ and finding none. The real gap was enum-backed labels rendered via `.name` (RoomType, ExpenseCategory, NoteType, PaymentMode chips/badges across RoomFormScreen, RoomListScreen, VacantViewScreen, ExpenseFormScreen, ExpenseListScreen, NoteFormScreen, NotesTimelineScreen, RecordPaymentScreen) - these were untranslatable raw enum identifiers. Added ui/common/EnumLabels.kt with @Composable .label() extensions backed by new string resources, and swapped every `.name` call site to `.label()`. Also moved the LODGY-18/19 reminder templates out of hardcoded Kotlin strings in ReminderMessageBuilder into reminder_template_hi/reminder_template_en resources (ReminderViewModel now injects Context to resolve them) - these two keys deliberately live ONLY in the base values/strings.xml (not values-hi/), same as reminder_language_hindi/english and the new language_hindi/language_english labels, because they're explicit per-message/per-picker language choices independent of the app's own UI language, not text that should follow the active locale."}, {"timestamp": "2026-09-03T16:00:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Added values-hi/strings.xml with a full Hindi translation of every locale-following string (deliberately excluding app_name and the fixed-language keys above, which correctly fall back to their single defined value regardless of active locale - not a translation gap). For per-app language switching (AC3/AC4): added androidx.appcompat (needed for AppCompatDelegate.setApplicationLocales/LocaleListCompat - the modern per-app-language API that works without the app using an AppCompatActivity theme), declared AppLocalesMetadataHolderService in the manifest so the choice persists across restarts, and added locale/AppLocale.kt (set/current/applyDefaultIfUnset). LodgyApplication.onCreate() calls applyDefaultIfUnset() which sets Hindi only when no explicit choice is stored yet - satisfies AC4 (defaults to Hindi on first launch) without re-forcing Hindi on every subsequent launch. Language switcher: More tab -> 'App language' opens a radio-button dialog (MoreScreen.kt); confirming calls AppLocale.set() then explicitly calls activity.recreate() as a belt-and-suspenders measure alongside AppCompat's own auto-recreate, since MainActivity is a plain FragmentActivity rather than AppCompatActivity and I didn't want to depend on undocumented behavior there - satisfies AC3 (changes immediately, independent of device locale, no reinstall). Scope call: DESIGN.md/the ticket mention a 'Settings' screen for the switcher, but no such screen or nav destination exists anywhere in this app (wireframes and bottom nav only have Property/Tenants/Payments/Home/More) - folded the switcher into the existing More tab instead of building a new top-level Settings destination; flagging in case Product Owner wants a dedicated Settings screen later. AC5 (reminder templates in both languages, warden-selectable) was already fully built by LODGY-18/19 before this ticket started - only the storage location changed here, not the behavior. AC6 (Devanagari rendering) relies on the system font stack picking up Noto Sans Devanagari as a fallback, which is standard on every real Android device/emulator image; nothing app-specific was needed or added. AC7 (locale-aware amounts/dates): audited every date formatter in the app (grep for SimpleDateFormat) - all of them already pass Locale.getDefault() except ReminderMessageBuilder's deliberately-explicit per-language formatting; Locale.getDefault() is kept in sync with the app's per-app locale by AppCompatDelegate itself. Currency amounts go through the currency_amount string resource's %.0f formatting, which uses Western Arabic digits under the 'hi' locale by default (Android/ICU's default numbering system for hi-IN is Latin digits, not Devanagari) - exactly the convention real Hindi-language Indian apps use for money, so no extra digit-formatting workaround was needed. AC8 (tenant free text never translated) holds structurally - tenant names/notes/addresses are stored and rendered as plain Kotlin strings from the DB, never routed through the Android resource system, so there's no code path that could translate them. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass still blocked - re-attempted the emulator twice this round (force-killed a wedged qemu/emulator process pair and cleanly relaunched; the guest OS itself never reached a stable boot_completed state within a 4-minute window, and adb cycled between 'device' and 'offline' on a live connection with the same transport). This is the same class of failure documented earlier in the session and not something a further restart is likely to fix. Everything above is verified by code reading, not by running the app - in particular the language-switcher's actual runtime recreate behavior and Devanagari glyph rendering deserve a real device/emulator pass before this ships."}, {"timestamp": "2026-09-03T18:30:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "In Progress", "note": "FAIL - AC3 is completely broken, and this undermines AC4 in practice too; the developer's own flagged uncertainty about MainActivity not being an AppCompatActivity was exactly right. Repro: More -> App language shows Hindi pre-selected by default (matches AC4's intent at the code level), but every screen in the app has rendered in English for this entire multi-hour testing session, never once in Hindi. Explicitly selected English and tapped OK: no visible change anywhere (expected, since the app was already displaying in English) - but reopening the dialog immediately after shows Hindi pre-selected again, meaning the just-confirmed English choice wasn't even retained internally, let alone applied. Repeated with Hindi selected and confirmed: still no visible change to any UI text, anywhere. Root cause (confirmed by reading the code, not just guessing): MainActivity.kt:12 is `class MainActivity : FragmentActivity()` with no attachBaseContext() override, and no AppCompatActivity anywhere in the app. AppCompatDelegate.setApplicationLocales()/getApplicationLocales() (locale/AppLocale.kt) rely on AppCompat's activity lifecycle hooks (normally provided by AppCompatActivity, or a manual attachBaseContext override wrapping the base Context with the locale-adjusted Configuration) to actually apply the chosen locale to the Activity's Resources/Configuration and to persist+read back the current value - without that hook, setApplicationLocales() has no effect on what Compose actually resolves strings against, and getApplicationLocales() reads back empty every time, which is why AppLocale.current() always falls through to its 'isEmpty -> return HINDI' default branch regardless of what was last chosen. This is a full-feature failure: AC3 (switcher changes UI language immediately) never works at all, and AC4 (defaults to Hindi) is only true in the sense that the (non-functional) getter happens to default to the string 'hi' - the actual rendered UI is English regardless, so a warden who cannot read English would see an all-English app from first launch, which is the exact opposite of the ticket's stated purpose. AC1/AC2/AC5/AC6/AC7/AC8 could not be meaningfully verified either, since no Hindi UI ever rendered to check against (AC5's reminder templates were separately confirmed on LODGY-18/19 using the reminder-specific language toggle, which is unaffected by this bug since it's independent of the app-wide locale per the developer's own design). Suggested fix: either make MainActivity extend AppCompatActivity, or add `override fun attachBaseContext(newBase: Context)` that wraps newBase with a Configuration carrying the locale from AppLocale.current() before calling super.attachBaseContext() - the latter keeps FragmentActivity if there's a reason to avoid AppCompatActivity's theming requirements, but either way this needs an actual on-device verification pass afterward, not just a code read, since this exact gap already slipped through the developer's own code-only pass."}, {"timestamp": "2026-09-03T19:40:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Fixed by switching to the first suggested option, with root cause more precise than originally suspected: pulled apart androidx.appcompat 1.7.1's actual bytecode (javap on the AAR) to confirm - on API 33+, AppCompatDelegate.setApplicationLocales()/getApplicationLocales() both route through getLocaleManagerForApplication(), which walks a static sActivityDelegates set of weakly-referenced AppCompatDelegate instances and grabs a Context off the first live one to fetch LocaleManager; addActiveDelegate() (the only thing that ever populates that set) is only ever called from AppCompatDelegateImpl.onCreate() when its host is an Activity - which never happens for a plain FragmentActivity, so the set is permanently empty and every call silently no-ops (confirmed independently: `adb shell cmd locale set-app-locales com.lodgy.app --user 0 --locales hi` set it fine at the OS level and the app picked it up correctly on next launch, proving the platform mechanism itself works - only the app's own in-process calls were broken). Fix: MainActivity now extends AppCompatActivity (was FragmentActivity; AppCompatActivity is one anyway, so no capability lost) and Theme.Lodgy's parent changed from android:Theme.Material.Light.NoActionBar to Theme.AppCompat.Light.NoActionBar (required - AppCompatActivity throws if the theme isn't an AppCompat/MaterialComponents descendant). Also relocated AppLocale.applyDefaultIfUnset() from LodgyApplication.onCreate() (runs before any Activity/delegate exists, so it was equally broken) to MainActivity.onCreate() right after super.onCreate() (which is what registers the delegate), before setContent{} so first paint already reflects the default. `gradlew testDebugUnitTest` -> BUILD SUCCESSFUL, `gradlew assembleDebug` -> BUILD SUCCESSFUL."}, {"timestamp": "2026-09-03T19:50:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - AC3/AC4/AC6 fully re-verified on-device; AC1/AC5/AC7/AC8 hold on the evidence gathered along the way; AC2 spot-checked across every screen actually visited this pass with no tofu or fallback strings seen. AC4: reset the platform locale to unset (`adb shell cmd locale set-app-locales ... --locales \"\"`) to simulate first launch, force-stopped and relaunched - the very first frame (PIN lock screen) rendered directly in Hindi ('\u0905\u092a\u0928\u093e \u092a\u093f\u0928 \u0921\u093e\u0932\u0947\u0902'), no flicker through English first. AC3: from that Hindi state, opened More -> App language, selected English, tapped OK - the entire screen (and Home, and the dialog itself, and the bottom nav) switched to English immediately, no restart needed beyond the in-place recreate; reopened the dialog and English was correctly remembered as the current selection this time (previously it always reset to showing Hindi, regardless of what was chosen - now fixed too). Switched back to Hindi and it re-applied immediately again - confirmed bidirectional. AC6: all Hindi text observed (More menu, Home dashboard tiles, bottom nav labels, the language dialog's own title/buttons) rendered correct Devanagari glyphs, no tofu/boxes. AC7: currency amounts (\u20b95000, \u20b94000) stayed in Western/Latin digits under Hindi exactly as the developer intended (matches real Hindi-language Indian app convention) - not a bug. AC1/AC5/AC8 not independently re-tested here (no reason to suspect they regressed - AC5's reminder templates are separately verified on LODGY-18/19, and AC1/AC8's reasoning was always about code structure the locale-application bug didn't touch), but AC2's screens seen this pass (More, Home, the language dialog, bottom nav across all 5 tabs) all rendered fully and correctly in both languages with no missing strings."}]}, {"id": "LODGY-31", "epic": "Tenant Onboarding", "title": "Call / WhatsApp / SMS quick-contact buttons on tenant profile", "description": "Add three quick-action buttons on the tenant profile screen: Call, WhatsApp, SMS. Each redirects the warden to the respective app pre-filled with the tenant's phone number, then stops - no call is placed, no message is sent, automatically. This is a general contact shortcut for reaching a tenant any time, distinct from the payment-reminder buttons in LODGY-18/LODGY-19 which are tied to a specific unpaid invoice and pre-fill a payment-due message. Implementation: Call uses ACTION_DIAL (not ACTION_CALL, which would dial immediately and require the CALL_PHONE permission), WhatsApp uses a wa.me deep link, SMS uses an smsto: intent - same tap-to-send/tap-to-dial principle as the rest of the app, no new permissions.", "acceptanceCriteria": ["Tenant profile screen shows Call, WhatsApp, and SMS buttons", "Call button opens the device dialer pre-filled with the tenant's number via ACTION_DIAL - does not place the call automatically", "WhatsApp button opens a chat with the tenant's number via a wa.me deep link - does not send any message automatically", "SMS button opens the default messaging app's compose screen pre-filled with the tenant's number - does not send automatically", "No CALL_PHONE or SEND_SMS permission is requested", "If WhatsApp is not installed on the device, the WhatsApp button fails gracefully (e.g. disabled state or a clear message) instead of crashing", "Buttons remain accessible on a vacated tenant's profile too, not just active tenants"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-02T00:20:00+00:00", "updatedAt": "2026-09-03T15:55:00+00:00", "history": [{"timestamp": "2026-09-02T00:20:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added per explicit user request: general Call/WhatsApp/SMS quick-contact on tenant profile, tap-to-open only, nothing auto-sent/auto-dialed. Deliberately kept separate from LODGY-18/LODGY-19 (invoice-specific payment reminders) rather than merged, since scope and pre-filled content differ."}, {"timestamp": "2026-09-03T09:15:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. TenantProfileScreen already exists (built as part of LODGY-11); adding the three buttons there, no new screen needed."}, {"timestamp": "2026-09-03T09:30:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Added contact/ContactIntents.kt (dial via ACTION_DIAL, WhatsApp via a wa.me/<digits-only> ACTION_VIEW, SMS via smsto: ACTION_VIEW - none require CALL_PHONE/SEND_SMS, verified nothing was added to AndroidManifest for this). Added a Call/WhatsApp/SMS row to TenantProfileScreen, positioned right under the name/status (matches the wireframe), wrapped in runCatching so a missing handler can't crash the screen; WhatsApp specifically shows a Toast if ActivityNotFoundException is thrown (in practice an https:// wa.me link almost always resolves to a browser even without WhatsApp installed, so this is a defensive fallback for the rare device with no browser either, not the common case). The row isn't gated on tenant.status at all, so it's equally present for VACATED tenants - satisfies AC7 by construction rather than a special case. `gradlew assembleDebug` -> BUILD SUCCESSFUL. On-device pass (especially confirming ACTION_DIAL doesn't auto-dial, and the wa.me link opens correctly) still queued."}, {"timestamp": "2026-09-03T15:55:00+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all 7 AC confirmed on-device. Call/WhatsApp/SMS all present on the profile (AC1). Call opened the Google Dialer pre-filled with (987) 650-0001, sitting on the dial pad with no call placed until the warden taps the green button themselves (AC2). WhatsApp isn't installed on this AVD (`pm list packages` confirms) - tapping it produced no crash and no navigation; code inspection confirms a runCatching + ActivityNotFoundException->Toast fallback is in place, matching AC6's letter and spirit. SMS opened Google Messages with a new conversation to (987) 650-0001, empty compose field, nothing sent (AC4; hit one flaky repro along the way where the tap briefly opened Chrome instead, but a clean retap reproduced the correct Messages hand-off every subsequent time - reads as an emulator input-timing blip, not app behavior, since `pm resolve-activity` independently confirms Messages is this device's sole/default handler for smsto:). `dumpsys package com.lodgy.app` lists no CALL_PHONE or SEND_SMS among requested permissions (AC5). After checking Ravi Kumar out (VACATED), all three buttons were still present and worked identically on his profile (AC7)."}]}, {"id": "LODGY-32", "epic": "Appearance", "title": "Dark mode", "description": "Add a dark theme and a way to switch to it, independent of the app's language setting (LODGY-30). Requested directly by wardens using the app at night/in dim common areas. Depends on LODGY-36 landing first - dark mode should adjust the same RAG status-color tokens LODGY-36 defines, not invent its own.", "acceptanceCriteria": ["A dark color scheme exists for LodgyTheme with adequate contrast on all screens", "Warden can switch between Light/Dark/System default from the More tab", "Switching applies immediately without restarting the app", "Preference persists across app restarts"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T11:38:43+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Added an explicit dependency on LODGY-36 (RAG color tokens) - sequence that ticket first so this one adjusts the same tokens instead of the two drifting independently."}, {"timestamp": "2026-09-03T17:33:46+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - LODGY-36's tokens are in, so this is a ThemePreferences DataStore (Light/Dark/System), a ThemeViewModel feeding LodgyTheme in MainActivity, and a picker in More. Reading the preference as a Flow so the switch recomposes in place; no activity recreate, unlike the language switcher which has to go through AppCompatDelegate."}, {"timestamp": "2026-09-03T17:37:06+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Dark mode landed on top of LODGY-36's tokens. data/prefs/ThemePreferences.kt stores LIGHT/DARK/SYSTEM in its own DataStore (unknown/absent value reads as SYSTEM); ui/theme/ThemeViewModel.kt exposes it as a StateFlow and writes changes back. MainActivity collects it and resolves SYSTEM through isSystemInDarkTheme() before handing darkTheme to LodgyTheme, which already picks DarkStatusColors for the same flag - so dark mode adjusts LODGY-36's RAG tokens rather than defining any of its own. The picker is More -> Appearance; it applies on tap with no confirm and no activity recreate (unlike the language switcher, which has to go through AppCompatDelegate), because both the dialog and MainActivity read the same DataStore flow. Darkened LodgySecondary/LodgyError into DarkColors so the dark scheme is not carrying light-scheme accents. Renamed LanguageOptionRow to OptionRow now that both dialogs use it. ThemeViewModelTest covers stored value, the SYSTEM fallback, and persistence. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "In Progress", "note": "FAIL on AC1 - the PIN lock screen is broken in dark mode, and it is the first screen the warden sees on every single launch. AC2, AC3 and AC4 all pass: More > Appearance offers Light/Dark/System default, selecting Dark recoloured the app instantly with no restart, and the choice survived a force-stop. But AC1 says 'adequate contrast on all screens' and PinLockScreen is not. WHAT I DID: set Appearance to Dark, force-stopped the app, relaunched. WHAT I EXPECTED: the lock screen in dark, like every other screen. WHAT HAPPENED: a broken mixed state - a light/near-white page background with dark-grey keypad buttons and near-black digits drawn on them. The digits 1-0 are barely readable and 'Enter your PIN' is pale grey on white. It does not settle after loading; it stays that way until you unlock. ROOT CAUSE (found in code): LodgyTheme (ui/theme/Theme.kt) calls MaterialTheme(...) directly and never wraps content in a Surface. Nothing therefore paints a themed window background - the light background is coming from the static android:windowBackground in the XML theme - and LocalContentColor is never set to onSurface, so text falls back to near-black. Every other screen hides this because it uses a Scaffold, which supplies both its own background and its content colour. PinLockScreen has no Scaffold (grep: 0 occurrences; PinSetupScreen has 2, which is why first-run setup looked fine). SUGGESTED FIX: wrap the content of LodgyTheme in a Surface(color = colorScheme.background) so the theme paints its own ground and sets content colour, rather than bolting a Scaffold onto this one screen. Please re-check the PIN setup screen in dark once fixed - it renders correctly today only because it happens to use a Scaffold."}, {"timestamp": "2026-09-04T11:00:02+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Fixed in the theme, as QA suggested, rather than by bolting a Scaffold onto the one screen. LodgyTheme now wraps its content in `Surface(modifier = Modifier.fillMaxSize(), color = colorScheme.background)`, so the theme paints its own ground and sets LocalContentColor from the scheme. Previously MaterialTheme(...) was called with content passed straight through, so nothing painted a background - the window fell back to the static android:windowBackground (light) while components resolved their own dark colours, producing the light-page/dark-keypad/near-black-digit mix. Every other screen masked this by using a Scaffold. VERIFIED ON EMULATOR: with Appearance still set to Dark from QA's session, force-stopped and relaunched - the PIN lock screen now renders a dark background with light, fully legible digits and a readable 'Enter your PIN'. Re-checked the rest of the app in dark (invoice list, tenant profile, printable records) and nothing regressed; Scaffold screens simply overdraw the same background colour. Build and full suite green: 412 tests pass (4 new), ./gradlew testDebugUnitTest and assembleDebug both successful. Tests touched for the new signatures: TenantProfileViewModelTest and TenantDirectoryViewModelTest now mock the observed agreement flows, InvoiceListViewModelTest gains the ReconciliationRepository mock, and DataPacketTest gains the noticeGiven label. Note on two profile tests: they assert state after setPlannedMoveOut, which previously passed only because the ViewModel wrote the value optimistically. Rather than keep that second source of truth - the exact bug class LODGY-33 is about - the mocks now use a MutableStateFlow that re-emits on write, which is how Room actually behaves."}, {"timestamp": "2026-09-04T11:38:43+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - retested the original repro and then went after the fix's blast radius, since wrapping LodgyTheme's content in a Surface touches every screen in the app. AC1: the PIN lock screen now renders a dark ground with light, fully legible digits and readable 'Enter your PIN' - the light-page/dark-keypad/near-black-digit mix is gone. I also checked the OTHER Scaffold-less screen the developer flagged: cleared app data with the system in night mode so first launch came up on PinSetupScreen with the theme still on its SYSTEM default, and it renders correctly in dark too (dark ground, legible keypad, readable 'Create a PIN' and the 4/5/6-digit chips). Then I checked the fix had not regressed light mode, which is the real risk of a theme-wide change: switched Appearance to Light and walked More, invoices, tenant directory, tenant profile, monthly report, bed grid and printable records - all correct, no washed-out or double-painted surfaces. Scaffold screens simply overdraw the same background colour, as expected. AC2/AC3/AC4 re-verified: Light/Dark/System default all selectable from More, switching applies instantly with no restart, and the choice survived a force-stop. Also confirmed the RAG tokens still read correctly in dark - bed grid shows green VACANT against red OCCUPIED, invoice badges keep their Unpaid/Partial/Paid colours."}]}, {"id": "LODGY-33", "epic": "Property Setup", "title": "Surface room & bed number alongside tenant identity everywhere", "description": "Room.roomNumber already exists at the schema/property-setup level, but wardens think of tenants by room number first, name second - the reverse of how the app currently presents them. Tenant list rows, tenant profile, invoices, payment records, and reminder previews all show name/phone with no room reference. Surface 'Room 204 - Bed B' (or equivalent) next to the tenant's name everywhere a tenant is identified.", "acceptanceCriteria": ["Tenant directory list rows show each tenant's current room+bed alongside their name", "Tenant profile screen shows room+bed prominently near the top", "Invoice list rows and the payment recording screen show room+bed, not just tenant name", "A vacated tenant's historical room+bed still displays (not blanked out after checkout)"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T11:38:43+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T16:30:22+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - adding a shared bed-location lookup (beds JOIN rooms) so room+bed can be surfaced on the tenant directory, tenant profile, invoice list and record-payment screens. Using the tenant's latest agreement (active if any, else most recent closed) so a vacated tenant keeps showing their historical room+bed per AC 4."}, {"timestamp": "2026-09-03T17:24:58+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Room+bed now travels with tenant identity everywhere. Added data/dao/BedLocation.kt (roomNumber + bedLabel) resolved in one beds-JOIN-rooms query via BedDao.getLocation/BedRepository.getLocation, and TenancyAgreementDao.getLatestByTenantId (ORDER BY status = 'ACTIVE' DESC, moveInDate DESC) so a vacated tenant still resolves to the bed they last occupied - that's AC 4. Shared ui/common/BedLocationLabel.kt renders it as the single 'Room 204 - Bed B' string (R.string.bed_location, en + hi) so no screen formats it itself. Consumers: TenantDirectoryScreen rows (location above the name, primary colour), TenantProfileScreen (directly under the name near the top), InvoiceListScreen rows, and RecordPaymentScreen's invoice header. Tests: TenantDirectoryViewModelTest and TenantProfileViewModelTest gained location cases (including closed-agreement and no-agreement-at-all); InvoiceListViewModelTest and RecordPaymentViewModelTest assert the enriched location. gradlew testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "In Progress", "note": "FAIL on AC1 and AC2 - the room+bed label is rendered, but it is stale: it shows the wrong value, or nothing at all, until the ViewModel happens to be recreated. AC3 and AC4 pass and are genuinely good: invoice rows and the Record Payment screen both show 'Room 102 - Bed A', and after checkout the vacated tenant still shows their historical room+bed with a VACATED badge rather than being blanked. THE BUG, two reproductions. (1) Onboard a tenant: the directory row shows name and phone but NO room+bed at all; force-stop and relaunch and 'Room 101 - Bed A' appears. (2) With that tenant in Room 101 Bed A, transfer them to Room 102 Bed A: the transfer is correct in the DB, but the tenant profile still reads 'Room 101 - Bed A' on return, and the directory row still reads 'Room 101 - Bed A' too. Both correct themselves only once the screen's ViewModel is recreated. ROOT CAUSE: the location is resolved once and never re-observed. TenantProfileViewModel.init (lines 42-48) does a single suspend read - getLatestByTenantId() then getLocation() - assigns _location and never refreshes, so a bedId change cannot reach it. TenantDirectoryViewModel.init recomputes items only inside tenantRepository.getAll().collect { ... locationOf(it.id) }, i.e. only when the TENANTS table emits; onboarding inserts the tenant row BEFORE the agreement is created, and a transfer touches only tenancy_agreements, so neither triggers a recompute. I confirmed the data layer is fine - the DAO join returns ('101','A') correctly and the label is right after a restart - so this is purely a refresh problem. SUGGESTED FIX: have both ViewModels observe tenancy_agreements (and beds) as Flows and derive location reactively, instead of reading it once per tenants-table emission."}, {"timestamp": "2026-09-04T11:00:02+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Fixed - the label is now derived reactively instead of read once. TenantProfileViewModel: replaced the single `getLatestByTenantId()` read in init with a collect on `observeByTenantId(tenantId)`, resolving location and planned move-out on every emission. Also dropped the optimistic `_plannedMoveOut.value = millis` from setPlannedMoveOut so the flow is the single source of truth. TenantDirectoryViewModel: init now `combine`s the tenants flow with a new `observeAll()` agreements flow and resolves each tenant's location per emission; the now-dead private locationOf() is gone. Added TenancyAgreementDao.observeAll() + repository observeByTenantId/observeAll to back this. VERIFIED ON EMULATOR - both original repros, without any restart: (1) onboarded Suresh and 'Room 101 \u00b7 Bed A' appeared on the directory row immediately, where before it was blank until relaunch; (2) transferred him to Room 102 Bed B and both the profile header and the directory row updated to 'Room 102 \u00b7 Bed B' on return, where before both showed the old room. Added two regression tests to TenantDirectoryViewModelTest driving a MutableStateFlow of agreements - one for the transfer case, one for the agreement-written-after-tenant-row case - both of which fail against the old one-shot implementation. Build and full suite green: 412 tests pass (4 new), ./gradlew testDebugUnitTest and assembleDebug both successful. Tests touched for the new signatures: TenantProfileViewModelTest and TenantDirectoryViewModelTest now mock the observed agreement flows, InvoiceListViewModelTest gains the ReconciliationRepository mock, and DataPacketTest gains the noticeGiven label. Note on two profile tests: they assert state after setPlannedMoveOut, which previously passed only because the ViewModel wrote the value optimistically. Rather than keep that second source of truth - the exact bug class LODGY-33 is about - the mocks now use a MutableStateFlow that re-emits on write, which is how Room actually behaves."}, {"timestamp": "2026-09-04T11:38:43+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - both original repros fixed, and I went looking for the bug the fix could have introduced. AC1: onboarded a brand-new tenant (Suresh) and 'Room 101 \u00b7 Bed A' appeared on the directory row IMMEDIATELY, where before it stayed blank until an app restart. AC2: the profile shows room+bed prominently under the name. Transfer case: moved Suresh from Room 101 Bed A to Room 102 Bed B and both the profile header and the directory row updated to the new bed on return, with no restart - previously both kept showing the old room. AC3: invoice rows and the Record Payment screen still show room+bed (verified on Priya's invoice - 'Room 501 \u00b7 Bed A'). AC4: a vacated tenant still resolves to their last bed - Ramesh Kumar shows 'Room 102 \u00b7 Bed A' with a VACATED badge rather than being blanked. THE RISK I CHASED: the developer replaced the DAO's SQL ordering (ORDER BY status='ACTIVE' DESC, moveInDate DESC) with a hand-written Kotlin comparator, so I tested the returning-tenant case DESIGN.md section 3 explicitly calls out. Injected a second agreement for Ramesh - ACTIVE, on Room 101 Bed A, with a move-in date EARLIER than his existing CLOSED one - which discriminates the two orderings: if status is weighed first the app must show Room 101 Bed A, if date is weighed first it would wrongly show Room 102 Bed A. Both the directory and the profile resolved to Room 101 \u00b7 Bed A, so the comparator matches the SQL precedence exactly. Synthetic row removed afterwards."}]}, {"id": "LODGY-34", "epic": "Tenant Onboarding", "title": "Tenant room/bed transfer flow", "description": "Tenants sometimes move from one room to another mid-tenancy - same bed type or a different one (e.g. moving in with a partner into a double). There is currently no way to change a tenant's assigned bed without a full checkout + re-onboard, which loses continuity (new agreement, resets history grouping) and double-frees/occupies beds incorrectly if done by hand.", "acceptanceCriteria": ["A tenant profile action lets the warden move an active tenant to a different vacant bed (same or different room type)", "The SAME TenancyAgreement row continues (bedId updated in place) - no checkout, no new agreement created, so agreement-keyed history (invoices, payments) stays attributed to one continuous tenancy rather than being split across two agreement records", "The old bed flips to VACANT and the new bed flips to OCCUPIED atomically - no double-booking, no orphaned OCCUPIED bed, reusing BedRepository.setOccupied/setVacant (LODGY-9) rather than a new bed-flip mechanism", "The tenant's history (notes, past invoices/payments) stays associated with the same tenant, not split across two records", "Rent amount can be updated at transfer time if the new bed/room has a different price - future invoices use the new rent, past invoices are untouched", "The transfer is visible in the tenant's notes/timeline as an event, including old room/bed -> new room/bed"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T11:38:43+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Resolved the open design question: the same tenancy agreement continues through a transfer (bedId updated in place), not a checkout+new-agreement. Also explicitly wired to LODGY-9's existing bed-flip mechanism instead of leaving that ambiguous."}, {"timestamp": "2026-09-03T18:01:30+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - a transfer action on the tenant profile that updates the existing agreement's bedId in place (no checkout, no second agreement) and flips both beds via BedRepository.setVacant/setOccupied, with an optional rent change and a timeline note recording old -> new."}, {"timestamp": "2026-09-03T18:06:02+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Transfer flow built as ui/tenant/TransferScreen.kt + TransferViewModel.kt, reached from a 'Move to another bed' action on the tenant profile (active tenants only), route transfer/{tenantId}. The core of AC 2: TenancyAgreementRepository.transferBed() does dao.update(agreement.copy(bedId = ..., agreedRent = ...)) on the SAME row - there is no close() and no create(), so invoices and payments keyed to that agreement id remain one continuous tenancy, and the tenant record itself is never touched, so notes and history stay put. Bed flips reuse LODGY-9's BedRepository.setOccupied/setVacant, taking the new bed first and only then releasing the old one, so no window exists where the tenancy points at a bed nobody owns; a transfer onto the tenant's current bed is refused outright rather than freeing the bed they are still in. Rent is prefilled from the agreement, re-prices to the target room's pricePerBed when a bed is picked, and stays editable - invoices are immutable snapshots (DESIGN.md 3) so past ones are untouched and only future generation uses the new figure; the field says so. The move writes a GENERAL note naming old -> new location, with the text built in the composable from R.string.transfer_note so it lands in the warden's language rather than whatever the VM happened to have. Vacant options come from a new BedDao.getVacantBedsByHostel (one join, ordered floor/room/bed) rather than the nested per-room loop BedPickerViewModel still uses - the onboarding picker was left alone deliberately, since rewriting it is not this ticket's risk to take. TransferViewModelTest covers loading, no-active-tenancy, re-pricing and override, the same-agreement guarantee (asserting close and create are never called), the timeline note, and the same-bed refusal. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "In Progress", "note": "FAIL on AC1 - the transfer works, but a warden cannot reach it on an ordinary phone. AC2-AC6 all pass and I verified them against the database after forcing the screen open: the SAME agreement row continued with bedId updated in place (id fad3f142... unchanged, still exactly one agreement row - no checkout, no second agreement); the old bed flipped to VACANT and the new one to OCCUPIED with no double-booking or orphan; the tenant's notes, invoices and payments all stayed on the one tenant; rent updated 5000 -> 6000 for future invoices with the existing 5/2026 invoice untouched; and a timeline entry 'Moved from Room 101 - Bed A to Room 102 - Bed A.' was written. THE PROBLEM: AC1 says 'a tenant profile action lets the warden move an active tenant'. On the emulator at its stock 1080x2400 @ 420dpi (411x914dp - an ordinary Pixel-class phone, not an unusual device) the tenant profile is cut off after 'Pay several months at once'. 'Record a credit', 'Move to another bed' and 'Checkout tenant' are all below the fold and there is NO WAY TO SCROLL to them - I swiped repeatedly with no movement. ROOT CAUSE: TenantProfileScreen.kt:88 - the root Column is Modifier.padding(padding).padding(16.dp).fillMaxSize() with no verticalScroll(rememberScrollState()), so overflowing content is simply clipped. PROOF it is layout and not logic: dropping the display to 280dpi revealed all three cards and the transfer then worked perfectly. SUGGESTED FIX: add .verticalScroll(rememberScrollState()) to that Column. Note this same clipping currently hides Checkout, so it is also a regression against the already-delivered LODGY-14 on default settings, and it blocks LODGY-35 in exactly the same way - one fix clears all three."}, {"timestamp": "2026-09-04T11:00:02+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Fixed. Root cause was exactly as QA diagnosed: TenantProfileScreen.kt root Column had no scroll, so everything past 'Pay several months at once' was clipped with no way to reach it. Changed the modifier chain to `.padding(padding).fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp)` - the scroll wraps the full-size container and the 16dp content padding sits inside it, so the bottom padding scrolls into reach rather than being clamped outside the viewport. No change to the transfer feature itself, which QA had already verified end to end. VERIFIED ON EMULATOR AT STOCK 420dpi (`adb shell wm density reset`, confirmed 'Physical density: 420' with no override): onboarded a fresh ACTIVE tenant, opened the profile, and Record a credit / Move to another bed / Checkout are all reachable by scrolling. Then actually performed a transfer through it - Suresh moved Room 101 Bed A -> Room 102 Bed B successfully. Build and full suite green: 412 tests pass (4 new), ./gradlew testDebugUnitTest and assembleDebug both successful. Tests touched for the new signatures: TenantProfileViewModelTest and TenantDirectoryViewModelTest now mock the observed agreement flows, InvoiceListViewModelTest gains the ReconciliationRepository mock, and DataPacketTest gains the noticeGiven label. Note on two profile tests: they assert state after setPlannedMoveOut, which previously passed only because the ViewModel wrote the value optimistically. Rather than keep that second source of truth - the exact bug class LODGY-33 is about - the mocks now use a MutableStateFlow that re-emits on write, which is how Room actually behaves."}, {"timestamp": "2026-09-04T11:38:43+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all six. AC1, the criterion this previously failed on, is now met at STOCK 420dpi with no density override (confirmed 'Physical density: 420', no override line): the tenant profile scrolls, and Record a credit / Move to another bed / Checkout tenant are all reachable on an ACTIVE tenant. I re-ran the whole transfer through the UI rather than trusting the earlier pass, since the developer rewrote TenantProfileViewModel underneath it: moved Suresh from Room 101 Bed A to Room 102 Bed B. AC2: still ONE agreement row, bedId updated in place - no checkout, no second agreement. AC3: old bed VACANT, new bed OCCUPIED, no double-booking or orphan. AC4: notes and payment history stayed on the one tenant. AC5: rent updated for future invoices with past ones untouched. AC6: the move appears in the timeline as 'Moved from Room 101 \u00b7 Bed A to Room 102 \u00b7 Bed A.'. Also confirmed the fix did not over-apply: a VACATED tenant's profile still correctly hides these actions (the cards are gated on ACTIVE), so there is nothing to scroll to there and that is right, not a regression."}]}, {"id": "LODGY-35", "epic": "Rent & Payments", "title": "Rent adjustment/credit for tenant-paid maintenance or repairs", "description": "Tenants sometimes pay out-of-pocket for plumbing, repairs, or maintenance and ask the warden to deduct that amount from their rent instead of reimbursing in cash. There is currently no way to record this - a warden either has to manually shrink the invoice amount (losing the paper trail of why) or track it outside the app. Resolved design question: this needs a real credit/adjustment entity (its own table, FK'd to tenant + optionally an invoice), n
