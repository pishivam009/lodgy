: "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Resolved: run automatically on app start, not as a manual action a warden would have to remember to trigger."}, {"timestamp": "2026-09-03T18:38:27+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - an app-start sweep on a background dispatcher that deletes files under filesDir/photos referenced by no tenant's photoPath or idProofPhotoPath."}, {"timestamp": "2026-09-03T18:41:39+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Added media/OrphanPhotoCleaner.kt, run fire-and-forget from LodgyApplication.onCreate() on Dispatchers.IO so startup never waits on a directory listing and a sweep that races a fresh pick simply finds that file referenced on the next launch - no manual action anywhere. It reads every tenant, vacated included (a checked-out tenant's ID proof is still a live reference), collects photoPath and idProofPhotoPath, and deletes anything under filesDir/photos not in that set. Matching is by file name rather than the stored absolute path: LODGY-29's restore copies photos back by name while the DB keeps whatever path the old install wrote, so a full-path comparison would declare a freshly restored library entirely orphaned and delete every photo the warden has - the exact failure this ticket must not introduce. Because the sweep runs before an export, LODGY-28's zip stops carrying dangling files (AC 3). OrphanPhotoCleanerTest runs against a real TemporaryFolder and covers the keep/delete split, ID-proof-only references, vacated tenants, the restored-under-a-different-path case, empty and missing directories, and the no-tenants case. testDebugUnitTest green (322 tests)."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - AC1 verified live, not just read. AC1: planted two unreferenced files (orphan_a.jpg, orphan_b.jpg) in filesDir/photos, force-stopped and relaunched the app, and both were gone on the next listing with no manual action; LodgyApplication.onCreate() fires the sweep on Dispatchers.IO so startup does not block on a directory listing. AC2: referenced photos are safe - the cleaner matches on file NAME against every tenant from tenantRepository.getAll(), vacated included, and OrphanPhotoCleanerTest covers exactly this: referenced files kept, an id-proof photo counted as a reference, a vacated tenant's photos never swept, and restored photos matched by name so a restore is not mass-deleted. AC3: follows from AC1 - the orphans no longer exist by the time an export runs, so they cannot ride along in the zip."}]}, {"id": "LODGY-52", "epic": "Reporting & Dashboard", "title": "Investigate historical occupancy % tracking for past-period reports", "description": "Buried limitation from LODGY-22: Monthly Report's occupancy % is computed against the hostel's CURRENT bed count, not a true historical reconstruction, because the schema only stores current bed rows and agreement history - there's no way to know how many beds existed or were occupied at an arbitrary past date. Flagged rather than shipping a number that looks precise but isn't. Worth a product decision: is this worth a schema change (e.g. periodic bed-state snapshots), or should the report keep disclosing it's a current-state figure?", "acceptanceCriteria": ["Product decision recorded: either (a) implement periodic occupancy snapshots so past-period reports show true historical occupancy, or (b) keep current-state occupancy but label it clearly on the report so it isn't misread as historical", "If (a): Monthly Report's occupancy % for a past period reflects that period's actual bed/occupancy state"], "status": "Done", "priority": "Low", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T18:41:39+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - taking option (b). Reconstructing historical occupancy needs bed-state snapshots the schema does not keep, and inventing them now would add a write on every bed flip to serve a number no one has asked to act on; labelling the figure honestly costs nothing and stops it being misread."}, {"timestamp": "2026-09-03T18:44:03+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Took option (b) and implemented it. Reasoning, for the Product Owner to overturn if they disagree: option (a) means writing a bed-state snapshot on every occupancy change forever, plus a backfill that cannot recover the months already gone - real ongoing cost, for a number nobody has yet described acting on. What the report actually had was a precision problem, not a data problem, so it is now labelled honestly instead. MonthlyReportUiState.occupancyIsCurrentStateOnly is true whenever the selected period has already closed; in that case the tile reads 'Occupancy (today)' rather than 'Occupancy', a line under the report explains that occupancy is measured from the beds as they stand today because the app keeps no history of bed occupancy, and the same note is appended to the CSV export so a saved report carries the caveat with it. For the current month the label and figure are unchanged - there the current-state reading is the correct one. MonthlyReportViewModelTest covers the flag across past, current and future periods. testDebugUnitTest green. If the Product Owner wants (a) instead, it should come back as a fresh ticket for periodic bed snapshots - it is a schema change, not an edit to this."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - option (b), and implemented well. AC1: the product decision is recorded in the UI itself rather than only in a doc. For a past period the tile is labelled 'Occupancy (today)' and the report carries the explicit caveat 'Occupancy is measured from the beds as they stand today, not as they stood in this period - the app does not keep a history of bed occupancy.' For the current period the plain 'Occupancy' label is used, which is correct since current-period occupancy really is today's. The caveat also survives into the CSV export. AC2 does not apply - (a) was not chosen. Cosmetic note for the PO, not a fail: the CSV emits two rows both keyed 'Occupancy' (the value and the caveat), which is awkward for anyone parsing it in a spreadsheet."}]}, {"id": "LODGY-53", "epic": "Usability", "title": "Sort and filter controls on Room/Bed views", "description": "Split out of the original LODGY-39 (too broad as one ticket). Wardens want to filter Room/Bed views to vacant-only or occupied-only, so a full property scan doesn't require mentally filtering a long mixed list. Applies to RoomListScreen, BedGridScreen, and VacantViewScreen (LODGY-21) consistently.", "acceptanceCriteria": ["Room/bed views can filter to vacant-only or occupied-only", "Filter state is per-screen and obvious when active (not a silent, easy-to-forget toggle)"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-03T21:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added following backlog review: splitting LODGY-39, giving LODGY-37/45 a shared PDF prerequisite, and folding in the latest round of direct feedback (a real delete-without-confirmation bug hit on Rooms, a default-language reversal, and new notification/navigation-polish requests)."}, {"timestamp": "2026-09-03T17:41:53+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - adding bed-occupancy aggregate queries (grouped in SQL rather than combining one Flow per room) so RoomListScreen can filter by whether a room still has space, then a status filter on BedGridScreen and on VacantViewScreen. Reusing LODGY-39's FilterChipRow so the three screens read identically."}, {"timestamp": "2026-09-03T17:47:07+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Filters landed on all three bed-facing screens, sharing one BedFilter (ALL/VACANT/OCCUPIED) and matches() in ui/common/StatusBadge.kt plus the BedFilterChips composable, so the chips look and behave identically wherever they appear. BedGridScreen filters its tiles directly. VacantViewScreen now loads every bed rather than pre-filtering to vacant in the query, and defaults its chip to VACANT - the screen opens exactly as before, but the other two options turn it into a full bed browser; its floor-count and empty-state strings were de-hardcoded from 'vacant' accordingly. RoomListScreen needed a different question, since a room has no status of its own: All / Has space / Full, where 'has space' means at least one vacant bed and 'full' means every bed taken. That needs bed counts per room, so BedDao gained observeOccupancyByFloor (a GROUP BY, not one Flow per room - that would re-emit everything on any bed edit and scale with the property) and each row now shows 'N vacant / M beds'. Filter state is per-screen, always visible as a selected chip, and an empty result says 'Nothing matches this filter' rather than reusing the no-data message. Also added observeOccupancyByHostel in the same pass for LODGY-41. Tests: RoomListViewModelTest covers counts, a bed-less room, and the has-space/full split; VacantViewViewModelTest covers the default and both other filter positions. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS. AC1: verified on all three screens - RoomListScreen has All / Has space / Full, and BedGridScreen and VacantViewScreen both have All / Vacant / Occupied backed by the shared BedFilter in ui/common/StatusTokens.kt, so the three read the same way. Filtering Room 102's grid to Occupied correctly left only Bed A. VacantViewScreen additionally filters by floor (All floors / Ground / First). AC2: filter state is per-screen and the active chip is visibly selected (filled container vs outlined), so it is obvious when a filter is on."}]}, {"id": "LODGY-54", "epic": "Usability", "title": "Date/period filter and sort on the Invoice list", "description": "Split out of the original LODGY-39. Extends LODGY-17's existing Unpaid/Partial/Paid status filter chips with a date/period filter and a sort option, so a warden isn't scrolling through every invoice ever created to find this month's.", "acceptanceCriteria": ["Invoice list's existing status filter chips (LODGY-17) are joined by a month/year filter, reusing the same numeric month/year field pattern already used in Manual Invoice entry (LODGY-16) and Monthly Report (LODGY-22) rather than introducing a new date-range picker", "Invoice list can be sorted by due date or amount", "Combining a status filter and a date filter narrows correctly (both apply together, not one replacing the other)"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T21:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added following backlog review: splitting LODGY-39, giving LODGY-37/45 a shared PDF prerequisite, and folding in the latest round of direct feedback (a real delete-without-confirmation bug hit on Rooms, a default-language reversal, and new notification/navigation-polish requests)."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Resolved the month/year-vs-date-range ambiguity in favor of month/year, for consistency with the picker pattern already used elsewhere in the app."}, {"timestamp": "2026-09-03T17:47:21+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - adding a period filter (numeric month/year fields, same pattern as Manual Invoice and Monthly Report, not a new date-range picker) and a due-date/amount sort alongside the existing status chips, with all three composing rather than replacing each other."}, {"timestamp": "2026-09-03T17:49:54+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Invoice list gained a period filter and a sort next to LODGY-17's existing status chips. Period is two numeric month/year fields, the same numeric pattern Manual Invoice (LODGY-16) and Monthly Report (LODGY-22) already use rather than a new date-range picker; both default to blank, meaning 'any period', so opening the tab still shows everything instead of silently narrowing to this month. Sort chips switch between due date (newest first) and amount (largest first). All three compose in InvoiceListUiState.filteredItems - status narrows, then period narrows the result, then the sort applies - so combining a status and a period genuinely intersects rather than one replacing the other. Non-digits are stripped on input so a stray character cannot silently null the filter. InvoiceListUiStateTest covers blank periods, month and year narrowing independently and together, status+period intersecting, and both sort orders. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all three. AC1: the existing Unpaid/Partial/Paid chips are joined by numeric Month and Year fields, the same pattern already used by Manual Invoice entry and the Monthly Report, not a new date-range picker. AC2: Sort by Due date / Amount is present and works. AC3: combining narrows correctly - Unpaid + 5/2026 still returned the 5/2026 invoice, and changing only the month to 1 returned nothing while the status chip stayed on Unpaid, so both predicates apply together rather than one replacing the other. Minor observation for the PO, not a fail: when a filter combination matches nothing the list is simply blank, with no 'nothing matches these filters' message like the tenant directory has."}]}, {"id": "LODGY-55", "epic": "Usability", "title": "Filter and sort controls on the Expense list", "description": "Split out of the original LODGY-39. Wardens want to filter expenses by category and sort by date or amount, especially once a hostel has months of recurring entries (WiFi, water, etc. from LODGY-26/27).", "acceptanceCriteria": ["Expense list can filter by category", "Expense list can sort by date or amount"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T21:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added following backlog review: splitting LODGY-39, giving LODGY-37/45 a shared PDF prerequisite, and folding in the latest round of direct feedback (a real delete-without-confirmation bug hit on Rooms, a default-language reversal, and new notification/navigation-polish requests)."}, {"timestamp": "2026-09-03T17:49:54+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - category filter and date/amount sort on the expense list, reusing FilterChipRow."}, {"timestamp": "2026-09-03T17:52:20+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Expense list gained a category filter (an 'All' chip plus one per ExpenseCategory, reusing the existing .label() so the names stay translated) and a date/amount sort, both via the shared FilterChipRow. The header total now sums the visible rows rather than every expense - under a 'Repair only' list the number a warden reads is the repair total, and the active chip is right above it so there is no ambiguity about what is being totalled. An empty filtered result says 'Nothing matches this filter' instead of the no-expenses-yet message. ExpenseListViewModelTest covers the filter narrowing both list and total, clearing back to All, and both sort orders. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS. AC1: the category filter works - with a WIFI 1000 and an ELECTRICITY 3000 logged, selecting WIFI left only the WIFI row and the header total correctly dropped from 4000 to 1000, so the summary respects the filter rather than always showing the unfiltered total. AC2: Sort by Date / Amount both present; sorting by Amount ordered 3000 then 1000. Recurring entries are badged RECURRING in the list, which is what LODGY-60's expense reminder keys off."}]}, {"id": "LODGY-56", "epic": "Reporting & Dashboard", "title": "Shared PDF rendering foundation", "description": "LODGY-37 (per-invoice PDF acknowledgement) and LODGY-45 (full-data printable PDF export) both need to generate PDFs, and the app currently has zero PDF infrastructure - LODGY-23 deliberately shipped CSV-only and explicitly skipped PDF generation. Build one shared renderer that both consumers use, instead of two independent, inevitably-inconsistent PDF pipelines. This is a prerequisite for LODGY-37 and LODGY-45 - land this first. Implementation choice (native PdfDocument API vs. a PDF library) is no longer constrained by APK size - LODGY-48 was marked Won't Do, so pick whichever approach is simplest to get right (a library is fine if it saves real implementation risk, e.g. around Devanagari text shaping/pagination).", "acceptanceCriteria": ["A single PDF-rendering module exists (page setup, text/table layout helpers, Devanagari-safe font handling for Hindi-language content per LODGY-30) that isn't tied to one specific document's content", "Produces valid, correctly-paginated multi-page PDFs when content overflows a single page", "LODGY-37 and LODGY-45 both consume this module rather than each rolling their own PDF generation"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-03T21:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added following backlog review: splitting LODGY-39, giving LODGY-37/45 a shared PDF prerequisite, and folding in the latest round of direct feedback (a real delete-without-confirmation bug hit on Rooms, a default-language reversal, and new notification/navigation-polish requests)."}, {"timestamp": "2026-09-03T18:18:53+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - one PDF module both LODGY-37 and LODGY-45 will consume. Going with the platform PdfDocument rather than a library: Android already shapes and embeds Devanagari through its system typeface, so a library buys nothing here. Splitting the pure layout maths (wrapping, pagination, repeated table headers) out from the Canvas calls so the part that can actually get pagination wrong is JVM-testable."}, {"timestamp": "2026-09-03T18:21:09+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built the shared PDF module under com.lodgy.app.pdf, deliberately split so the risky part is testable. PdfContent.kt is the content model (Title/Heading/Paragraph/KeyValue/Table/Spacer + PdfDocumentContent) with no drawing concepts in it. PdfLayout.kt holds A4-at-72pt geometry plus two pure functions: wrapText(), which greedy-wraps against a caller-supplied measurer (so a word wider than the column lands on its own line instead of being dropped or looping), and paginate(), which splits measured lines into pages and re-emits a table's header row at the top of every page that table continues onto. PdfBlockLayout.kt turns blocks into wrapped, measured PdfLines through a TextMeasurer fun-interface - Paint on a device, a fixed-width stub in tests. LodgyPdfRenderer.kt is the only file that touches Canvas: it paginates, then draws each page with a running header, a rule, and an 'n / N' footer. Chose the platform android.graphics.pdf.PdfDocument over a PDF library on purpose - Android's system typeface already shapes Devanagari and PdfDocument embeds what it draws, so Hindi content per LODGY-30 renders correctly without shipping and subsetting a font, and LODGY-48 being Won't Do removed the only argument for the alternative. PdfLayoutTest covers wrapping (including the over-long word and empty input), single-page and multi-page splits, repeated table headers across a break, a line taller than a page not looping, empty content still yielding a page, and block-to-line conversion. LODGY-37 and LODGY-45 both build on this. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all three. AC1: pdf/ is a genuinely content-agnostic module (LodgyPdfRenderer, PdfLayout, PdfBlockLayout, PdfContent) with page setup and text/table helpers and no knowledge of any specific document. Devanagari is handled correctly - I switched the app to Hindi and exported the records packet: the output embeds shaped Devanagari as Type3 glyph procedures (10 embedded fonts vs 3 for the English export, 88KB vs 53KB) and round-trips real Devanagari codepoints through its ToUnicode map, so Hindi renders as text rather than tofu. AC2: pagination is covered by PdfLayoutTest - content that fits stays on one page, overflowing content breaks onto further pages, a table's header row repeats on every continuation page, a line taller than a page is placed instead of looping forever, and empty content still yields one page; the real exports carry correct 'n / n' footers and valid page trees. AC3: both consumers call the shared renderer - AcknowledgementScreen.kt:106 (LODGY-37) and DataPacketScreen.kt:128 (LODGY-45) each do LodgyPdfRenderer().render(content, it). No second pipeline. Minor observation for the PO, not a fail: because Android emits Type3 fonts, copy-pasting Hindi text OUT of the PDF gives slightly mangled matras - visual rendering is correct, so this only matters if someone needs to machine-read the Hindi output."}]}, {"id": "LODGY-57", "epic": "Usability", "title": "Confirmation dialogs on all delete and high-impact update actions", "description": "Real bug hit directly by the Product Owner: deleting a room produced no confirmation at all and it was gone immediately. Root cause found in code - RoomListViewModel.requestDelete() only shows an AlertDialog when the room has an OCCUPIED bed (a hard block, not a confirmation prompt); for an ordinary vacant room it calls roomRepository.delete() immediately with no prompt whatsoever. FloorListViewModel.delete() is worse - a bare one-liner with no confirmation and no occupied-bed check at all, despite deleting a floor cascading to every room/bed under it. By contrast, NoteFormScreen already does this correctly (showDeleteConfirm state + AlertDialog + explicit Delete/Cancel) - that's the pattern to replicate everywhere. Scope: every delete action needs a plain 'Are you sure?' confirmation; a handful of especially high-impact, hard-to-reverse updates (tenant checkout - already has one, room-type change on a room with an occupied bed, manually overriding a calculated invoice amount) should get one too. Routine field edits (name, address, phone, price) do not need a confirmation dialog - Save is the confirmation there, and adding one would just be friction with no safety benefit.", "acceptanceCriteria": ["Deleting a Room shows a plain confirmation dialog for the ordinary (no occupied bed) case, in addition to the existing occupied-bed hard block", "Deleting a Floor shows a confirmation dialog, and the dialog states plainly that every room/bed under it goes too", "Deleting a Note continues to use its existing (already-correct) confirmation pattern - used as the template for the other two", "Changing a Room's type while it has an occupied bed shows a confirmation before applying", "Routine non-destructive edits (renaming a hostel, editing a phone number, etc.) are explicitly NOT changed - no new confirmation added where there's nothing destructive happening"], "status": "Done", "priority": "High", "assigneeRole": "Developer", "createdAt": "2026-09-03T21:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added following backlog review: splitting LODGY-39, giving LODGY-37/45 a shared PDF prerequisite, and folding in the latest round of direct feedback (a real delete-without-confirmation bug hit on Rooms, a default-language reversal, and new notification/navigation-polish requests)."}, {"timestamp": "2026-09-03T16:24:32+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - reproduced the bug: RoomListViewModel.requestDelete() calls roomRepository.delete() immediately for a vacant room, no prompt. Adding a confirmation step there plus a type-change confirmation in RoomFormViewModel; auditing Floor/Note delete paths against the NoteFormScreen pattern."}, {"timestamp": "2026-09-03T16:29:22+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Fixed. (1) Room delete: RoomListViewModel.requestDelete() no longer deletes - it sets pendingDeleteRoom; new confirmDelete()/dismissPendingDelete(). RoomListScreen shows a Delete/Cancel AlertDialog; the occupied-bed hard block is unchanged and still takes precedence. (2) Room type change: RoomFormViewModel.save() now checks type-changed + hasOccupiedBed and raises showTypeChangeConfirm instead of persisting; confirmTypeChange()/dismissTypeChangeConfirm() added, save path refactored into a private persist(). Dialog in RoomFormScreen. (3) Floor delete: AUDITED, NO CODE CHANGE NEEDED - FloorListScreen already has the pendingDelete AlertDialog and floor_delete_body already states 'and any rooms/beds under it will be removed'. The ticket description called FloorListViewModel.delete() unguarded, which is true at the VM level but the screen gates it. (4) Note delete: untouched, used as the pattern. (5) No confirmations added to routine edits. New strings in values/ and values-hi/. Tests: 7 new/updated ViewModel tests (RoomListViewModelTest, RoomFormViewModelTest); full testDebugUnitTest suite + assembleDebug green. FLAG FOR PO: deleting a floor still cascades to rooms/beds with NO occupied-bed check, unlike room delete which hard-blocks. Out of this ticket's ACs so I did not add it - worth its own ticket if wardens can lose an active tenancy that way."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all five, each exercised on the emulator. AC1: the originally reported bug is fixed - deleting an ordinary vacant room (Room 103) now shows 'Delete this room? Room 103 and its beds will be removed. This can't be undone.' with Cancel/Delete, and the occupied-bed hard block still takes precedence. AC2: deleting a floor shows 'Delete this floor? First and any rooms/beds under it will be removed.' - it states the cascade plainly. AC3: note deletion still uses its existing pattern ('Delete this note? This can't be undone.'), unchanged. AC4: changing Room 102's type from DOUBLE to SINGLE while it had an occupied bed raised 'Change room type? This room has a bed with an active tenant. Changing its type will leave the bed count out of step with the new type. Continue?' before applying. AC5: confirmed nothing was over-applied - editing only the price on that same occupied room (5000 -> 5500) saved immediately with no dialog at all."}]}, {"id": "LODGY-58", "epic": "Localization", "title": "Change default first-launch language to English", "description": "Product decision reversal: LODGY-30 was built with Hindi as the first-launch default per an earlier explicit requirement ('primary users are Hindi-based'). Product Owner has since reversed that - default should be English on first launch. The switcher itself (LODGY-30, More -> App language) is unaffected; only AppLocale.applyDefaultIfUnset()'s default value changes.", "acceptanceCriteria": ["Fresh install with no locale preference set defaults to English, not Hindi", "Existing installs that already have an explicit choice stored (Hindi or English) are unaffected - this only changes the unset-default case", "Hindi remains fully available and switchable at any time via the existing More -> App language picker"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T21:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added following backlog review: splitting LODGY-39, giving LODGY-37/45 a shared PDF prerequisite, and folding in the latest round of direct feedback (a real delete-without-confirmation bug hit on Rooms, a default-language reversal, and new notification/navigation-polish requests)."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "comment", "note": "Rationale confirmed, not just tester convenience: in practice the phone is often set up by someone other than the warden (a son, a shop tech doing the install) who is more comfortable in English than the warden ultimately using the app day-to-day. English-by-default plus an easy, prominent switch to Hindi (LODGY-30) serves both people better than defaulting to the warden's own language and hoping the installer notices the switcher exists."}, {"timestamp": "2026-09-03T17:25:28+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - single-value change in AppLocale.applyDefaultIfUnset(), plus the matching current() fallback so an unset locale reads back as the same language it would be applied as."}, {"timestamp": "2026-09-03T17:31:03+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "AppLocale.applyDefaultIfUnset() now applies ENGLISH, and current()'s unset fallback matches it so a fresh install reads back the same language it was given. The isEmpty guard is unchanged, so any install that already stored a choice - including Hindi picked under the old default - is untouched; the More -> App language picker still offers both. AppLocaleTest updated for the new default. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all three. AC1: wiped app data for a genuine first launch and the PIN setup came up in English ('Create a PIN', 'Set up your PIN'), so an unset locale now defaults to English. AC2: an explicit choice is untouched - selected Hindi, force-stopped and relaunched, and the lock screen still read the Hindi 'Enter your PIN'; only the unset-default case changed. AC3: Hindi remains fully available and switchable at any time via More > App language - switched to Hindi and the entire UI including the bottom nav and generated PDF content localised, then switched back to English cleanly."}]}, {"id": "LODGY-59", "epic": "Notifications", "title": "Notify warden to advertise long-vacant rooms", "description": "Wardens want a nudge to go put up a To-Let board or post an ad when a room/bed has been sitting vacant for a while, rather than only noticing when they happen to check the Vacant view (LODGY-21). Local notification only - no backend, matching this app's offline-first architecture and the existing WorkManager periodic-check pattern already established by LODGY-15's invoice generation worker.", "acceptanceCriteria": ["A periodic background check (WorkManager, daily) flags beds that have been VACANT longer than a threshold the warden sets themselves", "A setting (More tab) lets the warden set/change that vacancy-threshold number of days, defaulting to 7 - this is not a hardcoded constant", "Warden receives a local notification naming the hostel/room/bed(s) that have been vacant past the threshold", "Notification does not repeat daily for the same still-vacant bed (once per bed until it's occupied again, or a sensible re-notify cadence, not a daily nag)", "Runtime POST_NOTIFICATIONS permission (Android 13+) is requested appropriately and the feature degrades gracefully if denied"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T21:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added following backlog review: splitting LODGY-39, giving LODGY-37/45 a shared PDF prerequisite, and folding in the latest round of direct feedback (a real delete-without-confirmation bug hit on Rooms, a default-language reversal, and new notification/navigation-polish requests)."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Resolved: the vacancy threshold is warden-configurable via a setting, not a hardcoded constant."}, {"timestamp": "2026-09-03T19:06:29+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - shared notification plumbing (channels, permission, a tap target that survives the PIN gate) plus the daily vacancy check with a warden-set threshold and a notified-set so a still-vacant bed is not a daily nag. LODGY-60 will build on the same plumbing."}, {"timestamp": "2026-09-03T19:17:05+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built the shared notification plumbing and the vacancy check on top of it. notify/LodgyNotifications.kt owns the two channels, the permission check and the tap target, so every send goes through one place; every post is best-effort and wrapped, because a denied permission must leave a working app (AC 5) - the POST_NOTIFICATIONS request is made on Android 13+ at startup and a denial is simply accepted, with the settings screen saying plainly that Android is blocking them. VacancyCheckWorker runs daily via WorkManager, matching LODGY-15's existing periodic pattern. The threshold is data, not a constant: NotificationPreferences.vacancyThresholdDays defaults to 7, is clamped to 1-90, and is set from More -> Notifications. Long-vacant beds come from BedDao.getLongVacantBeds, which reads beds.updatedAt - for a VACANT bed that is when it was freed, the closest thing the schema has to 'vacant since', and the join names hostel, room and bed so the notification says which bed rather than just a count. AC 4 lives in notify/VacancyNudge.kt as a pure function: a bed is nudged once and then remembered, and the remembered set is pruned to beds that are STILL vacant - so a month-long vacancy produces one notification rather than thirty, while a bed that fills and later empties again is treated as new, which is exactly when the warden wants to hear about it. Tapping opens the Vacant beds view; because the app is PIN-gated the route travels as an intent extra and is replayed by LodgyNavHost after unlock rather than navigated to immediately, and the route constants are shared with the NavHost so a rename cannot silently break the tap. Tests: VacancyNudgeTest for first nudge, no repeat, forget-on-fill and re-nudge, and the empty case; NotificationSettingsViewModelTest for the threshold options and the blocked-permission state. assembleDebug and testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all five, with one honest caveat on how AC3/AC4 were verified. AC1: VacancyCheckWorker is scheduled and enqueued as periodic work (confirmed via WorkManager diagnostics: unique name 'vacancy-check', state ENQUEUED) and selects beds with getLongVacantBeds(cutoff) where cutoff = now - thresholdDays. AC2: More > Notifications lets the warden pick 3 / 7 / 14 / 30 days and defaults to 7 - the worker reads notificationPreferences.vacancyThresholdDays rather than a constant, and VacancyCheckWorkerTest asserts \"the warden's threshold decides the cutoff, not a constant\". AC3: the notification text is built from hostelName, roomNumber and bedLabel, and the worker's query joins beds->rooms->floors->hostels to supply them. AC4: no daily nag - already-notified bed ids are persisted and skipped, and are forgotten once a bed fills again ('a bed already nudged about is not nudged again', 'a bed that has since been filled is forgotten even though nothing is posted'). AC5: verified live - the POST_NOTIFICATIONS prompt appeared on first launch, and after revoking the permission and relaunching, the app started, unlocked and rendered the dashboard normally with no crash or SecurityException. CAVEAT: I could not observe an actual vacancy notification land. I backdated two beds to 30 days vacant, but WorkManager refuses to run periodic work ahead of schedule ('Delaying execution ... because it is being executed before schedule') and this emulator image is a production build with no root, so the clock cannot be advanced. AC3/AC4 therefore rest on worker unit tests plus code inspection rather than an observed notification - worth one manual confirmation on a real device before this ships."}]}, {"id": "LODGY-60", "epic": "Notifications", "title": "Local notifications for payment dues, reminders, and monthly expenses", "description": "Wardens want to be notified about payment due dates, overdue invoices, and recurring monthly expenses (WiFi, water, etc. from LODGY-26/27) coming due - so this doesn't rely on the warden remembering to open the app and check the Dashboard/Invoices. Local notification only, same WorkManager-based approach as LODGY-59 and LODGY-15. Resolved: no pattern-inference across historical expense entries needed - Expense already has a user-facing isRecurring flag (ExpenseFormScreen's Switch, wired to Expense.isRecurring) which is enough to know which expenses repeat monthly; use that tag directly.", "acceptanceCriteria": ["Warden is notified when an invoice becomes overdue (past due date, still Unpaid/Partial)", "For each Expense marked isRecurring, warden is notified a few days ahead of roughly the same day-of-month it was last logged (incurredOn's day component) - a direct read of the existing flag, not an inferred pattern across multiple entries", "Notifications are actionable - tapping one opens the relevant invoice or expense, not just the app's home screen", "Warden can turn this category of notification off from the More tab without turning off the vacant-room notifications from LODGY-59"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T21:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added following backlog review: splitting LODGY-39, giving LODGY-37/45 a shared PDF prerequisite, and folding in the latest round of direct feedback (a real delete-without-confirmation bug hit on Rooms, a default-language reversal, and new notification/navigation-polish requests)."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Simplified: use the existing Expense.isRecurring tag directly instead of inferring a due-date pattern from historical entries - much smaller scope than originally written."}, {"timestamp": "2026-09-03T19:17:05+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Building on LODGY-59's plumbing - same channels, same permission handling, same tap-target mechanism."}, {"timestamp": "2026-09-03T19:17:05+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "DuesReminderWorker runs daily alongside the vacancy check and covers both halves of the ticket. Overdue invoices: anything not PAID whose dueDate is before the start of today, with the outstanding figure computed through the same effectiveAmountDue() as the rest of the app - an invoice already settled by a credit or a payment whose status row has not caught up is skipped rather than nagged about. Recurring expenses: notify/DuesNudge.kt reads the day component of the last-logged incurredOn on any expense with isRecurring set - a direct read of the existing flag with no pattern inference across entries, as the ticket resolved - and fires within three days ahead of that day, never after it has passed; a 31st expense is clamped to the last day of a shorter month rather than being skipped in February. Both are actionable per AC 3: an invoice notification opens that invoice's Record payment screen and an expense notification opens that expense's form, carried as an intent extra and replayed after the PIN gate. AC 4 is a separate switch: NotificationPreferences.duesEnabled is independent of vacancyEnabled, each worker reads only its own, so turning this category off in More -> Notifications leaves LODGY-59's vacancy nudges running. Needed ExpenseCategory.labelRes split out of the composable label() so the worker resolves the same translated string through a plain Context instead of duplicating the mapping, and ExpenseRepository.getAll() since the check is not scoped to the selected hostel. Tests: DuesNudgeTest for the lead window, the already-passed case, the month-end clamp and startOfDay; NotificationSettingsViewModelTest for the independent switches. assembleDebug and testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all four, AC3 confirmed live. AC1: DuesReminderWorker notifies on invoices past their due date that are still Unpaid/Partial, and correctly leaves alone ones not yet due, already paid, or already covered once payments AND credits are counted (so a credited invoice is not nagged about). AC2: recurring expenses are driven by a direct read of the isRecurring flag against incurredOn's day-of-month, notified a few days ahead - 'a one-off expense is never notified, however recently it was logged' confirms there is no pattern inference across entries. AC3: verified end to end on the emulator - launched with the notification route extra and, after the PIN gate, the app replayed the route and landed on the Vacant Beds screen rather than the home screen; the route is deliberately deferred until past the lock, and DuesReminderWorkerTest asserts the invoice and expense taps carry routeToRecordPayment(invoiceId) and routeToExpense(expenseId). AC4: More > Notifications has a 'Payments and expenses' switch independent of the 'Long-vacant rooms' one, and turning it off skips both dues and expense checks without touching vacancy. Same caveat as LODGY-59: periodic work could not be forced to run on this emulator (no root to advance the clock), so AC1/AC2 rest on unit tests plus code inspection rather than an observed notification."}]}, {"id": "LODGY-61", "epic": "Appearance", "title": "Smooth slide transitions for screen navigation", "description": "LodgyNavHost's composable() destinations currently specify no enter/exit/popEnter/popExit transitions, so every navigation - especially back navigation - is an abrupt cut rather than feeling like moving through a stack of screens. Add consistent slide transitions (forward: slide in from the right / out to the left; back: reverse) across the app's single NavHost.", "acceptanceCriteria": ["Navigating forward (e.g. tenant list -> tenant profile) slides the new screen in from the right", "Navigating back slides the previous screen back in from the left, reversing the forward animation - not an instant cut", "Transition is applied consistently across the whole NavHost, not just a few hand-picked screens", "Bottom-nav tab switches (Home/Property/Tenants/Payments/More) keep their own distinct feel and are not forced through the same slide (a tab switch is not a stack push)"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T21:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added following backlog review: splitting LODGY-39, giving LODGY-37/45 a shared PDF prerequisite, and folding in the latest round of direct feedback (a real delete-without-confirmation bug hit on Rooms, a default-language reversal, and new notification/navigation-polish requests)."}, {"timestamp": "2026-09-03T17:37:33+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - setting the slide as NavHost-level defaults so every destination inherits it, then overriding the five bottom-nav destinations with a fade, since a tab switch is a lateral move rather than a push onto the stack."}, {"timestamp": "2026-09-03T17:37:58+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Added ui/nav/NavTransitions.kt holding pushEnter/pushExit/popEnter/popExit (280ms horizontal slide; the outgoing screen only travels a quarter width so it reads as sitting underneath the incoming one rather than being shoved off at the same speed) and tabEnter/tabExit (150ms cross-fade). The slides are set on the NavHost itself, so every destination inherits them and nothing gets hand-picked; the five bottom-nav destinations then override with the fade, because a tab switch is a lateral move between siblings rather than a push onto the stack. compileDebugKotlin green - this is animation behaviour with no JVM-testable surface, so it needs an on-device look."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all four. AC1: pushEnter is slideInHorizontally { width -> width }, so a forward navigation slides in from the right. AC2: popEnter slides the previous screen back in from the left (-width/4) while popExit slides the current one out to the right - a proper reverse of the forward move, not an instant cut; the quarter-width underlap makes the outgoing screen read as sitting underneath rather than being shoved off at the same speed. AC3: applied NavHost-wide - the four transitions are set once on the NavHost itself (LodgyNavHost.kt:136-139) so every destination inherits them; there are exactly two enterTransition sites in the whole file, the NavHost default and the tab override, so no screen is hand-picked or missed. AC4: the five bottom-nav destinations override with fadeIn/fadeOut (tabEnter/tabExit), so a tab switch cross-fades and keeps its own feel instead of being pushed through the stack slide. Transitions were visible throughout the session's navigation."}]}, {"id": "LODGY-62", "epic": "Appearance", "title": "Replace text status labels with icons where possible", "description": "For quick at-a-glance scanning (and to shrink the amount of text that needs translating/fitting in both Hindi and English per LODGY-30), replace text-only indicators with icon-first representations wherever a clear, unambiguous icon exists - bed vacant/occupied state, invoice status, tenant status. Pairs directly with LODGY-36's RAG color system: icon + color together, never color alone (already the app's convention per LODGY-31/57-style safety patterns), so this isn't about removing text for accessibility's sake, just making text secondary to a symbol that reads the same in either language.", "acceptanceCriteria": ["Bed vacant/occupied indicators (BedGridScreen, VacantViewScreen) lead with an icon, with the RAG color from LODGY-36, text label present but secondary (e.g. smaller, or icon-with-tooltip) rather than the primary way status is conveyed", "Invoice and tenant status badges (Unpaid/Partial/Paid, Active/Vacated) get a consistent icon per state, not just a colored chip with text", "No status is ever conveyed by icon or color alone without a text label still available somewhere (for accessibility/screen readers and for anyone unfamiliar with the icon set) - this reduces reliance on translated text, it doesn't remove the translation entirely", "Icon set is consistent with the app's existing stroke-icon style (ui/icons/CommonIcons.kt)"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T22:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added alongside the LODGY-36 color-coding rework: pairing icons with the new RAG colors so status reads at a glance and doesn't lean entirely on translated text."}, {"timestamp": "2026-09-03T17:31:21+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - adding a per-state stroke icon in ui/icons/StatusIcons.kt and threading it through the StatusBadge LODGY-36 just introduced, so icon and RAG colour arrive together at every call site and the text label stays present rather than being replaced."}, {"timestamp": "2026-09-03T17:33:30+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Added ui/icons/StatusIcons.kt (BedVacant/BedOccupied/Check/Half/Alert/Exit, all built with the existing strokeIcon helper so they match the app's stroke set) and a matching .icon extension next to LODGY-36's .level, so a state's colour and symbol are decided in the same place. StatusBadge now takes the icon, draws it ahead of the text, and passes the label as the icon's contentDescription - the text is never removed, so screen readers and anyone unfamiliar with the symbol still get it, and no status is icon- or colour-only. Converted: invoice status chips, tenant status badges (directory + profile), VacantViewScreen rows, and BedGridScreen tiles where the label is demoted to labelSmall beside a leading icon. StatusLevelTest extended to assert each state has a distinct icon. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all four. AC1: bed status leads with an icon on both BedGridScreen and VacantViewScreen - distinct occupied-bed and empty-bed glyphs carrying the LODGY-36 RAG colour, with the VACANT/OCCUPIED text present but secondary (smaller, and after the icon). AC2: consistent icon per state everywhere - invoices use Alert / Half / Check for Unpaid / Partial / Paid, tenants use Check for ACTIVE and Exit for VACATED, all mapped once in ui/common/StatusTokens.kt rather than per screen. AC3: nothing is icon- or colour-only - every badge still renders its text label, and the icons carry contentDescription (they surfaced as [VACANT]/[OCCUPIED]/[Paid]/[ACTIVE] in the accessibility tree), so screen readers and anyone unfamiliar with the icon set are covered. AC4: style is consistent - StatusIcons and CommonIcons are both built with the same shared strokeIcon() helper (24dp, stroke-only, no fill), so the new status glyphs match the existing set exactly."}]}, {"id": "LODGY-63", "epic": "Property Setup", "title": "Deleting a floor or room that still has a tenant crashes the app", "description": "Found while auditing delete coverage. Deleting a floor whose bed still has an ACTIVE tenancy hard-crashes the app to the launcher - it does not fail gracefully, show an error, or block the action. REPRO: hostel Moonlight > floor Ground > Room 501 > Bed A occupied by a tenant with one invoice. Property > Moonlight > delete Ground > Delete. The confirmation reads 'Ground and any rooms/beds under it will be removed' with no mention that someone lives there; on confirming, the process dies. LOG: android.database.sqlite.SQLiteConstraintException: FOREIGN KEY constraint failed (code 787 SQLITE_CONSTRAINT_FOREIGNKEY), thrown from FloorDao_Impl.delete. ROOT CAUSE: the cascade chain is only half wired. Hostel -CASCADE-> Floor -CASCADE-> Room -CASCADE-> Bed, but Bed <- TenancyAgreement is NO ACTION, as are TenancyAgreement <- Invoice and Invoice <- Payment. So deleting a floor tries to cascade beds out from under agreements that still reference them, and SQLite refuses. RoomListViewModel already hard-blocks deleting a room with an OCCUPIED bed, which is why the room path does not crash - FloorListViewModel has no equivalent check. The developer flagged exactly this on LODGY-57 ('deleting a floor still cascades to rooms/beds with NO occupied-bed check, unlike room delete which hard-blocks - worth its own ticket'); this ticket is that ticket, now with a confirmed crash behind it. NOTE: this is not only a floor problem. Any future delete that removes beds out from under an agreement will hit the same constraint, which is why LODGY-64 should not add a hostel delete button until this is settled.", "acceptanceCriteria": ["Deleting a floor that contains an occupied bed no longer crashes - it is blocked with a clear explanation naming the tenant(s) in the way, matching how room delete already hard-blocks", "The block names what is in the way rather than failing generically, so the warden knows to check the tenant out first", "A floor with no occupied beds still deletes normally, with its existing confirmation", "The same guard is applied anywhere else a delete can remove a bed that an agreement still references, so the fix is not floor-only", "A test covers the occupied-bed case at the ViewModel or DAO level, so the crash cannot regress silently"], "status": "Todo", "priority": "High", "assigneeRole": "Developer", "createdAt": "2026-09-04T12:05:59+00:00", "updatedAt": "2026-09-04T12:05:59+00:00", "history": [{"timestamp": "2026-09-04T12:05:59+00:00", "actor": "Tester", "action": "created", "note": "Filed by the Tester after reproducing a hard crash on the emulator: deleting a floor with an occupied bed dies with SQLITE_CONSTRAINT_FOREIGNKEY. Stack trace and repro in the description. This is the ticket the developer asked for when handing off LODGY-57."}]}, {"id": "LODGY-64", "epic": "Property Setup", "title": "Delete is missing on Hostel, Tenant, Expense, Invoice, Payment and Credit", "description": "Audit of every entity against whether the UI lets a warden delete it. Every DAO already has a delete method, so this is purely a missing-UI gap - the data layer is ready. HAS DELETE TODAY (3): Floor (list row), Room (list row), TenantNote (note form). NO DELETE TODAY (6): Hostel - HostelFormScreen has Save only, which is how this was found: a hostel created by mistake cannot be removed at all. Tenant - TenantFormScreen has no delete; checkout closes a tenancy but a tenant added in error stays forever. Expense - ExpenseFormScreen has no delete, so a wrong amount can be edited but a duplicate row cannot be removed. Invoice - no delete; a manually backfilled invoice entered for the wrong month or tenant is stuck. Payment - no delete; a payment recorded against the wrong invoice cannot be undone, which also silently leaves the invoice status wrong. Credit - no delete. DELIBERATELY NOT DELETABLE, no change wanted: Bed (generated from the room's type, managed by editing the room), TenancyAgreement (closed by checkout, never deleted, or history breaks), Warden (the local profile itself), ReconciliationMark (already reversible via its own toggle). SEQUENCING: hostel delete must not ship before LODGY-63. A hostel cascades to floors, rooms and beds but NOT to the agreements/invoices/payments hanging off those beds, so a naive hostel delete on a populated property will hit the same FOREIGN KEY crash - on far more data. OPEN QUESTION for the PO, tied to LODGY-66: whether these deletes are hard or soft changes what 'delete' means here, so decide LODGY-66 first if you want soft delete.", "acceptanceCriteria": ["Hostel has a delete action, blocked with a clear explanation while it still holds any floor, room, tenancy or financial record - a hostel is only deletable once empty", "Tenant, Expense, Invoice, Payment and Credit each have a delete action reachable from the screen where that record is viewed or edited", "Deleting a Payment recalculates its invoice's status, so removing money never leaves an invoice reading PAID with nothing behind it", "Deleting an Invoice is blocked while payments or credits are attached to it, rather than orphaning them", "Bed, TenancyAgreement, Warden and ReconciliationMark are explicitly left without a delete action, and the ticket records why", "Every new delete follows the confirmation pattern from LODGY-57 and, where relevant, the hard-block pattern from LODGY-63"], "status": "Todo", "priority": "Medium", "assigneeRole": "Developer", "createdAt": "2026-09-04T12:05:59+00:00", "updatedAt": "2026-09-04T12:05:59+00:00", "history": [{"timestamp": "2026-09-04T12:05:59+00:00", "actor": "Tester", "action": "created", "note": "Filed after auditing all 13 entities for delete coverage. Found because a hostel created by mistake could not be removed at all. Blocked on LODGY-63 for the hostel case."}]}, {"id": "LODGY-65", "epic": "Usability", "title": "Decide which updates need confirmation, not just deletes", "description": "Raised directly by the Product Owner: 'all delete and update should ask for confirmation - especially hostel as it has a lot of data'. THIS CONTRADICTS A DECISION ALREADY TAKEN AND DELIVERED, so it needs an explicit call rather than quiet implementation. LODGY-57 AC5 reads: 'Routine non-destructive edits (renaming a hostel, editing a phone number, etc.) are explicitly NOT changed - no new confirmation added where there is nothing destructive happening.' That was built, tested and accepted. Confirming every update would reverse it. WHAT IS ALREADY CONFIRMED: deleting a room, floor or note; changing a room's type while it has an occupied bed; checkout. THE TESTER'S READ, offered as a recommendation not a decision: the risk the PO is pointing at is real but it is about DELETING a hostel, not about EDITING one. Renaming 'Sunrise PG' to 'Sunrise PG Annexe' destroys nothing and is trivially reversible by typing the old name back; a hostel delete is the catastrophic action, and that is covered by LODGY-64's hard-block. Confirming every field edit trains wardens to dismiss dialogs without reading them, which makes the dialogs that DO matter less effective. Suggested line: confirm an update only when it silently changes money, occupancy or history that the warden cannot see on the screen they are on. CANDIDATES that meet that bar and are NOT confirmed today: editing a room's price per bed (changes what future invoices are generated at, for every bed in the room); editing a tenant's agreed rent; editing an invoice's amount after payments exist against it; changing a hostel's name while reconciliation marks and exported PDFs already carry the old one. Decide the line, then implement to it - the ACs below assume a decision is recorded first.", "acceptanceCriteria": ["Product Owner records an explicit decision on whether LODGY-57 AC5 stands or is reversed, so the two tickets do not contradict each other in the board's history", "If AC5 stands: the money/occupancy/history-affecting updates listed in the description get confirmations, and routine field edits still do not", "If AC5 is reversed: every update gets a confirmation, LODGY-57's note is annotated to say it was superseded and by what, so a future reader is not misled", "Whichever way it goes, the rule is written down somewhere a developer will find it - DESIGN.md, next to the UI invariants in 4.12"], "status": "Todo", "priority": "Medium", "assigneeRole": "Developer", "createdAt": "2026-09-04T12:05:59+00:00", "updatedAt": "2026-09-04T12:05:59+00:00", "history": [{"timestamp": "2026-09-04T12:05:59+00:00", "actor": "Tester", "action": "created", "note": "Filed at the Product Owner's request to confirm updates as well as deletes. Flagged rather than implemented because it directly contradicts LODGY-57 AC5, which was built and accepted - needs an explicit PO call."}]}, {"id": "LODGY-66", "epic": "Backup & Restore", "title": "Decide: soft delete with an undo bin, or keep hard delete", "description": "Product Owner asked whether deletes should be soft - a deleted flag in the DB, with a screen under More to undo any delete. This ticket is the decision, not the implementation. THE CASE FOR: the warden is one non-technical person on one phone, the backup is manual and may be weeks stale, and a mis-tap on a hostel or floor can take years of records with no way back. That is a genuinely bad failure and the current answer to it - 'restore your zip' - assumes a zip exists. THE CASE AGAINST, and why the tester recommends NOT doing it globally: (1) Every read has to filter. There are 15 DAOs and many queries, including joins and aggregates behind occupancy counts, the dashboard, the monthly report and the PDF exports. One missed WHERE clause and deleted data silently reappears in a total - a bug class that is easy to introduce and hard to notice. (2) Cascades get much harder. Deleting a hostel would have to flag floors, rooms and beds too, and undo would have to restore exactly what that action removed and nothing else - meaning delete operations need their own grouping record. That is a real feature, not a flag. (3) Uniqueness breaks: a soft-deleted Room 101 still occupies its number, so recreating it either collides or quietly duplicates. (4) Knock-on effects elsewhere - the orphan photo cleaner (LODGY-51) would delete a soft-deleted tenant's photos, so undo would restore a tenant whose pictures are gone, and every backup would carry deleted rows forever. (5) It contradicts DESIGN.md 4.6, which chose hard delete for notes deliberately. RECOMMENDED ALTERNATIVE, cheaper and it addresses the actual fear: (a) Prevent instead of undo - LODGY-63 and LODGY-64 already block deleting anything that still holds tenants or money, which removes the catastrophic cases outright; what stays deletable is small and re-creatable. (b) Never delete money - an invoice or payment entered wrongly should be voided or reversed, leaving a visible corrected record, which is both standard bookkeeping and sidesteps undo entirely. (c) Auto-export before any cascading delete - write a timestamped backup zip automatically before a hostel or floor delete and tell the warden where it went. That gives real recoverability for the one case that matters, costs no query filtering, and reuses LODGY-28's export wholesale. (d) If an undo affordance is still wanted after that, scope it to a short in-session undo on the snackbar rather than a permanent bin. If the PO still wants a full recycle bin, that is a legitimate call - but it should be sized as an epic across every DAO and export path, not a flag added to a few tables.", "acceptanceCriteria": ["Product decision recorded: (a) keep hard delete plus the prevention/void/auto-export measures above, or (b) implement soft delete with an undo screen under More", "If (a): the auto-export-before-cascading-delete behaviour is specified as its own ticket, and DESIGN.md records why soft delete was declined so it is not re-litigated", "If (b): scope is written up honestly across all 15 DAOs, the cascade-grouping needed for a correct undo, the uniqueness question, and the effect on LODGY-51's photo cleanup and LODGY-28's backup size", "Either way DESIGN.md gains a short statement of what 'delete' means in Lodgy, so future tickets inherit the answer rather than re-asking it"], "status": "Todo", "priority": "Medium", "assigneeRole": "Developer", "createdAt": "2026-09-04T12:05:59+00:00", "updatedAt": "2026-09-04T12:05:59+00:00", "history": [{"timestamp": "2026-09-04T12:05:59+00:00", "actor": "Tester", "action": "created", "note": "Filed at the Product Owner's request to evaluate soft delete with an undo bin. Written as a decision ticket with a recommendation against doing it globally, and a cheaper alternative that addresses the same fear."}]}, {"id": "LODGY-67", "epic": "Property Setup", "priority": "Medium", "title": "All rooms as RAG-coloured tiles instead of a list", "description": "Product Owner request: the All rooms view should drop the one-per-row list in favour of tiles, colour-coded by how full each room is, so a whole property reads at a glance rather than by scrolling. Colours follow the existing RAG token set (LODGY-36) rather than inventing a new language: green for a room with every bed free, amber for a partly filled room, red for a room with no beds left. NOTE ON THE REQUEST WORDING: the ask read 'empty rooms should look green, partially filled as amber, and vacant as red'. Empty and vacant are the same thing, so that cannot be literal. Built to the only self-consistent reading, which is also the one that matches the app's existing bed-level convention where vacant is green and occupied is red: green = wholly empty, amber = partly filled, red = full. Flagged here so the PO can correct it if the intent was different. No schema change: AllRoomsViewModel already exposes totalBeds and occupiedBeds per room, so this is presentation only and needs no migration.", "acceptanceCriteria": ["All rooms renders as a grid of tiles rather than a vertical list, sized so a whole floor is visible without scrolling on a normal phone", "Tile colour follows occupancy: every bed free = green, some beds free = amber, no beds free = red, drawn from the LODGY-36 status tokens rather than new colours", "Colour is never the only cue - each tile also carries an icon and readable text (room number, free/total beds, and a status word), per LODGY-62", "A summary line shows how many rooms are empty, partly filled and full, so the screen answers 'where is there space' without reading every tile", "Tapping a tile still opens that room's bed grid, exactly as the list rows did", "Correct in dark mode, and legible in Hindi where the status words are longer", "A room with no beds yet is handled sensibly rather than dividing by zero or reading as full"], "status": "Done", "assigneeRole": "Developer", "createdAt": "2026-09-04T12:12:41+00:00", "updatedAt": "2026-09-04T12:35:58+00:00", "history": [{"timestamp": "2026-09-04T12:12:41+00:00", "actor": "Product Owner", "action": "created", "note": "Requested by the PO: tiles instead of a list on All rooms, RAG-coloured by occupancy, for overall visibility. Wording ambiguity between 'empty' and 'vacant' recorded in the description."}, {"timestamp": "2026-09-04T12:12:41+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting. Presentation-only change - the ViewModel already carries totalBeds/occupiedBeds, so no schema change and no migration needed."}, {"timestamp": "2026-09-04T12:25:56+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built. AllRoomsScreen is now a LazyVerticalGrid of tiles (GridCells.Adaptive minSize 108dp, so a small phone gets three per row and a larger one more) instead of a LazyColumn of rows. Tile colour, icon and text all come from a new RoomFill enum in ui/common/StatusTokens.kt - EMPTY/PARTIAL/FULL mapping onto the existing StatusLevel GOOD/WARN/BAD, so this consumes the LODGY-36 tokens rather than defining colours. Named RoomFill, not RoomOccupancy, because data.dao already exports a RoomOccupancy projection and the two would have collided. Each tile carries room number, floor, 'N of M free' and a status word plus an icon, so colour is never the only cue (LODGY-62). Added a summary row above the grid - 'N Empty / N Part full / N Full' - for the overall-visibility part of the ask. New strings in values/ and values-hi/. BACKWARD COMPATIBILITY: presentation only. No entity, DAO or query changed, DB stays at version 4, no migration needed, and an existing install upgrades with its data untouched. VERIFIED ON EMULATOR at stock 420dpi: Sunrise PG shows 101 green Empty, 102 amber Part full, 103 green Empty with the summary reading 2/1/0; Moonlight shows 501 red Full with 0/0/1. Tapping a tile still opens that room's bed grid. Re-checked in dark mode - the tokens adjust and stay legible. TESTS: 10 new (RoomFillTest covers all three states, the single-bed room, the no-beds-yet case, the defensive occupied>total case, the RAG mapping and icon distinctness; AllRoomsViewModelTest gains summary-bucket and per-item fill assertions). Full suite 422 pass / 0 fail. Coverage 97.00% line overall, with every new class at 100% line."}, {"timestamp": "2026-09-04T12:35:58+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all seven, and I went at the cases the developer had not covered rather than re-running the three-room happy path. AC1: bulk-added 14 rooms to a second floor plus a long-named one, giving 18 across two floors - the adaptive grid fits three per row and shows every room on one screen at stock 420dpi with no scrolling, which is the point of the ticket. AC2: verified all three colours against real data - Sunrise 101 green Empty, 102 amber Part full, and Moonlight 501 red Full. Colours resolve through the LODGY-36 tokens rather than literals, confirmed in code. AC3: every tile carries an icon, the room number, floor, 'N of M free' and a status word, so nothing is conveyed by colour alone; the icons are distinct per state and a unit test asserts that. AC4: the summary row reads '17 Empty / 1 Part full / 0 Full' and the three buckets always sum to the room count - checked against 18 rooms and again after injecting a nineteenth. AC5: tapping a tile still opens that room's bed grid, verified on Moonlight 501. AC6: re-checked in dark mode (tokens adjust, tiles stay legible) and in Hindi, which was the real risk - the status words become \u0916\u093e\u0932\u0940 / \u0906\u0902\u0936\u093f\u0915 / \u092d\u0930\u093e and the free-count becomes '2 \u092e\u0947\u0902 2 \u0916\u093e\u0932\u0940', and neither the tiles nor the non-wrapping summary row overflow or truncate. AC7: this one is not reachable through the UI, since every room type generates beds, so I injected a bedless room directly into the database. It renders as Empty in green with '0 of 0 free', counts into the Empty bucket, and does not crash or divide by zero - correct, since a room still being set up should not read as full. Synthetic row removed after. ALSO CHECKED, not in the ACs: a deliberately long room number (ANNEXE-B-201-EXTRA) truncates with an ellipsis inside its tile instead of pushing the icon out or wrapping the layout. Backward compatibility confirmed as claimed - no entity, DAO or query changed, DB still at version 4, and the existing install on the emulator upgraded in place with all its data intact. Build: 422 tests pass, 0 fail; line coverage 97.00% overall with every new class at 100%. One observation for the PO, not a fail: floor labels stay as the warden typed them ('Ground', 'First') while the rest of the tile is Hindi. That matches DESIGN.md 4.9 - warden-entered data is stored and shown as typed - so it is correct as specified, but it does read as half-translated."}]}, {"id": "LODGY-68", "epic": "Backup & Restore", "priority": "High", "title": "Daily automatic backup, with last-backup time and a one-tap backup on the dashboard", "description": "Product Owner request: should backup run automatically, daily; show the last backup time on the home screen with a small icon to back up from there. RECOMMENDED: yes, and it is the single highest-value safety feature left. Today backup is entirely manual - BackupScreen fires ActivityResultContracts.CreateDocument, the warden picks a location, and nothing records that it happened. A warden who forgets for two months has two months of unrecoverable data on one phone, and nothing in the app tells them so. WHY IT NEEDS A DESIGN, not just a WorkManager job: the current export takes a one-shot Uri from CreateDocument and no persistable permission is taken, so there is no folder to write to unattended. The job needs a location chosen ONCE via OpenDocumentTree with takePersistableUriPermission, stored in a new BackupPreferences, and reused daily. Everything else reuses BackupManager.export() as-is. THE REAL RISK is not the job failing, it is the job failing SILENTLY - a warden who believes they are covered and is not, is worse off than one who knows they are not. So the dashboard tile is not decoration, it is the feature: it must show staleness and failure as prominently as success, using the existing RAG tokens (recent = green, getting old = amber, never/failed/very stale = red). SUGGESTED SHAPE: (1) pick a folder once, persisted; (2) daily WorkManager job, same pattern as LODGY-15/59/60; (3) skip the run when nothing has changed since the last backup, so identical zips are not churned daily - the zip carries photos and is not small; (4) keep a rolling window of the last N backups and delete older ones, or storage grows without bound; (5) if the folder becomes unwritable - card removed, folder deleted, permission revoked - surface that on the dashboard rather than retrying quietly. RELATION TO LODGY-66: this is the auto-export measure recommended there. It also strengthens the case against soft delete, because a recent automatic backup covers the accidental-deletion fear that a recycle bin was meant to address, without taxing every query in the app.", "acceptanceCriteria": ["Warden picks a backup folder once; the permission persists across reboots and app updates, and the choice is changeable later from More", "A daily WorkManager job writes a timestamped backup zip into that folder without any interaction, following the existing periodic-worker pattern", "The dashboard shows when the last backup succeeded, in plain relative language, with a backup icon that runs one immediately", "The dashboard indicator distinguishes recent, getting stale, and never-or-failed using the LODGY-36 status tokens, so a silently broken backup is visible rather than assumed fine", "A run is skipped when no data has changed since the last successful backup, so unchanged days do not accumulate identical zips", "Only the most recent N backups are kept; older ones are removed so the folder does not grow without bound", "If the folder becomes unwritable the failure is surfaced on the dashboard and the warden is told how to re-pick it - it never fails silently", "Backward compatible: an existing install that has never chosen a folder keeps working exactly as today, prompted but never blocked, and no migration is required beyond the new preference"], "status": "Todo", "assigneeRole": "Developer", "createdAt": "2026-09-04T12:27:10+00:00", "updatedAt": "2026-09-04T12:27:10+00:00", "history": [{"timestamp": "2026-09-04T12:27:10+00:00", "actor": "Product Owner", "action": "created", "note": "Requested by the PO: daily auto-backup, last-backup time on the home screen with a one-tap backup icon. Filed with a recommended design and the silent-failure risk called out, because an auto-backup a warden wrongly believes is running is worse than no auto-backup."}]}, {"id": "LODGY-69", "epic": "Tenant Onboarding", "title": "Assign a tenant by tapping a bed, from the bed grid and from All rooms", "description": "Product Owner request: tapping a bed should offer two choices rather than acting immediately, so onboarding and tenant lookup can both start from the bed the warden is looking at instead of only from the Tenants tab. Should work from the bed grid inside a floor and from the All rooms tiles. THE INTERACTION, as settled by the PO across two clarifications: every bed tap opens the same two-option sheet, and only the second option changes with the bed's state. A VACANT bed offers 'view description' and 'assign tenant'. An OCCUPIED bed offers 'view description' and 'view tenant', the latter opening the assigned tenant's profile, which is already where every operation on that tenancy lives - notes, notice, transfer, credit, checkout. That symmetry is worth preserving in the build: the warden learns one gesture, the sheet always appears, and the second row is the only thing that differs. It also means no destructive or navigational action ever fires on a bare tap, which matters on a dense grid where mis-taps are easy. WHY THIS MATTERS: today onboarding runs Tenants > + > Pick a Vacant Bed, which asks the warden to find a bed in a list after they have already been looking straight at it in Property, and there is no route at all from a bed to the person in it. The bed picker (BedPickerScreen) stays as the entry point from the Tenants tab; this adds the reverse direction. CURRENT STATE: beds on BedGridScreen are not clickable at all - the tiles render status but carry no onClick, so this is a new interaction rather than an extension of an existing one. From All rooms a tile opens the room's bed grid, so if the grid is the shared target then the bed-level behaviour only has to be built once and both routes inherit it. OPEN QUESTION for the PO: what 'view description' shows. A bed has only a label and a status of its own, so the useful content is the room's - type, price per bed, amenities - plus, for an occupied bed, the tenancy summary. If it turns out to be thin for a vacant bed, that is worth knowing before build rather than after: the sheet is still justified by the symmetry above, but the description screen itself may not need to be more than a compact panel.", "acceptanceCriteria": ["Beds are tappable on BedGridScreen, which they are not today", "Every bed tap opens a two-option sheet rather than acting immediately, so no navigation happens on a bare tap", "A vacant bed offers view description and assign tenant", "An occupied bed offers view description and view tenant", "View tenant opens the assigned tenant's profile, from which every operation on that tenancy is already reachable", "Assign leads into the existing onboarding flow with that bed already chosen, so the warden is not asked to pick it again", "The same interaction is reachable for a bed arrived at via All rooms, so both routes behave identically", "A bed can never be assigned twice - assign is not offered for an occupied bed, so no second tenancy can be created on one bed", "A bed whose tenancy is somehow missing does not dead-end or crash - it falls back to the vacant behaviour rather than opening a profile that is not there", "The existing Tenants tab onboarding route via BedPickerScreen keeps working unchanged"], "status": "Todo", "priority": "High", "assigneeRole": "Developer", "createdAt": "2026-09-04T12:35:58+00:00", "updatedAt": "2026-09-04T12:38:35+00:00", "history": [{"timestamp": "2026-09-04T12:35:58+00:00", "actor": "Product Owner", "action": "created", "note": "Filed at the Product Owner's request: assign a tenant by tapping a bed, from the bed grid and from All rooms. PO clarified mid-filing that an occupied bed should go straight to the assigned tenant's profile rather than showing a sheet - folded in, so
