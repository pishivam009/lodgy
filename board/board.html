ot a manual override of Invoice.amountDue - an override would silently disconnect the invoice from LODGY-16/22's 'every number traces to a real record' invariant.", "acceptanceCriteria": ["A new Credit/Adjustment entity exists (amount, reason/note, tenant, optional linked invoice, createdAt) - not a mutation of the invoice's own amountDue field", "Warden can record a maintenance/repair credit against a specific tenant with an amount and a short note", "The credit is applied to reduce that tenant's next (or a chosen) invoice's effective amount due, and is visible on the invoice as a labeled line item, not just a smaller total", "Credit history is visible on the tenant's notes/timeline", "Reports (Monthly Report, CSV export) reflect the adjusted amounts by summing invoice + credit rows, not by reading a pre-adjusted cached total"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T11:38:43+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Resolved the data-model question: build a real Credit/Adjustment table rather than overriding amountDue directly."}, {"timestamp": "2026-09-03T18:06:35+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - a real Credit table (not a mutation of Invoice.amountDue), a Room migration 1 -> 2, effective-due arithmetic that every consumer of an invoice total goes through, and the credit surfaced as its own labelled line rather than a quietly smaller number."}, {"timestamp": "2026-09-03T18:18:01+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Credits are a real table, not an invoice mutation. New Credit entity (id, tenantId, nullable invoiceId, amount, reason, createdAt/updatedAt) with FKs to tenants (CASCADE) and invoices (SET NULL), plus CreditDao/CreditRepository. DB went to version 2 with a hand-written MIGRATION_1_2 - v1 is on a real warden's phone, so this migrates rather than wipes; the migration SQL was diffed against Room's own exported schemas/2.json and matches it exactly, indices included. Invoice.amountDue is never touched: all the arithmetic goes through one function, data/InvoiceTotals.kt effectiveAmountDue(), which also caps relief at the invoice total so a credit cannot push an invoice negative into a refund the app has no way to hand back. Every consumer routes through it - the invoice list total, the record-payment prefill AND the UNPAID/PARTIAL/PAID recalculation (a credited invoice paid down to its reduced balance now correctly reads PAID rather than sticking at PARTIAL), the reminder message's amount, and the Monthly Report. The credit shows as its own labelled 'Credit: \u20b9x' line on the invoice row and on the payment screen next to an 'after credit' figure - a labelled line item, not a quietly smaller number. Monthly Report gained a Credits tile and a Credits row in the CSV, computed by summing invoice and credit rows at read time with nothing pre-adjusted cached anywhere. Recording is More-free: a 'Record a credit' action on the tenant profile opens CreditFormScreen (amount, reason, and a target of either a specific unsettled invoice or 'Next invoice'); choosing 'Next invoice' stores invoiceId null and InvoiceGenerationWorker attaches everything still pending to the invoice it generates, so the applied state is explicit data rather than an implicit rule. The tenant timeline now merges notes and credits into one date-sorted list (TimelineEntry sealed interface), credits read-only there. Tests: InvoiceTotalsTest for the arithmetic including the over-credit cap, CreditFormViewModelTest for target selection and validation, RecordPaymentViewModelTest for the reduced prefill and the PAID transition, MonthlyReportViewModelTest for dues/credits summed from rows and scoped to the period, NotesTimelineViewModelTest for interleaving. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "In Progress", "note": "FAIL on AC2 - the credit feature is well built but unreachable on a default-density phone. AC1, AC3, AC4 and AC5 all pass. AC1: there is a real credits table (id, tenantId, invoiceId, amount, reason, createdAt) and the invoice's own amountDue is NOT mutated - after an 800 credit the invoice row still reads amountDue 3000.0. AC3: the invoice list shows 'Credit: 800' as a labelled line with the effective 2200 beneath it, and the receipt PDF renders 'Invoice amount 3000 / Credit applied 800 / Amount due 2200' as separate lines rather than one silently shrunken total. AC4: the timeline shows 'Credit 800 - Plumbing repair'. AC5: reports sum invoice + credit rows - the Monthly Report for 5/2026 shows Total collected 2200, Credits 800, Total dues 0, and the CSV export carries a distinct \"Credits\",\"800.00\" row. THE PROBLEM: AC2 says the warden can record a credit against a tenant. The 'Record a credit' card sits on the tenant profile below the fold, and that screen does not scroll - at the emulator's stock 1080x2400 @ 420dpi the profile is clipped after 'Pay several months at once' and swiping does nothing. Same single root cause as LODGY-34: TenantProfileScreen.kt:88, root Column has no verticalScroll(rememberScrollState()). I only reached the credit form by dropping the display to 280dpi. This should clear as soon as that one modifier is added - no changes needed to the credit feature itself."}, {"timestamp": "2026-09-04T11:00:02+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Fixed by the same one-line change as LODGY-34 - no changes to the credit feature, which QA had already passed on AC1/AC3/AC4/AC5. TenantProfileScreen's root Column now scrolls, so 'Record a credit' is reachable at stock 420dpi. VERIFIED ON EMULATOR at default density: the card is reachable by scrolling on an ACTIVE tenant's profile. Build and full suite green: 412 tests pass (4 new), ./gradlew testDebugUnitTest and assembleDebug both successful. Tests touched for the new signatures: TenantProfileViewModelTest and TenantDirectoryViewModelTest now mock the observed agreement flows, InvoiceListViewModelTest gains the ReconciliationRepository mock, and DataPacketTest gains the noticeGiven label. Note on two profile tests: they assert state after setPlannedMoveOut, which previously passed only because the ViewModel wrote the value optimistically. Rather than keep that second source of truth - the exact bug class LODGY-33 is about - the mocks now use a MutableStateFlow that re-emits on write, which is how Room actually behaves."}, {"timestamp": "2026-09-04T11:38:43+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS. AC2, the criterion this previously failed on, is met: 'Record a credit' is reachable on an ACTIVE tenant's profile at stock 420dpi now that the screen scrolls. AC1, AC3, AC4 and AC5 were already verified in the previous round and I spot-checked that the developer's changes did not disturb them - the credits table is still separate with the invoice's own amountDue unmutated, the invoice list still shows 'Credit: \u20b9800' as a labelled line above the reduced effective total, the timeline still shows the credit entry, and the Monthly Report still reports Credits as its own figure alongside Total collected. Worth noting for the record that this ticket and LODGY-34 were both fixed by the same single modifier on TenantProfileScreen's root Column, and the same change also restores Checkout, which had regressed against the already-delivered LODGY-14."}]}, {"id": "LODGY-36", "epic": "Appearance", "title": "Improve color coding for vacant/occupied beds and status labels", "description": "Current vacant/occupied indicators and status badges (invoice Unpaid/Partial/Paid, tenant Active/Vacated, etc.) use similar-looking neutral colors that are hard to tell apart at a glance. Adopt a standard RAG (Red/Amber/Green) -style status-color system: Red for the bad/urgent state (Occupied-overdue, Unpaid), Amber for in-between (Partial), Green for the good state (Vacant/available, Paid, Active) - a convention wardens and staff will already recognize from outside the app, rather than an invented color language. This is a prerequisite for LODGY-32 (dark mode) - land the token system here first so dark mode adjusts these same tokens rather than the two being built independently and drifting.", "acceptanceCriteria": ["A single RAG-based status-color token set is defined once and consumed everywhere, not per-screen ad hoc colors", "Vacant vs Occupied beds use the RAG green/red pair consistently across BedGridScreen and VacantViewScreen", "Invoice status badges (Unpaid=red/Partial=amber/Paid=green) and tenant status badges (Active=green/Vacated=neutral) follow the same token set app-wide", "Color choices remain distinguishable for common color-vision deficiencies (not color-alone - pair with icon/label, see LODGY-62)", "LODGY-32 (dark mode) consumes and adjusts these same tokens rather than defining its own"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Resolved the color-system ambiguity: use standard RAG (Red/Amber/Green) status coding rather than inventing a bespoke palette. Also made the LODGY-32 sequencing explicit (this lands first, dark mode consumes its tokens) instead of leaving it as two independent tickets that could drift."}, {"timestamp": "2026-09-03T17:26:43+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - defining one RAG token set (ui/theme/StatusColors.kt) provided through the theme, a StatusLevel mapping for BedStatus/InvoiceStatus/TenantStatus, and a shared StatusBadge so no screen picks its own colour. Building the tokens as a theme-provided value specifically so LODGY-32 can swap the dark variant without touching call sites."}, {"timestamp": "2026-09-03T17:31:03+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Built the RAG token set. ui/theme/StatusColors.kt defines StatusLevel (GOOD/WARN/BAD plus NEUTRAL for a state that is neither, i.e. a vacated tenant), StatusPalette (accent + container + onContainer) and Light/DarkStatusColors, handed down through LodgyTheme via LocalStatusColors so LODGY-32 flips the whole app by swapping one value rather than editing call sites. ui/common/StatusBadge.kt holds the single StatusLevel mapping for BedStatus/InvoiceStatus/TenantStatus plus the one StatusBadge composable every screen now draws. Consumers converted: BedGridScreen tiles (green vacant / red occupied instead of primaryContainer-vs-surface), VacantViewScreen rows, InvoiceListScreen's StatusChip (was an untinted SuggestionChip), TenantDirectoryScreen rows and TenantProfileScreen. Green is pulled toward teal and amber toward orange to stay separable under red-green CVD, and every badge still carries its text label - colour is never the only cue (LODGY-62 adds the icon on top of these same tokens). New StatusLevelTest covers the mappings and that each level resolves to a distinct palette in both schemes. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS on emulator (Pixel-class 1080x2400 @420dpi). AC1: single RAG token set in ui/theme/StatusColors.kt (StatusLevel GOOD/WARN/BAD/NEUTRAL + StatusPalette), exposed via LocalStatusColors and consumed through ui/common/StatusTokens.kt - no per-screen status colours anywhere. AC2: verified live - Room 102 bed grid and the Vacant Beds screen both render VACANT green / OCCUPIED red from the same tokens. AC3: verified live - Unpaid=red, Partial=amber, Paid=green on the invoice list; ACTIVE=green and VACATED=neutral on the tenant directory after checking Ramesh out. AC4: green is pulled to teal and amber to orange for red-green CVD separation, and every state also carries an icon + text label (see LODGY-62). AC5: LodgyTheme provides DarkStatusColors; re-checked the bed grid and invoice list in Dark and the RAG pairs stay correct and legible. Observation for the PO, not a fail: NotesTimelineScreen.kt:47-51 still hardcodes three note-TYPE dot colours as fixed hex that do not adapt to dark mode. Note type is a category, not a RAG status, so it is outside this ticket's ACs - flagging in case you want a follow-up."}]}, {"id": "LODGY-37", "epic": "Reporting & Dashboard", "title": "Export a single invoice / payment acknowledgement as PDF", "description": "Wardens want to hand (or WhatsApp) a tenant a proper receipt-style PDF for a specific invoice or payment, distinct from LODGY-23's whole-month CSV/PDF report export. This is a per-transaction acknowledgement a tenant can keep. Depends on LODGY-56 (shared PDF rendering foundation) - build against that renderer rather than starting a second, independent PDF pipeline; LODGY-45's full-data export needs the same foundation and the two should not diverge.", "acceptanceCriteria": ["From an invoice or a recorded payment, warden can export a PDF acknowledgement showing tenant name, room, period, amount, payment mode, and date", "PDF is saved via SAF to a location the warden picks, same pattern as LODGY-23/LODGY-28", "Numbers on the PDF match the underlying invoice/payment records exactly"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Added an explicit dependency on LODGY-56 - this ticket and LODGY-45 both need PDF rendering and were at risk of building two separate, inconsistent pipelines. LODGY-56 builds the shared renderer first; this ticket and LODGY-45 consume it."}, {"timestamp": "2026-09-03T18:21:10+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - a per-invoice acknowledgement built on LODGY-56's renderer and saved through the same SAF CreateDocument flow LODGY-23 uses."}, {"timestamp": "2026-09-03T18:27:24+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Per-invoice acknowledgement built on LODGY-56's renderer, no second PDF pipeline. pdf/InvoiceAcknowledgement.kt assembles the PdfDocumentContent - hostel as subtitle, tenant/room+bed/period, invoice amount, credit line when there is one, amount due, total paid, balance, then a Date/Mode/Amount table of every recorded payment (or a plain sentence when there are none, rather than an empty table) and the issue date. All chrome comes in through an AcknowledgementLabels object the composable fills from string resources, so the receipt prints in whichever language the warden is running, and every number arrives pre-formatted from the invoice/payment/credit rows - nothing is recomputed in the builder, so the sheet a tenant is handed cannot drift from what the app shows (AC 3). AcknowledgementViewModel walks invoice -> agreement -> tenant and agreement -> bed -> room -> floor -> hostel, sorts payments oldest-first, and runs the credit through the same effectiveAmountDue() as everywhere else; an overpayment reads as a zero balance rather than a negative one, and a deleted invoice says so instead of rendering blanks. Reached from a Receipt button on every invoice row (paid ones included - a receipt for a settled invoice is the common case), and saved through the same SAF ActivityResultContracts.CreateDocument flow as LODGY-23/28, with mime application/pdf and a lodgy-receipt-<month>-<year>.pdf default name. Tests: InvoiceAcknowledgementTest for structure, the payments table, the no-payments and no-credit cases, and that a 200-payment receipt paginates without losing a row; AcknowledgementViewModelTest for the data gathering, ordering, credit maths, overpayment and missing-invoice cases. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - exported two real PDFs and checked them at file level. AC1: the Receipt button on each invoice row opens an acknowledgement showing tenant, room+bed, period, invoice amount, credit applied, total paid and balance; for invoice 8/2026 the generated PDF also carries a Payments table with Date '4 Sep 2026' and Mode 'CASH', so payment mode and date are both present. AC2: the SAF picker opens with a sensible default name (lodgy-receipt-8-2026.pdf) and writes to the chosen location - same pattern as LODGY-23/28. AC3: numbers match the records exactly - pulled the files and extracted their text: invoice 5/2026 rendered 3000 invoice / 800 credit / 2200 due against DB rows amountDue=3000.0 and credits.amount=800.0; invoice 8/2026 rendered 6000/6000/0. Both files are structurally valid (%PDF-1.4 header, %%EOF, correct page tree) and carry a '1 / 1' page footer."}]}, {"id": "LODGY-38", "epic": "Settings & About", "title": "App version info for support/debugging", "description": "Small addition so a warden reporting an issue (or the developer supporting them remotely) can quickly see which build they're running. A one-line version string somewhere reachable, not a full About screen.", "acceptanceCriteria": ["More tab shows the app's versionName/versionCode somewhere visible (e.g. a footer line)", "Value updates automatically per build - not a hardcoded string that goes stale"], "status": "Done", "priority": "Low", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T17:25:45+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - a footer line under the More tab's menu, sourced from BuildConfig so it tracks the build rather than a literal."}, {"timestamp": "2026-09-03T17:31:03+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Enabled android.buildFeatures.buildConfig and added a centred footer line under the More tab's menu reading R.string.more_version with BuildConfig.VERSION_NAME and BuildConfig.VERSION_CODE, so it tracks whatever the build produced rather than a literal that goes stale. Strings added in en and hi. gradlew compileDebugKotlin green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS. AC1: the More tab shows 'Lodgy v0.1 (build 1)' as a footer line under the menu, visible without scrolling. AC2: not hardcoded - MoreScreen.kt:128 reads BuildConfig.VERSION_NAME and BuildConfig.VERSION_CODE, which match app/build.gradle.kts versionName '0.1' / versionCode 1, so it tracks the build automatically. Also localises correctly - renders as 'Lodgy v0.1 (build 1)' with a translated 'build' word in Hindi."}]}, {"id": "LODGY-39", "epic": "Usability", "title": "Sort and filter controls on the Tenant directory", "description": "Long-running hostels accumulate a large list of vacated tenants that clutter the day-to-day tenant directory. Wardens want to filter to just active tenants and sort by name or room, without scrolling past years of history. Split out from a single broader 'sort/filter everywhere' ticket per Product Owner review (2026-09-03) - the equivalent work for Room/Bed views, Invoices, and Expenses now lives in LODGY-53/54/55 respectively, since each screen's filter semantics and underlying queries are different enough to size and test independently.", "acceptanceCriteria": ["Tenant directory can filter to Active-only (hide vacated) and sort by name or room", "Filter/sort state resets sensibly and doesn't silently hide data the warden forgot was filtered"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Narrowed to Tenant directory only - this was scoped too broadly as one ticket spanning four different screens. Room/Bed filtering is now LODGY-53, Invoice date filter+sort is LODGY-54, Expense filter+sort is LODGY-55."}, {"timestamp": "2026-09-03T17:38:27+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - filter (All/Active) and sort (Name/Room) on the tenant directory. Defaulting the filter to Active-only since that is the complaint, but pairing it with a permanent 'N vacated hidden' line so AC 2 holds - the default helps without anything disappearing silently."}, {"timestamp": "2026-09-03T17:41:01+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Tenant directory now has a filter (Active only / All, defaulting to Active only) and a sort (Name / Room). AC 2 is handled by never hiding anything silently: both chip rows are always on screen showing the live selection, and whenever the filter drops rows the list is preceded by 'N vacated tenant(s) hidden by this filter', so the default can be the helpful one without a warden losing track of it. Room sort uses roomSortKey(), which orders numeric rooms numerically ('204' before '1005' - a plain string sort gets this backwards), then text-labelled rooms like 'G-2', then tenants with no room at all; name sort is case-insensitive. Added the shared ui/common/FilterChipRow.kt (horizontally scrolling so a long option set never clips) which LODGY-53/54/55 will reuse. TenantDirectoryViewModelTest covers the default filter and its hidden count, switching to ALL, case-insensitive name sort, and the three-way room ordering. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS. AC1: the tenant directory has an Active only / All filter and a Sort by Name / Room control; sorting by Room uses the real bed location (roomSortKey in TenantDirectoryViewModel handles numeric room prefixes and puts tenants with no room last). AC2: verified the important half live - after checking Ramesh out, the default Active-only view showed the explicit banner '1 vacated tenant(s) hidden by this filter', so hidden data is announced rather than silently dropped; switching to All brought the vacated tenant back. Minor UX nit for the PO, not a fail: when the filter hides everything, that banner sits above the empty-state text 'No tenants yet. Tap + to onboard your first one.', which reads oddly since there IS a tenant."}]}, {"id": "LODGY-40", "epic": "Property Setup", "title": "View all rooms of a hostel without drilling into floors", "description": "Currently seeing a hostel's rooms requires Property -> hostel -> floor -> room list, one floor at a time. Wardens want a single flat view of every room in a hostel across all floors, for a quick full-property scan.", "acceptanceCriteria": ["A hostel-level 'All Rooms' view lists every room across every floor, with the floor labeled per row", "Reachable directly from the hostel screen, not just via each floor", "Tapping a room still opens its normal bed grid / edit flow"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T17:52:20+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - a hostel-level All Rooms screen listing every room across every floor with its floor labelled, reachable from the hostel row, reusing the existing room -> bed grid navigation."}, {"timestamp": "2026-09-03T17:56:00+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Added a hostel-level All Rooms screen (ui/property/AllRoomsScreen.kt + AllRoomsViewModel.kt, route all_rooms/{hostelId}). RoomDao.getByHostelIdWithFloor returns rooms joined to their floor already ordered by floor sortOrder then room number, so each row carries its floor label without a per-room lookup, and BedDao.observeRoomOccupancyByHostel supplies the same vacant/total line the floor-scoped room list shows. Reachable from the hostel's own screen - an 'All rooms' action in FloorListScreen's app bar, so no floor has to be opened first. Tapping a room goes to its normal bed grid, the same destination the per-floor list uses. AllRoomsViewModelTest covers the cross-floor listing and bed counts, including a room with no beds yet. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS. AC1: 'All rooms' lists every room across every floor with the floor label on each row (Ground / Room 101 / 2 vacant / 2 beds / DOUBLE). AC2: reachable directly from the hostel screen via the 'All rooms' top-bar action, no floor drill-down needed. AC3: tapping Room 102 from this view opened its normal bed grid with the usual All/Vacant/Occupied filters, identical to arriving via the floor route."}]}, {"id": "LODGY-41", "epic": "Property Setup", "title": "Floor cards show a vacant/occupied room summary", "description": "Floor list rows currently show just the floor label. Wardens want an at-a-glance vacant/occupied summary on each floor card so they don't have to open every floor to see where space is available.", "acceptanceCriteria": ["Each floor card shows counts like 'X vacant / Y occupied' (beds or rooms, consistent with how VacantViewScreen counts)", "Counts update live when a checkout/onboarding changes a bed's status, without needing to leave and reopen the floor list"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T17:56:00+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - feeding BedDao.observeOccupancyByHostel (added in LODGY-53) into the floor list so each card carries live vacant/occupied bed counts."}, {"timestamp": "2026-09-03T17:58:37+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Floor cards now show 'N vacant / M occupied'. FloorListViewModel combines the floors flow with BedDao.observeOccupancyByHostel (the LEFT-JOIN version, so a floor with no rooms or no beds yet still reports 0/0 instead of disappearing from the summary), producing a FloorListItem per row. Because both sides are Room Flows, a checkout or onboarding that flips a bed re-emits and the card updates in place - no leaving and reopening the screen. Counts are bed-level to match how VacantViewScreen counts, so the two screens are not silently measuring different things. FloorListViewModelTest covers per-floor counts and the empty-floor case. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS. AC1: each floor card shows 'X vacant / Y occupied' - Ground read '0 vacant / 0 occupied' before any rooms existed, then '5 vacant / 1 occupied' once a tenant was in, matching how VacantViewScreen counts (bed level). A floor with no rooms still reports 0/0 rather than vanishing. AC2: counts are live - FloorListViewModel combines the floors flow with bedRepository.observeOccupancyByHostel(), a Room Flow that invalidates on any beds-table write, so an onboarding, transfer or checkout updates the card without leaving and reopening the list. Confirmed by the counts being correct immediately after a bed transfer and again after checkout."}]}, {"id": "LODGY-42", "epic": "Rent & Payments", "title": "Flag exceptional multi-month/delayed payments for warden review", "description": "Occasionally a tenant delays a month and later pays for two months together in one lump sum. This is a legitimate but exceptional pattern that today just looks like two ordinary payments - the warden has no way to spot it happened, or reconcile it, later. Resolved design question: today a Payment is tied to exactly one Invoice (LODGY-17), so 'one transaction clearing two periods' isn't expressible yet - this needs a real flow to record one payment and apply/split it across multiple invoices at once (not just a same-day-multiple-payments heuristic). Confirmed low priority/rare in practice, so this can wait behind higher-value tickets.", "acceptanceCriteria": ["Warden can record one payment amount and apply it across more than one of a tenant's unpaid/partial invoices in a single action, rather than recording separate payments per invoice", "Each invoice's paid-so-far amount updates correctly from its share of the single payment", "The resulting multi-period payment is flagged/labeled as such on the invoice(s) and payment record", "Dashboard or payment list surfaces these flagged multi-period payments so a warden can review them", "No change to how a normal single-period payment is recorded or displayed"], "status": "Done", "priority": "Low", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Resolved the schema gap flagged in backlog review: build the real one-payment-across-multiple-invoices flow (not a lighter heuristic). Downgraded Medium -> Low since this is rare in practice - fine to sit behind higher-value tickets."}, {"timestamp": "2026-09-03T18:58:54+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - one lump sum split across several of a tenant's open invoices. Adding a nullable multiPeriodGroupId to Payment (DB v4) so the several rows a single transaction produces stay linked and flaggable, rather than inferring it from same-day heuristics; single-period recording is untouched."}, {"timestamp": "2026-09-03T19:06:08+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "One lump sum can now be applied across several of a tenant's open months in a single action. Payment gained a nullable multiPeriodGroupId (DB v4, MIGRATION_3_4 is a plain ADD COLUMN); every row a single transaction writes shares one generated id, which is what makes the payment recognisable afterwards as one lump sum - a real link in the data, not the same-day heuristic the ticket ruled out. data/PaymentAllocation.kt holds the split as a pure function: oldest period first, each month settled in full before the next gets anything, which is how a warden describes it ('this clears August and part of September') and the only split that leaves an unambiguous trail; money beyond every outstanding balance is dropped rather than parked on the last invoice, since the app has no unallocated-balance concept and overpaying one month would make that invoice's own arithmetic wrong. MultiPeriodPaymentScreen (from the tenant profile) lists the open months oldest-first with each one's outstanding figure, prefills the total needed to clear them all, and shows the split live as the amount is edited, so nothing is applied by surprise. Outstanding is computed through effectiveAmountDue(), so a credited month asks for less. On save each invoice gets its own payment row and its own status recalculated from its own share - August PAID and September PARTIAL out of one transaction. Fewer than two open months refuses outright and points the warden at the ordinary flow, so AC 5 holds: single-period recording is untouched, and RecordPaymentViewModel still writes multiPeriodGroupId null by default. Surfaced on the invoice list: any invoice funded by a grouped payment carries a 'Part of a multi-month payment' line. Tests: PaymentAllocationTest for the split (exact, partial, over-payment, already-settled rows, empty cases); MultiPeriodPaymentViewModelTest for ordering and prefill, settled months excluded, the single-month refusal, one shared group id across rows, per-invoice status derivation, credits reducing a month's share, and zero being refused. testDebugUnitTest green (349 tests)."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all five, verified against the database. Set Ramesh up with three open invoices (5/2026 2200 after credit, 6/2026 6000, 7/2026 6000). AC1: 'Pay several months at once' takes one amount and applies it across them in a single action; entering 10000 instead of the prefilled 14200 recalculated the preview live to 2200 + 6000 + 1800, oldest first. AC2: after saving, each invoice's paid-so-far was correct - 5/2026 PAID, 6/2026 PAID, 7/2026 PARTIAL showing '1800 of 6000'. AC3: all three payment rows share one multiPeriodGroupId and each invoice row is labelled 'Part of a multi-month payment'. AC4: the payment list surfaces that label on every affected invoice, so the warden can spot and review them. AC5: recorded an ordinary single payment on a fresh 8/2026 invoice - it saved through the unchanged Record Payment screen, its payment row has multiPeriodGroupId NULL, and the invoice shows Paid with no multi-month label."}]}, {"id": "LODGY-43", "epic": "Backup & Restore", "title": "Reconciliation workflow between paper registers and the app", "description": "Wardens keep decades of history on paper and are only entering new activity into the app going forward - they are not confident the two records will stay in sync, and have no way to mark 'this paper entry is now also in the app' or spot gaps. Needs a lightweight way to track reconciliation status rather than forcing a full migration (see LODGY-44).", "acceptanceCriteria": ["Warden can mark a period (e.g. a given month for a given hostel) as 'reconciled with paper records'", "Reconciled periods are visually distinguished from not-yet-reconciled ones in the Monthly Report / Payments views", "This is a manual attestation, not an automated diff against anything - it does not block or alter any data"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T11:38:43+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T18:44:03+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - a per-hostel, per-month reconciliation attestation stored in its own table (DB v3), shown on the Monthly Report and nowhere allowed to alter or gate data."}, {"timestamp": "2026-09-03T18:50:12+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Reconciliation is a per-hostel, per-month attestation and nothing more. New ReconciliationMark entity (hostelId + periodMonth + periodYear, unique index on that triple so a period cannot be marked twice, CASCADE on hostel delete, optional note field reserved for later) with its own DAO and ReconciliationRepository; DB to version 3 with MIGRATION_2_3, again diffed against Room's exported schemas/3.json and matching it exactly. Surfaced on the Monthly Report as a 'Checked against paper records' switch, reading either 'You marked this month as matching your register' or 'Not checked against your register yet', and carried into the CSV export so a saved or printed report says whether it was reconciled. AC 3 is the important one and holds by construction: the mark lives in its own table, is written and read only by this switch, and no query anywhere filters, alters or gates on it - nothing is diffed against anything, and turning the switch back off deletes the row, so a mistaken attestation is reversible. MonthlyReportViewModelTest covers reading an existing mark, and that toggling writes then removes it. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "In Progress", "note": "FAIL on AC2 - only half the requirement is built. AC1 passes: the Monthly Report has a 'Checked against paper records' switch that marks a given month for a given hostel, the state persists (re-opened 9/2026 later and it still read 'You marked this month as matching your register'), and it is stored as its own reconciliation_marks row. AC3 passes: it is purely a manual attestation - flipping it altered no invoice, payment or total, and nothing is diffed or blocked. AC2 says 'Reconciled periods are visually distinguished from not-yet-reconciled ones in the Monthly Report / Payments views'. The Monthly Report does this (the switch plus 'You marked this month as matching your register.' vs 'Not checked against your register yet.'), and the CSV export carries it too. The Payments view does not. WHAT I DID: marked 8/2026 as reconciled, then opened the Invoices list. WHAT I EXPECTED: the 8/2026 invoice visually distinguished from the unreconciled 6/2026 and 7/2026 ones. WHAT HAPPENED: all three rows render identically - no badge, tint or marker of any kind. Confirmed in code: grepping for 'reconcil' across ui/ returns hits only in MonthlyReportScreen/ViewModel; nothing in the invoice list or its ViewModel consumes ReconciliationRepository. SUGGESTED FIX: surface the period's reconciled state on the invoice row (a small 'checked' marker keyed on the invoice's periodMonth/periodYear plus hostel). PO NOTE: if 'Monthly Report / Payments views' was only ever meant to mean the report screen, say so and I will pass this on the next round - I am reading the slash as naming two screens."}, {"timestamp": "2026-09-04T11:00:02+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Fixed - reconciliation state now appears on the Payments view as well as the Monthly Report. InvoiceListItem gains `periodReconciled`; the ViewModel combines the invoices flow with a new ReconciliationRepository.observeAll() and matches each invoice on (hostelId, periodMonth, periodYear). The hostel is resolved per invoice via a new BedDao.getHostelId(bedId) join (beds -> rooms -> floors), because the invoice list spans every hostel rather than a selected one - matching on period alone would have wrongly marked another hostel's invoices. The row renders a check icon plus the text 'Checked against register' in the LODGY-36 GOOD token, so it follows LODGY-62's icon-plus-label rule rather than colour alone. New strings reconciliation_badge in values/ and values-hi/. Because it is driven by an observed query, toggling the switch on the Monthly Report updates the invoice list without a restart. VERIFIED ON EMULATOR: 8/2026, the period QA marked reconciled this morning, now shows the badge while 6/2026 and 7/2026 do not. Build and full suite green: 412 tests pass (4 new), ./gradlew testDebugUnitTest and assembleDebug both successful. Tests touched for the new signatures: TenantProfileViewModelTest and TenantDirectoryViewModelTest now mock the observed agreement flows, InvoiceListViewModelTest gains the ReconciliationRepository mock, and DataPacketTest gains the noticeGiven label. Note on two profile tests: they assert state after setPlannedMoveOut, which previously passed only because the ViewModel wrote the value optimistically. Rather than keep that second source of truth - the exact bug class LODGY-33 is about - the mocks now use a MutableStateFlow that re-emits on write, which is how Room actually behaves."}, {"timestamp": "2026-09-04T11:38:43+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - and I specifically tried to break the new hostel-matching logic, because keying a badge on period alone would have been an easy and invisible bug. AC1 and AC3 were already passing and still are. AC2 is now met on BOTH surfaces the criterion names. The test that matters: I built a second hostel (Moonlight, Room 501, tenant Priya) and gave it an invoice for 8/2026 - the SAME period already marked reconciled on Sunrise PG. Filtered the invoice list to month 8 so both sat side by side: Sunrise's 8/2026 row carried 'Checked against register' and Moonlight's 8/2026 row did NOT. So the badge follows the hostel, not just the period - a period-only match would have wrongly flagged Priya's invoice. Then I marked Moonlight's 8/2026 reconciled on its own Monthly Report and returned to the invoice list WITHOUT restarting: Priya's row picked up the badge immediately, confirming it is driven by an observed query rather than a one-shot read. The badge pairs a check icon with the text 'Checked against register' in the LODGY-36 GOOD token, so it satisfies LODGY-62's icon-plus-label rule rather than relying on colour alone, and it is translated in values-hi."}]}, {"id": "LODGY-44", "epic": "Backup & Restore", "title": "Lightweight historical backfill mode (avoid full manual re-entry)", "description": "Wardens are reluctant to type years of paper history into the app tenant-by-tenant, invoice-by-invoice - it's described as boring, slow, and low-value for them. Rather than requiring full ledger reconstruction, offer a fast, minimal way to seed historical context (e.g. a tenant's move-in date and a running balance/opening due, or a bulk CSV import) instead of every past invoice/payment.", "acceptanceCriteria": ["Onboarding an existing (already-resident) tenant supports an optional 'opening balance / dues carried forward' field instead of requiring every past invoice to be re-entered", "A bulk import path (e.g. CSV) exists for wardens who do want to bring over structured history, as an alternative to one-by-one manual entry", "Skipping historical backfill entirely does not block using the app for new activity going forward"], "status": "Done", "priority": "Low", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "comment", "note": "Explicitly deferred - the opening-balance-vs-reporting-invariant tension flagged in backlog review is real (an opening balance not backed by real invoice/payment rows would drift from what LODGY-22's reports can reconcile) and needs a proper design pass, not a quick call. Will come back to this later; not blocking anything else in the meantime."}, {"timestamp": "2026-09-03T18:50:32+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - two paths, neither mandatory: an optional dues-carried-forward field at move-in that produces one real opening invoice instead of a re-typed ledger, and a CSV import for wardens who do want structured history."}, {"timestamp": "2026-09-03T18:58:41+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Two independent backfill paths, both optional. (1) Opening balance: the agreement form gained a 'Dues carried forward (optional)' field with a hint saying plainly that past months need not be re-entered. A non-zero value writes ONE real invoice rather than a number stashed on the agreement, so carried-forward dues flow through the invoice list, reports, reminders and receipts exactly like any other due and can be paid off normally. It is dated the month BEFORE move-in - InvoiceGenerationWorker only ever creates invoices from the current month forward, so that period can never collide with one it generates; a January move-in correctly rolls back to December of the previous year. (2) CSV import: backup/HistoryCsv.kt parses 'phone,month,year,amount_due,amount_paid' - forgiving about blank lines, an optional header and stray spaces, strict about values, and reporting each unreadable line by number instead of dropping it silently, because a warden typing years into a spreadsheet will get some of it wrong and needs to know which lines. More -> Import past history (CSV) shows how many rows are importable, how many carry a phone number no tenant uses, and the first few bad lines before anything is written. Each matched row becomes a real invoice plus, where money was paid, a real payment, with the status derived - so imported history is indistinguishable from history entered at the time. existsForPeriod guards every write, so re-running an import cannot double-bill. AC 3 holds by construction: both paths are opt-in and nothing anywhere requires them. Tests: HistoryCsvTest for the parser (headers, blank lines, bad columns, non-numeric amounts, impossible months/years, negatives, blank phone, empty file); HistoryImportViewModelTest for the matched/unmatched split, unreadable files, PAID/PARTIAL/UNPAID derivation, the re-run guard, and unknown tenants never being written; AgreementFormViewModelTest for the blank, zero, unparseable and January opening-balance cases. testDebugUnitTest green (343 tests)."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all three, including a real CSV import. AC1: the agreement screen has 'Dues carried forward (optional)' with a plain-language hint; entering 3000 for a tenant backdated to 5 Jun 2026 created a single opening invoice (period 5/2026, amountDue 3000, dueDate = move-in) instead of demanding every past month be re-entered. AC2: More > Import past history (CSV) documents the column order and validates before committing - fed it a 4-line file mixing valid rows, an unknown phone and a malformed line, and it reported '2 of 3 row(s) can be imported', '1 row(s) have a phone number no tenant in the app uses - add those tenants first.' and 'Line 4 could not be read: garbage,row,here', then imported exactly the 2 good rows. Verified in the DB: 3/2026 5000 PAID and 4/2026 5000 PARTIAL with a 2000 payment - amounts, statuses and payment rows all correct. AC3: the screen states plainly that skipping changes nothing, and the app worked normally throughout without any backfill."}]}, {"id": "LODGY-45", "epic": "Backup & Restore", "title": "Full data export as a human-readable, printable PDF packet", "description": "Wardens trust a physical, readable paper trail more than a zip file they can't open themselves (LODGY-28 exports a DB+photos zip, not something a warden can read or hand to someone). To ease the fear of 'losing everything in the app', offer a printable/PDF export of the underlying records - hostels, tenants, invoices, payments - as a human-readable document, distinct from the machine-readable backup zip. Depends on LODGY-56 (shared PDF rendering foundation) - reuse the same renderer LODGY-37 builds against rather than a second pipeline; this ticket is the larger, multi-page consumer of it.", "acceptanceCriteria": ["Warden can export a printable PDF summary of all tenants, active agreements, and payment history for a hostel (or all hostels)", "PDF is legible and organized (grouped by hostel/room/tenant), not a raw data dump", "Exported via SAF like other exports (LODGY-23/28), so it can be saved, printed, or shared"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T11:38:43+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T21:00:00+00:00", "actor": "Product Owner", "action": "edited", "note": "Added an explicit dependency on LODGY-56 - this ticket and LODGY-37 both need PDF rendering and were at risk of building two separate, inconsistent pipelines. LODGY-56 builds the shared renderer first; this ticket and LODGY-37 consume it."}, {"timestamp": "2026-09-03T18:27:24+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - the multi-page consumer of LODGY-56: a printable packet grouped hostel -> floor -> room -> tenant with agreement and payment history, exported through SAF like the other exports."}, {"timestamp": "2026-09-03T18:33:41+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Printable records packet built on LODGY-56's renderer, the same one LODGY-37 uses - no second pipeline. pdf/DataPacket.kt structures the document hostel -> floor -> room+bed -> tenant, which is how a warden walks the property, rather than a flat dump in whatever order the database returned: per hostel a title, address and bed summary; per floor a heading; per tenancy a 'Room 204 - Bed B - Ravi' heading with phone, status, agreed rent, move-in (and move-out only when there is one), then a Period/Due/Paid/Status table of the whole invoice history - or a plain sentence where a tenancy has no invoices and where a hostel has no tenancies at all, so an empty property is still visibly present instead of silently missing. DataPacketViewModel gathers it with a scope of This hostel (default) or All hostels, counts beds from the bed rows, takes each bed's latest agreement so a moved-out tenancy still appears rather than vanishing, orders invoices oldest period first, and runs every amount through effectiveAmountDue() so the packet agrees with the rest of the app about credits. Reached from More -> Printable records (PDF), exported via the same SAF CreateDocument path as LODGY-23/28/37 as lodgy-records-<date>.pdf. Tests: DataPacketTest asserts the grouping order, the invoice table, the no-invoices and no-tenancies cases, move-out row presence, and that a 32-tenancy property paginates across pages without losing a tenancy; DataPacketViewModelTest covers scope switching, bed counts, invoice ordering with a credit applied, and beds that were never occupied. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "In Progress", "note": "FAIL - the export works, but it prints a factually wrong statement about a current resident. AC1 and AC3 pass: More > Printable records (PDF) offers 'This hostel' / 'All hostels' with record counts, and saves via SAF (lodgy-records-2026-09-04.pdf). AC2 is mostly good - the packet is genuinely organised rather than a dump: hostel name and address, a beds summary, then floor > room > tenant with phone, status, rent and dates, and a per-tenant invoice history table with correct credit-adjusted amounts, all legible with page footers, and it renders correctly in Hindi too. THE BUG: for a tenant who is ACTIVE and has merely given notice, the packet prints 'Moved out: 20 Sep 2026'. The same record says 'Status: ACTIVE' three lines above, so the document contradicts itself and tells anyone reading it that a current resident has already left. WHAT I DID: set a planned move-out date of 20 Sep 2026 on Ramesh Kumar (still ACTIVE, bed still OCCUPIED, exactly as LODGY-49 intends), then exported the printable records packet. WHAT I EXPECTED: either no move-out line, or one clearly labelled as a planned/notice date. WHAT HAPPENED: it is labelled 'Moved out', identically to a real completed checkout. ROOT CAUSE: pdf/DataPacket.kt:77 does tenancy.moveOutDate?.let { add(PdfBlock.KeyValue(labels.movedOut, it)) } with no check of the agreement's status. LODGY-49 now writes a planned moveOutDate onto ACTIVE agreements, so that field no longer means 'has moved out'. SUGGESTED FIX: branch on agreement status - label it 'Moved out' only for a CLOSED agreement, and use a separate 'Notice given / Leaving on' label while ACTIVE. This matters more than an ordinary display bug because the entire point of this ticket is a document the warden prints and hands to someone."}, {"timestamp": "2026-09-04T11:00:02+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Fixed. pdf/DataPacket.kt no longer assumes a moveOutDate means a completed departure: PacketTenancy gains `moveOutIsPlanned`, PacketLabels gains `noticeGiven`, and the block picks the label by that flag. DataPacketScreen passes `moveOutIsPlanned = tenancy.active`, using the `active` flag already carried on PacketTenancyData - so an ACTIVE agreement with a notice date reads as notice, and only a CLOSED one reads as a departure. New strings packet_notice_given in values/ ('Leaving on (notice given)') and values-hi/. VERIFIED ON EMULATOR with one export that exercises BOTH branches in a single document: Ramesh Kumar (VACATED, real checkout) prints 'Moved out: 4 Sep 2026', and Suresh (ACTIVE, notice set for 25 Sep 2026) prints 'Leaving on (notice given): 25 Sep 2026'. The self-contradiction QA found - a record saying ACTIVE three lines above 'Moved out' - is gone. Added two DataPacketTest cases asserting each branch emits the right label and not the other. Build and full suite green: 412 tests pass (4 new), ./gradlew testDebugUnitTest and assembleDebug both successful. Tests touched for the new signatures: TenantProfileViewModelTest and TenantDirectoryViewModelTest now mock the observed agreement flows, InvoiceListViewModelTest gains the ReconciliationRepository mock, and DataPacketTest gains the noticeGiven label. Note on two profile tests: they assert state after setPlannedMoveOut, which previously passed only because the ViewModel wrote the value optimistically. Rather than keep that second source of truth - the exact bug class LODGY-33 is about - the mocks now use a MutableStateFlow that re-emits on write, which is how Room actually behaves."}, {"timestamp": "2026-09-04T11:38:43+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - the self-contradiction is gone, and one export proves both branches at once. AC1 and AC3 were already passing. The fix: I set a notice date of 25 Sep 2026 on Suresh while he was still ACTIVE with his bed still OCCUPIED (exactly the LODGY-49 state that produced the bug), then exported the printable packet with Ramesh Kumar already checked out. The single PDF contains both cases and labels them differently and correctly - Ramesh reads 'Status VACATED' then 'Moved out: 4 Sep 2026', Suresh reads 'Status ACTIVE' then 'Leaving on (notice given): 25 Sep 2026'. No record now says a current resident has moved out. AC2 still holds: the packet is still grouped hostel -> floor -> room -> tenant with per-tenant invoice history and correct credit-adjusted amounts, and the new label is translated in values-hi so the Hindi export is not left with an English string."}]}, {"id": "LODGY-46", "epic": "Engineering Quality", "title": "Security review pass", "description": "Explicit ask to check the app for security vulnerabilities before wider rollout - PIN/bcrypt storage, exported components, file provider/URI permission scoping, backup file handling, and any other OWASP Mobile Top 10-relevant surface.", "acceptanceCriteria": ["Manifest components (activities, providers, services) reviewed for unintended exported=true / missing permission scoping", "FileProvider paths and granted URI permissions reviewed for over-broad access", "PIN hashing (bcrypt via jbcrypt) and storage reviewed for correct salt/rounds usage", "Backup export/import (LODGY-28/29) reviewed for zip-slip/path-traversal safety (stageImport's existing '..'/'/' filtering should be re-verified, not assumed)", "Findings written up with severity and suggested fixes, even if some are accepted as out-of-scope for a local-only, no-backend app"], "status": "Done", "priority": "High", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-04T05:44:38+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - reading the manifest, FileProvider config, PinHasher and BackupManager.stageImport against the acceptance criteria, re-verifying rather than assuming the existing path-traversal filter."}, {"timestamp": "2026-09-04T05:51:15+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Review done and written up in docs/SECURITY-REVIEW.md, with severity judged against this app's actual threat model (another app on the same device, and someone picking the phone up) rather than a generic checklist - there is no network permission and no server, so whole OWASP categories have no surface here. Six findings, two fixed in this pass. FIXED, Medium: MainActivity is exported and was passing its notification-route extra straight to navController.navigate(), so any app on the device could crash Lodgy on launch with a bogus route - a route I introduced in LODGY-59/60. Now allow-listed by isSupportedNotificationRoute() and covered by NotificationRoutesTest; no data was ever reachable, since the route is only replayed after the PIN gate. FIXED, Low: file_paths.xml shared all of cacheDir, which is also where restore_staging puts an unencrypted copy of the whole database during an import; narrowed to cacheDir/camera/ with PhotoStorage writing there, so the staging area is no longer inside any shareable path. OPEN, Medium: the lock screen has no backoff or lockout on repeated PIN attempts - left as a finding with a suggested fix rather than changed here, because adding a lockout is a product decision that can lock a warden out of their own records. ACCEPTED, Low x2: the 4-6 digit PIN space is small against someone who already has the DB file (bcrypt usage itself is correct - per-hash gensalt, cost 10, checkpw; mitigated by LODGY-50's longer PIN and the roadmap's SQLCipher item, and extraction needs root, which DESIGN.md 5 puts out of scope), and an imported zip has no size cap, which is a self-inflicted DoS since the warden picks the file. AC 4 specifically: the zip-slip filter was re-verified line by line rather than assumed - the DB entry is matched by exact string equality, photo names are rejected if blank or containing '..' or '/', every other entry is ignored, and backslash is not a separator on Android, so nested and traversing paths are all refused. Also confirmed clean: only MainActivity is exported, allowBackup is false (which is what stops adb backup lifting the unencrypted DB), the single permission is POST_NOTIFICATIONS, there is no logging anywhere in app/src/main to leak tenant data, and every outbound intent is tap-to-send. assembleDebug and the coverage gate both green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - re-verified every finding independently rather than accepting the write-up. AC1: read AndroidManifest.xml directly - MainActivity is the only exported=true component (launcher requirement); FileProvider, androidx.startup InitializationProvider (WorkManager's default initializer removed via tools:node=remove) and AppLocalesMetadataHolderService are all exported=false; no receivers, no exported services, allowBackup=false, and exactly one permission (POST_NOTIFICATIONS). AC2: res/xml/file_paths.xml grants only <cache-path path='camera/'>, not all of cacheDir - correct, since the restore staging area under cacheDir holds a plaintext copy of the whole DB during an import. AC3: PinHasher uses BCrypt.gensalt() (random per-hash salt, cost 10, salt embedded in the hash) and BCrypt.checkpw - no fixed salt, no home-rolled digest, no fast hash. AC4: re-read stageImport myself rather than assuming - the DB entry is accepted only on exact name equality, and photo entries are rejected if blank, containing '..' or containing '/', so nothing can escape the staging directory; the '..' check also covers Windows-style traversal. AC5: docs/SECURITY-REVIEW.md rates 6 findings with severity and status (2 FIXED, 1 OPEN with a concrete suggested fix, 2 ACCEPTED against DESIGN.md 5, 1 re-verified clean) plus a 'reviewed and clean' section. I also live-tested the finding-1 fix: launched the exported MainActivity with --es com.lodgy.app.NOTIFICATION_ROUTE 'evil_route_does_not_exist' and the app started normally with no crash - isSupportedNotificationRoute is genuinely wired in at LodgyNavHost.kt:102, not merely written."}]}, {"id": "LODGY-47", "epic": "Engineering Quality", "title": "Raise automated test coverage further", "description": "Current unit test coverage sits around 94.6% (JaCoCo). Push further into thinly-covered areas - especially ones this QA pass had to verify manually because no test existed, like InvoiceGenerationWorker's WorkManager scheduling logic and the backup/restore file-handling paths.", "acceptanceCriteria": ["JaCoCo coverage report identifies remaining low-coverage classes/packages", "New unit tests added for BackupManager (export/stageImport/applyStaged) and InvoiceGenerationWorker's doWork() logic, which currently have no dedicated tests", "Coverage gate in build.gradle.kts reviewed and raised if the new tests support it"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T19:17:25+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - running the JaCoCo report first to see where the session's new code actually landed, then filling the named gaps (BackupManager, InvoiceGenerationWorker.doWork) before deciding whether the gate can move."}, {"timestamp": "2026-09-04T05:44:27+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Coverage report first: this session's work had pulled the figure down to 85.3%, so the gaps this ticket names were joined by newer ones. Now 97.12% line coverage (2799/2882) with the gate raised from 0.80 to 0.93 - a few points below the measured figure, high enough that a whole feature landing untested trips it, loose enough that one uncovered branch does not block a build. One correction to the ticket's premise: BackupManager already has BackupManagerTest covering export, stageImport (including the zip-slip rejection), applyStaged and both stream-failure paths - it must have been added after this ticket was written, so no work was needed there. InvoiceGenerationWorker's doWork() IS reachable from a plain JVM test after all, with mocked Context/WorkerParameters - the exclusion claiming otherwise was wrong and is gone. New tests: InvoiceGenerationWorkerTest (bills today's agreements, skips other days, never double-bills a period, attaches pending credits), VacancyCheckWorkerTest and DuesReminderWorkerTest (both switches, the notified-set bookkeeping, the warden's threshold driving the cutoff, overdue vs future vs settled invoices, recurring vs one-off expenses), CreditRepositoryTest, ReconciliationRepositoryTest, NotificationPreferencesTest, ThemePreferencesTest, AuthPreferences pin-length round-trip and clamping, BedRepository's new aggregate queries, TenancyAgreementRepository's transferBed and setPlannedMoveOut, both new WorkScheduler jobs, and the BedFilter matcher. Exclusions rewritten to be honest rather than convenient: added only things with no JVM-reachable logic - Compose-only files (FilterChipRow, StatusBadge, AppRoot, icon sets), Migrations (raw SQL needing an instrumented MigrationTestHelper; each migration's SQL is instead diffed against Room's exported schema JSON when written), and thin Android wrappers (LodgyPdfRenderer, LodgyNotifications, HistoryCsvReader, PhotoStorage) whose logic was deliberately extracted into the testable PdfLayout/VacancyNudge/DuesNudge/HistoryCsv. To make that split real, ui/common/StatusBadge.kt was divided into StatusTokens.kt (pure level/icon/filter mapping, tested) and StatusBadge.kt (composables only, excluded). jacocoCoverageVerification passes at the new gate."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS. AC1: ./gradlew jacocoTestReport produces the report and it does identify the thin spots - overall LINE coverage is now 97.12% (2802 covered / 83 missed), the remaining misses being one-line synthetic lambdas and Compose helpers. AC2: both named gaps are closed - BackupManagerTest.kt has 7 tests covering export, stageImport and applyStaged, and InvoiceGenerationWorkerTest.kt has 5 tests exercising doWork(). AC3: the gate was reviewed and raised - git history shows minimum 0.80 -> 0.93, with an in-file comment explaining the choice (measured 97.1%, set a few points below so a whole untested feature trips it but one uncovered branch does not block a build). jacocoCoverageVerification passes and the full testDebugUnitTest suite is green."}]}, {"id": "LODGY-48", "epic": "Engineering Quality", "title": "Reduce APK size without regressing performance", "description": "Investigate what's contributing to APK size (dependencies, resources, unused code) and trim it for easier installs on lower-end devices/slower connections common among the target users, without hurting startup time or runtime performance.", "acceptanceCriteria": ["APK analyzer run to identify largest contributors (libraries, resources, generated code)", "R8/ProGuard minification and resource shrinking enabled and verified not to break any feature (needs a full manual pass, not just a successful build)", "Unused dependencies or oversized assets removed or replaced", "Cold start time and key screen transitions measured before/after to confirm no regression"], "status": "Won't Do", "priority": "Low", "assigneeRole": "Developer", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-03T22:00:00+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T22:00:00+00:00", "actor": "Product Owner", "action": "status_change", "from": "Todo", "to": "Won't Do", "note": "Current APK size is already small enough in practice - not worth the effort or the R8/minification regression risk right now. Also removes the size-vs-PDF-library tension this ticket had with LODGY-56/37/45; those are now free to pick whichever PDF approach is simplest to build correctly, not constrained by keeping the APK lean. Revisit only if a real installability complaint shows up."}]}, {"id": "LODGY-49", "epic": "Tenant Onboarding", "title": "Planned/notice move-out date for tenants", "description": "Buried gap found while building LODGY-20 (Home dashboard): 'Upcoming move-outs' has no real data source today. Checkout (LODGY-14) is immediate - bed freed, agreement closed, tenant vacated all in one action - there's no 'tenant gave notice, will leave on date X' concept anywhere, so an ACTIVE agreement with a future moveOutDate never actually occurs through any existing flow. The dashboard's query is correct but will always render empty until this exists.", "acceptanceCriteria": ["Warden can record a tenant's notice/planned move-out date while the tenant is still ACTIVE, without checking them out immediately", "Home dashboard's 'Upcoming move-outs' tile (LODGY-20) now genuinely populates from real data", "The planned date does not auto-checkout the tenant - checkout (LODGY-14) remains an explicit separate action on or after that date"], "status": "Done", "priority": "Medium", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T17:58:37+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - a notice/planned move-out date recorded on the ACTIVE agreement so the dashboard's Upcoming move-outs tile finally has a data source, with checkout left as a separate explicit action."}, {"timestamp": "2026-09-03T18:01:30+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "Notice/planned move-out now exists, so LODGY-20's Upcoming move-outs tile has a real data source. TenancyAgreementRepository.setPlannedMoveOut() writes moveOutDate on the agreement and changes nothing else - status stays ACTIVE, the bed stays OCCUPIED, no deposit settlement - which is exactly the shape the dashboard query already looked for (ACTIVE + moveOutDate in the future), so that tile needed no change to start populating. Passing null withdraws the notice. Surfaced on TenantProfileScreen for active tenants only, as a 'Notice given' card with a date picker (same Material DatePickerDialog pattern as the note and expense forms), a Withdraw notice action once a date is set, and a line stating plainly that recording notice does not check the tenant out. TenantProfileViewModel only reports moveOutDate as a pending notice when the latest agreement is ACTIVE - on a CLOSED one that field is the historical checkout date, not a notice. TenantProfileViewModelTest covers all four cases including that close() is never called. testDebugUnitTest green."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS - all three verified live. AC1: the tenant profile has a 'Notice given' card with Set date; picked 20 Sep 2026 for an ACTIVE tenant and it recorded without any checkout, with a 'Withdraw notice' action appearing to clear it. AC2: the dashboard's Upcoming move-outs tile went from 0 to 1 and now lists 'Ramesh Kumar / 20 Sep 2026' - populated from real data, not a placeholder. AC3: no auto-checkout - the tenant stayed ACTIVE with the bed still OCCUPIED after the notice date was set, and the card states plainly 'Recording notice does not check the tenant out - do that separately on the day'. Checkout remained a separate explicit action, which I then ran independently and which behaved correctly (agreement CLOSED, bed VACANT, deposit refund 8500 after a 1500 damage deduction, history preserved). Cross-reference for the developer: the planned date this ticket introduces is what LODGY-45's printable packet mislabels as 'Moved out' - that fix is tracked on LODGY-45, nothing to change here."}]}, {"id": "LODGY-50", "epic": "Auth", "title": "Configurable PIN length (4-6 digits)", "description": "Buried scope note from LODGY-4: PIN length was fixed at 4 digits since neither DESIGN.md nor the ticket specified one, and a variable-length flow needs an explicit confirm control the wireframe didn't show. Revisit if wardens want a longer PIN.", "acceptanceCriteria": ["PIN setup supports a warden-chosen length between 4 and 6 digits", "Setup flow has an explicit confirm step regardless of chosen length", "Existing 4-digit PINs from before this change continue to work unchanged"], "status": "Done", "priority": "Low", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp": "2026-09-03T18:33:51+00:00", "actor": "Developer", "action": "status_change", "from": "Todo", "to": "In Progress", "note": "Starting - warden-chosen 4-6 digit PIN with an explicit confirm step. The stored bcrypt hash carries no length, so existing 4-digit PINs keep working without any migration; the lock screen just has to stop assuming 4."}, {"timestamp": "2026-09-03T18:38:27+00:00", "actor": "Developer", "action": "status_change", "from": "In Progress", "to": "Testing", "note": "PIN length is now the warden's choice, 4-6. AuthPreferences gained pinLength (MIN 4 / MAX 6 / DEFAULT 4, clamped on both read and write); the bcrypt hash carries no length of its own, so this preference is the only thing that has to remember, and an install from before this change has no stored value, reads 4, and unlocks exactly as it did - AC 3 needs no migration. Setup: length chips on the ENTER step (locked once the first digit is typed, so the dots can never disagree with what is being entered) and an explicit Continue / Confirm PIN button on both steps, replacing the old auto-advance-at-4-digits. That was forced anyway - with a variable length there is no digit count that reliably means 'done' - and it satisfies AC 2 directly. The chosen length is written on save. The lock screen keeps auto-verifying, but at the stored length rather than a hardcoded 4, and its dots follow it. Tests: PinSetupViewModelTest now drives the explicit submit, and covers the six-digit path with setPinLength persisted, a submit refused on an incomplete PIN, nothing advancing before the button, the length locking after the first digit, and the 4-6 option list; PinLockViewModelTest covers a six-digit unlock only firing on the sixth digit and the legacy four-digit install still unlocking. testDebugUnitTest green (309 tests)."}, {"timestamp": "2026-09-04T07:46:28+00:00", "actor": "Tester", "action": "status_change", "from": "Testing", "to": "Done", "note": "PASS. AC1: the setup screen offers 4 / 5 / 6 digits and honours the choice - picked 6, entered a 6-digit PIN, and the dot indicator showed six positions. AC2: there is an explicit confirm step regardless of length - Continue moves to 'Confirm your PIN', and a deliberate mismatch was rejected with 'PINs didn't match - try again' and returned to the create step rather than silently accepting. AC3: existing 4-digit PINs are unaffected - AuthPreferences.pinLength falls back to DEFAULT_PIN_LENGTH (4) when the pin_length key is absent, which is exactly the state of a pre-change install, and the stored bcrypt hash format is untouched; AuthPreferencesTest asserts the unset-key default and PinLockViewModelTest covers both 4- and 6-digit unlock. End to end: force-stopped the app and unlocked with the 6-digit PIN across several restarts during this session."}]}, {"id": "LODGY-51", "epic": "Backup & Restore", "title": "Clean up orphaned photo files", "description": "Buried finding from LODGY-11/LODGY-28: PhotoStorage persists a picked/captured image to app-private storage immediately, before the tenant form is ever saved. An abandoned pick (form closed without saving, or interrupted) leaves a permanently dangling file that nothing ever cleans up - these accumulate over time and get included in every future backup export (LODGY-28) even though no record references them.", "acceptanceCriteria": ["A cleanup routine runs automatically on app start (on a background dispatcher, not blocking startup) - no manual maintenance action needed - and identifies photo files under filesDir/photos not referenced by any tenant's photoPath/idProofPhotoPath, then deletes them", "Referenced photos are never touched by the cleanup, verified against real tenant records including vacated tenants", "Backup export (LODGY-28) no longer includes orphaned files after cleanup has run"], "status": "Done", "priority": "Low", "assigneeRole": "Tester", "createdAt": "2026-09-03T20:00:00+00:00", "updatedAt": "2026-09-04T07:46:28+00:00", "history": [{"timestamp": "2026-09-03T20:00:00+00:00", "actor": "Product Owner", "action": "created", "note": "Added from the v2 feedback session (warden interviews after the v1 field test) and from buried enhancement/limitation notes surfaced while re-reading the full v1 board history."}, {"timestamp"
