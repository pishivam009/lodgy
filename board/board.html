 the two-option sheet is a vacant-bed interaction only."}, {"timestamp": "2026-09-04T12:38:35+00:00", "actor": "Product Owner", "action": "comment", "note": "Amended before build. The PO first said an occupied bed should go straight to the tenant profile, then revised it to a two-option sheet - view description and view tenant. Taking the revision: every bed tap now opens the same sheet and only the second option varies by state, so the warden learns one gesture and nothing navigates on a bare tap, which matters on a dense grid. Acceptance criteria rewritten to match; the ticket had not been started, so no work is discarded."}]}, {"id": "LODGY-70", "epic": "Property Setup", "title": "All rooms should span every hostel, with a hostel filter, and move to the Property tab", "description": "Product Owner request, three changes to All rooms: show rooms across all hostels rather than only the selected one; add a filter to narrow to a hostel; and move the entry point to the Property tab. CURRENT STATE: AllRoomsViewModel takes a hostelId from the nav route and queries getByHostelIdWithFloor(hostelId), so the screen is hostel-scoped by construction. Reaching it means Property > pick a hostel > All rooms, which is exactly the drill-down LODGY-40 set out to remove - it just removed one level of it rather than two. Widening the query and adding a filter finishes that job. IMPLEMENTATION NOTES: the repository needs an all-hostels equivalent of getByHostelIdWithFloor, and the room rows need to carry their hostel so tiles can be grouped or labelled - a room number alone is ambiguous once two properties are on screen, since both can have a 101. The occupancy flow observeRoomOccupancyByHostel is likewise per-hostel and needs the same widening. The RAG tiles and summary from LODGY-67 carry over unchanged; the summary should follow the filter rather than always reporting the whole estate. OPEN QUESTION for the PO: with the screen no longer hostel-scoped, whether the hostel-level 'All rooms' action disappears entirely or stays as a shortcut that opens the screen pre-filtered to that hostel. The second keeps the useful path from a hostel you are already inside.", "acceptanceCriteria": ["All rooms lists rooms from every hostel by default, not only the selected one", "A hostel filter narrows the view, including an all-hostels option, and the empty/part-full/full summary reflects the current filter rather than the whole estate", "Each tile identifies which hostel its room belongs to, so two properties with a room 101 are not confusable", "The screen is reachable directly from the Property tab without first opening a hostel", "Tapping a tile still opens that room's bed grid regardless of which hostel it is in", "Correct in dark mode and in Hindi, and the tiles stay legible once a hostel name is added to them", "A warden with a single hostel sees no regression - the filter is unobtrusive and the screen still reads as it does today"], "status": "Todo", "priority": "Medium", "assigneeRole": "Developer", "createdAt": "2026-09-04T12:35:58+00:00", "updatedAt": "2026-09-04T12:35:58+00:00", "history": [{"timestamp": "2026-09-04T12:35:58+00:00", "actor": "Product Owner", "action": "created", "note": "Filed at the Product Owner's request: All rooms should span every hostel with a hostel filter, and move to the Property tab. Notes which repository and occupancy queries are hostel-scoped today and need widening."}]}];
const STATUSES = ["Todo", "In Progress", "Testing", "Done", "Delivered", "Won't Do"];
const COLORS = {
  "Todo": "var(--todo)", "In Progress": "var(--inprogress)",
  "Testing": "var(--testing)", "Done": "var(--done)", "Delivered": "var(--delivered)",
  "Won't Do": "var(--wontdo)"
};

function renderStats() {
  const statsEl = document.getElementById('stats');
  const total = TICKETS.length;
  statsEl.innerHTML = '';
  const totalTile = document.createElement('div');
  totalTile.className = 'stat-tile';
  totalTile.innerHTML = `<div class="num">${total}</div><div class="label">Total tickets</div>`;
  statsEl.appendChild(totalTile);

  STATUSES.forEach(s => {
    const count = TICKETS.filter(t => t.status === s).length;
    const tile = document.createElement('div');
    tile.className = 'stat-tile';
    tile.innerHTML = `<div class="num" style="color:${COLORS[s]}">${count}</div><div class="label">${s}</div>`;
    statsEl.appendChild(tile);
  });

  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  STATUSES.forEach(s => {
    const count = TICKETS.filter(t => t.status === s).length;
    if (count === 0) return;
    const seg = document.createElement('div');
    seg.style.width = (count / total * 100) + '%';
    seg.style.background = COLORS[s];
    seg.title = `${s}: ${count}`;
    bar.appendChild(seg);
  });
}

function populateEpicFilter() {
  const sel = document.getElementById('epicFilter');
  const epics = [...new Set(TICKETS.map(t => t.epic))];
  sel.innerHTML = '<option value="">All epics</option>' +
    epics.map(e => `<option value="${e}">${e}</option>`).join('');
}

function renderBoard() {
  const query = document.getElementById('search').value.toLowerCase();
  const epic = document.getElementById('epicFilter').value;
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';

  STATUSES.forEach(status => {
    const col = document.createElement('div');
    col.className = 'column';
    const items = TICKETS.filter(t => t.status === status)
      .filter(t => !epic || t.epic === epic)
      .filter(t => !query || (t.title + t.id + t.epic).toLowerCase().includes(query));

    col.innerHTML = `
      <div class="column-header" style="--col-color:${COLORS[status]}">
        <span>${status}</span><span class="count">${items.length}</span>
      </div>
      <div class="cards"></div>`;
    const cardsEl = col.querySelector('.cards');

    items.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="id">${t.id} · ${t.epic}</div>
        <div class="title">${t.title}</div>
        <div class="meta">
          <span class="badge priority-${t.priority}">${t.priority}</span>
          ${t.assigneeRole ? `<span class="badge">${t.assigneeRole}</span>` : ''}
        </div>`;
      card.addEventListener('click', () => openModal(t.id));
      cardsEl.appendChild(card);
    });

    boardEl.appendChild(col);
  });
}

function openModal(id) {
  const t = TICKETS.find(x => x.id === id);
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="modal-id">${t.id} · ${t.epic} · ${t.status}</div>
    <h2>${t.title}</h2>
    <div class="section"><h3>Description</h3><div>${t.description}</div></div>
    <div class="section"><h3>Acceptance Criteria</h3>
      <ul>${t.acceptanceCriteria.map(a => `<li>${a}</li>`).join('')}</ul>
    </div>
    <div class="section"><h3>History Trail</h3>
      ${t.history.slice().reverse().map(h => `
        <div class="history-item">
          <div>${h.action}${h.from ? ` (${h.from} → ${h.to})` : ''}${h.note ? ' — ' + h.note : ''}</div>
          <div class="h-meta">${h.actor} · ${new Date(h.timestamp).toLocaleString()}</div>
        </div>`).join('')}
    </div>`;
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});

document.getElementById('search').addEventListener('input', renderBoard);
document.getElementById('epicFilter').addEventListener('change', renderBoard);

renderStats();
populateEpicFilter();
renderBoard();
</script>
